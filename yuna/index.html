<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ข้อสอบฝึกยูน่า ป.4 - 7 ต.ค. 2026 (100 ข้อ)</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Trebuchet MS', 'Tahoma', sans-serif; margin:0; padding:0; background: linear-gradient(160deg, #e8f5e9 0%, #ede7f6 100%); color:#333; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 14px; }
  header { text-align:center; background: #66bb6a; color:#fff; border-radius:24px; padding:18px 14px; margin-bottom:14px; box-shadow: 0 6px 0 #43a047; }
  header h1 { margin:0 0 6px; font-size: 26px; }
  header .meta { font-size: 16px; opacity:.95; }
  .tabs { display:grid; grid-template-columns: repeat(5, 1fr); gap:6px; margin-bottom:14px; }
  .tab { font-family:inherit; font-size: 14px; font-weight:bold; border:none; border-radius:14px;
         padding:10px 4px; cursor:pointer; background:#fff; color:#555; box-shadow:0 3px 0 #ddd; line-height:1.3; }
  .tab .tn { display:block; font-size: 12px; font-weight:normal; opacity:.75; margin-top:2px; }
  .tab.active { background: #7e57c2; color:#fff; box-shadow:0 3px 0 #5e35b1; }
  .tab.done { background:#c8e6c9; color:#2e7d32; box-shadow:0 3px 0 #a5d6a7; }
  .tab.done.active { background: #7e57c2; color:#fff; box-shadow:0 3px 0 #5e35b1; }
  .subject-title { font-size: 20px; font-weight:bold; color:#fff; background: #7e57c2; border-radius:18px;
                   padding:12px 18px; margin: 6px 0 12px; box-shadow:0 4px 0 #5e35b1; text-align:center; }
  .progress { text-align:center; font-size: 16px; color:#777; margin-bottom:10px; }
  .q { background:#fff; border-radius:20px; padding:16px; margin-bottom:14px; box-shadow:0 4px 10px rgba(0,0,0,.08); }
  .q .num { display:inline-block; background:#ffca28; color:#5d4037; font-weight:bold; border-radius:50%;
            width:36px; height:36px; line-height:36px; text-align:center; font-size:18px; margin-right:8px; }
  .q .text { font-size: 20px; font-weight:bold; margin:4px 0 12px; }
  .opt { display:block; width:100%; text-align:left; font-size: 19px; font-family:inherit;
         background:#f5f5f5; border:3px solid #e0e0e0; border-radius:16px; padding:12px 16px; margin-bottom:9px; cursor:pointer; transition:.12s; }
  .opt:active { transform: scale(.98); }
  .opt.sel { background:#bbdefb; border-color:#2196f3; }
  .opt.correct { background:#c8e6c9; border-color:#43a047; }
  .opt.wrong { background:#ffcdd2; border-color:#e53935; }
  .explain { display:none; font-size: 16px; background:#fff8e1; border-left:6px solid #ffb300;
             border-radius:10px; padding:10px 14px; margin-top:10px; color:#6d4c00; }
  .explain.show { display:block; }
  .btnbar { text-align:center; margin:20px 0; }
  button.big { font-family:inherit; font-size: 19px; font-weight:bold; color:#fff; border:none;
               border-radius:20px; padding:14px 24px; margin:6px; cursor:pointer; }
  .checkBtn { background:#43a047; box-shadow:0 5px 0 #2e7d32; }
  .resetBtn { background:#78909c; box-shadow:0 5px 0 #546e7a; }
  .nextBtn  { background:#5c6bc0; box-shadow:0 5px 0 #3949ab; }
  button.big:active { transform: translateY(3px); box-shadow:none; }
  .scorebox { display:none; text-align:center; font-size: 22px; font-weight:bold; background:#fff;
              border-radius:24px; padding:20px; margin:16px 0; box-shadow:0 6px 14px rgba(0,0,0,.12); }
  .scorebox.show { display:block; }
  .scorebox .big-score { font-size: 38px; color:#ff6f00; }
  .scorebox .praise { font-size: 19px; margin-top:8px; }
  .total { background:#fff; border-radius:20px; padding:16px; margin:16px 0; box-shadow:0 4px 10px rgba(0,0,0,.08); }
  .total h3 { margin:0 0 10px; text-align:center; font-size: 20px; color:#555; }
  .total .row { display:flex; justify-content:space-between; font-size: 16px; padding:7px 4px; border-bottom:1px dashed #eee; }
  .total .row:last-child { border-bottom:none; font-weight:bold; color:#ff6f00; }
  footer { text-align:center; color:#999; font-size:14px; padding:18px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>✨ ข้อสอบฝึกของยูน่า ✨</h1>
    <div class="meta">ชั้น ป.4 &nbsp;•&nbsp; วันที่ 7 ต.ค. 2026 🎉</div>
    <div class="meta">5 วิชา วิชาละ 20 ข้อ &nbsp;•&nbsp; รวม 100 ข้อ 💯</div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="progress" id="progress"></div>
  <div id="quiz"></div>

  <div class="btnbar">
    <button class="big checkBtn" onclick="checkSubject()">✅ ตรวจวิชานี้</button>
    <button class="big nextBtn" onclick="nextSubject()">➡️ วิชาถัดไป</button>
    <button class="big resetBtn" onclick="resetSubject()">🔄 ทำวิชานี้ใหม่</button>
  </div>

  <div class="scorebox" id="scorebox"></div>
  <div class="total" id="total"></div>

  <footer>JND • ฝึกทำทุกวัน เก่งขึ้นทุกวัน 💪</footer>
</div>

<script>
const questions = [
  // ===== ภาษาไทย (20 ข้อ) =====
  // (ก) สำนวน สุภาษิต คำพังเพย 10 ข้อ
  { subj:1, text:"สำนวน “น้ำขึ้นให้รีบตัก” มีความหมายว่าอย่างไร?", opts:["มีโอกาสดีควรรีบทำ","ควรประหยัดน้ำ","ทำงานช้าๆ จะดีกว่า","อย่าเชื่อคนง่าย"], ans:0, exp:"หมายถึง เมื่อมีโอกาสดีก็ควรรีบคว้าไว้" },
  { subj:1, text:"สำนวน “ไก่เห็นตีนงู งูเห็นนมไก่” มีความหมายว่าอย่างไร?", opts:["สัตว์สองชนิดเป็นเพื่อนกัน","ต่างฝ่ายต่างรู้ความลับของกันและกัน","คนที่ชอบทะเลาะกัน","คนที่ช่างสังเกต"], ans:1, exp:"หมายถึง ต่างฝ่ายต่างรู้ความลับหรือจุดอ่อนของกันและกัน" },
  { subj:1, text:"สำนวน “ตำน้ำพริกละลายแม่น้ำ” มีความหมายว่าอย่างไร?", opts:["ทำอาหารเก่ง","ช่วยกันทำงานจนสำเร็จ","รักษาแม่น้ำให้สะอาด","ลงทุนลงแรงไปโดยสูญเปล่า ไม่ได้ผลคุ้มค่า"], ans:3, exp:"หมายถึง ทุ่มเทหรือลงทุนไปแต่ได้ผลน้อยหรือสูญเปล่า" },
  { subj:1, text:"สำนวน “กระต่ายตื่นตูม” ใช้กับคนแบบใด?", opts:["คนที่ตื่นเช้า","คนที่วิ่งเร็ว","คนที่ตกใจง่ายโดยไม่ไตร่ตรองให้ดีก่อน","คนที่ขยันทำงาน"], ans:2, exp:"หมายถึง คนที่ตกใจง่าย ตื่นเต้นเกินเหตุโดยไม่พิจารณาให้รอบคอบ" },
  { subj:1, text:"สำนวน “ช้าๆ ได้พร้าเล่มงาม” มีความหมายว่าอย่างไร?", opts:["ทำงานช้าจะถูกตำหนิ","ทำอย่างค่อยเป็นค่อยไปและรอบคอบ ผลงานจะออกมาดี","ควรซื้อมีดที่สวยที่สุด","ต้องรีบทำทุกอย่างให้เสร็จ"], ans:1, exp:"หมายถึง ทำอย่างใจเย็น ประณีต รอบคอบ จะได้ผลงานที่ดี" },
  { subj:1, text:"สำนวน “หนีเสือปะจระเข้” มีความหมายว่าอย่างไร?", opts:["เป็นคนกล้าหาญ","ชอบไปเที่ยวสวนสัตว์","มีเพื่อนช่วยเหลือ","หนีอันตรายหนึ่งแล้วไปพบอีกอันตรายหนึ่ง"], ans:3, exp:"หมายถึง หนีจากภัยหนึ่งแล้วกลับไปพบอีกภัยหนึ่ง" },
  { subj:1, text:"สำนวน “ปิดทองหลังพระ” หมายถึงคนแบบใด?", opts:["คนที่ทำความดีโดยไม่หวังให้ใครเห็นหรือยกย่อง","คนที่ชอบอวดความดีของตน","คนที่ไม่ชอบไปวัด","คนที่ร่ำรวยมาก"], ans:0, exp:"หมายถึง ทำความดีโดยไม่มีใครเห็น ไม่หวังชื่อเสียง" },
  { subj:1, text:"สำนวน “เข้าเมืองตาหลิ่วต้องหลิ่วตาตาม” มีความหมายว่าอย่างไร?", opts:["ต้องดูแลสายตาให้ดี","ห้ามเดินทางไปต่างเมือง","ควรปรับตัวให้เข้ากับธรรมเนียมของที่ที่เราไปอยู่","อย่าทำตามผู้อื่น"], ans:2, exp:"หมายถึง ไปอยู่ที่ใดก็ควรปฏิบัติตามธรรมเนียมของที่นั่น" },
  { subj:1, text:"“บ้านหลังหนึ่งถูกขโมยขึ้น เจ้าของจึงรีบติดกล้องวงจรปิดและเปลี่ยนกุญแจใหม่” ตรงกับสำนวนใด?", opts:["น้ำซึมบ่อทราย","ขี่ช้างจับตั๊กแตน","เกลือเป็นหนอน","วัวหายล้อมคอก"], ans:3, exp:"“วัวหายล้อมคอก” หมายถึง เกิดความเสียหายแล้วจึงคิดป้องกันแก้ไข" },
  { subj:1, text:"สำนวน “สิบปากว่าไม่เท่าตาเห็น” มีความหมายว่าอย่างไร?", opts:["ควรพูดให้น้อยลง","ได้ยินคนอื่นเล่ามามากก็ไม่เท่าเห็นด้วยตาตนเอง","ควรตรวจสายตาเป็นประจำ","คนพูดมากมักทำงานไม่เสร็จ"], ans:1, exp:"หมายถึง ฟังคนอื่นเล่ามามากเพียงใดก็ไม่แน่นอนเท่าได้เห็นด้วยตาตนเอง" },
  // (ข) ประโยคและส่วนประกอบของประโยค 10 ข้อ
  { subj:1, text:"ประโยค “นักเรียนเข้าแถวหน้าเสาธง” ภาคประธานคือข้อใด?", opts:["นักเรียน","เข้าแถว","หน้าเสาธง","เข้าแถวหน้าเสาธง"], ans:0, exp:"ภาคประธานคือผู้กระทำ ได้แก่ “นักเรียน” ส่วนที่เหลือเป็นภาคแสดง" },
  { subj:1, text:"ประโยค “คุณยายรดน้ำต้นไม้ทุกเช้า” ภาคแสดงคือข้อใด?", opts:["คุณยาย","คุณยายรดน้ำ","รดน้ำต้นไม้ทุกเช้า","ต้นไม้ทุกเช้า"], ans:2, exp:"ภาคแสดงคือส่วนที่บอกการกระทำของประธาน ได้แก่ “รดน้ำต้นไม้ทุกเช้า”" },
  { subj:1, text:"ประโยค “เด็กหญิงผมยาวร้องเพลงเพราะ” ภาคประธานคือข้อใด?", opts:["เด็กหญิง","เด็กหญิงผมยาว","ร้องเพลงเพราะ","ผมยาวร้องเพลง"], ans:1, exp:"ภาคประธานรวมประธานและคำขยายประธาน คือ “เด็กหญิงผมยาว”" },
  { subj:1, text:"ข้อใดเป็นประโยคปฏิเสธ?", opts:["ฉันชอบกินมะม่วง","ฉันไม่ชอบกินทุเรียน","เธอชอบกินอะไร","ช่วยหยิบจานให้หน่อย"], ans:1, exp:"ประโยคปฏิเสธมีคำแสดงการปฏิเสธ เช่น “ไม่”" },
  { subj:1, text:"ข้อใดเป็นประโยคคำถาม?", opts:["พรุ่งนี้โรงเรียนหยุด","ห้ามเดินลัดสนาม","พรุ่งนี้เธอจะไปไหน","น้องไม่ได้ไปเที่ยว"], ans:2, exp:"มีคำแสดงคำถาม “ไหน” ต้องการคำตอบ จึงเป็นประโยคคำถาม" },
  { subj:1, text:"ข้อใดเป็นประโยคคำสั่ง?", opts:["ห้องสมุดเงียบมาก","ใครอยู่ในห้องสมุด","ฉันไม่ได้ไปห้องสมุด","ห้ามวิ่งในห้องสมุด"], ans:3, exp:"ประโยคคำสั่งบอกให้ทำหรือห้ามทำ เช่น ขึ้นต้นด้วย “ห้าม”" },
  { subj:1, text:"เปลี่ยนประโยค “พี่ชายชอบเล่นฟุตบอล” เป็นประโยคปฏิเสธ ข้อใดถูกต้อง?", opts:["พี่ชายชอบเล่นฟุตบอลไหม","พี่ชายชอบเล่นฟุตบอลมาก","พี่ชายจงเล่นฟุตบอล","พี่ชายไม่ชอบเล่นฟุตบอล"], ans:3, exp:"เติมคำปฏิเสธ “ไม่” หน้ากริยา “ชอบ”" },
  { subj:1, text:"ประโยคประกอบด้วยส่วนสำคัญ 2 ส่วน คือข้อใด?", opts:["คำนามและคำสรรพนาม","ภาคประธานและภาคแสดง","พยัญชนะและสระ","คำถามและคำตอบ"], ans:1, exp:"ประโยคประกอบด้วยภาคประธาน (ผู้กระทำ) และภาคแสดง (การกระทำ)" },
  { subj:1, text:"ข้อใดเป็นประโยคที่สมบูรณ์ คือมีทั้งภาคประธานและภาคแสดง?", opts:["ดอกกุหลาบบานสะพรั่ง","ดอกไม้สีแดงในแจกัน","ในสวนหลังบ้าน","ดอกไม้หลากสี"], ans:0, exp:"“ดอกกุหลาบ” เป็นภาคประธาน “บานสะพรั่ง” เป็นภาคแสดง ข้ออื่นเป็นแค่กลุ่มคำ ไม่มีภาคแสดง" },
  { subj:1, text:"ประโยค “ช่วยปิดหน้าต่างให้หน่อย” เป็นประโยคชนิดใด?", opts:["ประโยคคำสั่ง (ขอร้อง)","ประโยคบอกเล่า","ประโยคปฏิเสธ","ประโยคคำถาม"], ans:0, exp:"เป็นการขอให้ผู้อื่นทำบางอย่าง จึงเป็นประโยคคำสั่งแบบขอร้อง" },
  // ===== คณิตศาสตร์ (20 ข้อ) =====
  // (ก) เศษส่วนเบื้องต้น 10 ข้อ
  { subj:2, text:"เศษส่วน 3/5 อ่านว่าอย่างไร?", opts:["เศษสามส่วนห้า", "เศษห้าส่วนสาม", "สามจุดห้า", "สามส่วนห้าเศษ"], ans:0, exp:"อ่านตัวเศษ (บน) ก่อนแล้วตามด้วยตัวส่วน (ล่าง): เศษสามส่วนห้า" },
  { subj:2, text:"แบ่งพิซซ่า 1 ถาดเป็น 8 ชิ้นเท่า ๆ กัน กินไป 3 ชิ้น พิซซ่าที่เหลือคิดเป็นเศษส่วนเท่าใดของทั้งถาด?", opts:["3/8", "5/8", "8/5", "5/3"], ans:1, exp:"เหลือ 8 − 3 = 5 ชิ้น จาก 8 ชิ้น จึงเป็น 5/8" },
  { subj:2, text:"ข้อใดเป็นเศษส่วนเกิน?", opts:["3/4", "1/2", "7/4", "5/6"], ans:2, exp:"เศษส่วนเกินคือตัวเศษมากกว่าหรือเท่ากับตัวส่วน 7 มากกว่า 4" },
  { subj:2, text:"ข้อใดเป็นเศษส่วนแท้?", opts:["9/4", "6/6", "11/10", "4/9"], ans:3, exp:"เศษส่วนแท้คือตัวเศษน้อยกว่าตัวส่วน 4 น้อยกว่า 9 (6/6 ตัวเศษเท่ากับตัวส่วน จึงเป็นเศษเกิน)" },
  { subj:2, text:"เศษส่วนเกิน 11/4 เขียนเป็นจำนวนคละได้เท่าใด?", opts:["2 3/4", "3 2/4", "2 1/4", "4 3/11"], ans:0, exp:"11 ÷ 4 = 2 เศษ 3 จึงเป็น 2 กับเศษ 3/4" },
  { subj:2, text:"จำนวนคละ 3 2/5 เขียนเป็นเศษส่วนเกินได้เท่าใด?", opts:["6/5", "17/5", "32/5", "15/5"], ans:1, exp:"(3 × 5) + 2 = 17 จึงเป็น 17/5" },
  { subj:2, text:"เศษส่วนใดเท่ากับ 2/3?", opts:["4/5", "6/8", "3/2", "8/12"], ans:3, exp:"นำ 4 คูณทั้งตัวเศษและตัวส่วน: (2×4)/(3×4) = 8/12" },

  { subj:5, text:"ภาคใต้มีทะเลขนาบ 2 ฝั่ง ได้แก่ทะเลใดบ้าง", opts:["อ่าวไทยและทะเลจีนใต้","ทะเลอันดามันและทะเลแดง","อ่าวไทยและทะเลอันดามัน","มหาสมุทรแปซิฟิกและอ่าวไทย"], ans:2, exp:"ภาคใต้ฝั่งตะวันออกติดอ่าวไทย ฝั่งตะวันตกติดทะเลอันดามัน" },
  { subj:5, text:"พืชเศรษฐกิจที่ปลูกมากที่สุดในภาคใต้ โดยกรีดลำต้นเพื่อเอาน้ำยาง คือพืชใด", opts:["ยางพารา","ข้าวโพด","ชา","ลำไย"], ans:0, exp:"ภาคใต้ปลูกยางพารามากที่สุดในประเทศ น้ำยางใช้ทำยางรถยนต์และของใช้ต่างๆ" },
  { subj:5, text:"ภาคตะวันออกเฉียงเหนือมีลักษณะภูมิประเทศส่วนใหญ่เป็นแบบใด", opts:["ที่ราบลุ่มแม่น้ำ","เทือกเขาสูงสลับหุบเขา","ชายฝั่งทะเล","ที่ราบสูง (ที่ราบสูงโคราช)"], ans:3, exp:"ภาคอีสานส่วนใหญ่เป็นที่ราบสูง เรียกว่าที่ราบสูงโคราช" },

  { subj:5, text:"ข้อใดเป็นจังหวัดในภาคตะวันตก", opts:["กาญจนบุรี","ขอนแก่น","ชลบุรี","ภูเก็ต"], ans:0, exp:"กาญจนบุรีอยู่ภาคตะวันตก ส่วนขอนแก่นอยู่ภาคอีสาน ชลบุรีภาคตะวันออก ภูเก็ตภาคใต้" },
  { subj:5, text:"แม่น้ำสายสำคัญที่กั้นพรมแดนระหว่างภาคตะวันออกเฉียงเหนือของไทยกับประเทศลาว คือแม่น้ำใด", opts:["แม่น้ำเจ้าพระยา","แม่น้ำโขง","แม่น้ำปิง","แม่น้ำแม่กลอง"], ans:1, exp:"แม่น้ำโขงไหลกั้นพรมแดนไทยกับลาวทางภาคอีสาน" },
  { subj:5, text:"ทำไมภาคเหนือจึงปลูกพืชเมืองหนาว เช่น สตรอว์เบอร์รี ได้ดี", opts:["เพราะมีอากาศเย็นบนพื้นที่สูง","เพราะติดทะเล","เพราะฝนไม่ตกเลย","เพราะดินเค็ม"], ans:0, exp:"ภาคเหนือมีภูเขาและดอยสูง อากาศเย็น เหมาะกับพืชเมืองหนาว" },
  // (ข) ทรัพยากรธรรมชาติ 10 ข้อ
  { subj:5, text:"ข้อใดเป็นทรัพยากรธรรมชาติที่ใช้แล้วหมดไป สร้างทดแทนขึ้นใหม่ไม่ได้", opts:["ป่าไม้","แสงอาทิตย์","อากาศ","น้ำมันปิโตรเลียม"], ans:3, exp:"น้ำมันเกิดใต้ดินใช้เวลาหลายล้านปี ใช้แล้วหมดไป ทดแทนไม่ได้" },
  { subj:5, text:"ข้อใดเป็นทรัพยากรธรรมชาติที่ใช้แล้วไม่หมดไป", opts:["ถ่านหิน","แสงอาทิตย์","แร่เหล็ก","ก๊าซธรรมชาติ"], ans:1, exp:"แสงอาทิตย์มีอยู่ทุกวัน ใช้เท่าไรก็ไม่หมด ส่วนตัวเลือกอื่นเป็นแร่และเชื้อเพลิงที่ใช้แล้วหมดไป" },
  { subj:5, text:"ป่าไม้จัดเป็นทรัพยากรธรรมชาติประเภทใด", opts:["ใช้แล้วหมดไปตลอดกาล","ใช้แล้วไม่มีวันหมด","ใช้แล้วทดแทนได้ เพราะปลูกขึ้นใหม่ได้","ไม่ใช่ทรัพยากรธรรมชาติ"], ans:2, exp:"ป่าไม้ใช้แล้วสามารถปลูกทดแทนได้ แต่ต้องใช้เวลานาน" },
  { subj:5, text:"การพกถุงผ้าไปซื้อของ เพื่อใช้ถุงพลาสติกให้น้อยลง ตรงกับหลัก 3R ข้อใด", opts:["Reduce (ลดการใช้)","Reuse (ใช้ซ้ำ)","Recycle (แปรรูปใช้ใหม่)","Repair (ซ่อมแซม)"], ans:0, exp:"Reduce คือการลดการใช้ เช่น ใช้ถุงพลาสติกให้น้อยลง" },
  { subj:5, text:"การนำกระดาษที่ใช้แล้วหน้าเดียว มาเขียนอีกหน้าหนึ่ง ตรงกับหลัก 3R ข้อใด", opts:["Reduce (ลดการใช้)","Reuse (ใช้ซ้ำ)","Recycle (แปรรูปใช้ใหม่)","Refuse (ปฏิเสธ)"], ans:1, exp:"Reuse คือการนำของที่ใช้แล้วกลับมาใช้อีกครั้ง" },
  { subj:5, text:"การส่งขวดพลาสติกเข้าโรงงาน เพื่อหลอมเป็นสินค้าชิ้นใหม่ ตรงกับหลัก 3R ข้อใด", opts:["Reduce (ลดการใช้)","Reuse (ใช้ซ้ำ)","Repair (ซ่อมแซม)","Recycle (แปรรูปใช้ใหม่)"], ans:3, exp:"Recycle คือการนำวัสดุไปผ่านกระบวนการแปรรูปเป็นของใหม่" },
  { subj:5, text:"ข้อใดเป็นประโยชน์ของป่าไม้", opts:["ทำให้เกิดน้ำท่วมบ่อยขึ้น","ทำให้อากาศร้อนขึ้น","เป็นแหล่งต้นน้ำและช่วยลดการพังทลายของดิน","ทำให้ดินแห้งแล้ง"], ans:2, exp:"รากต้นไม้ช่วยยึดดินและซับน้ำ ป่าไม้จึงเป็นแหล่งต้นน้ำและป้องกันดินพังทลาย" },
  { subj:5, text:"การตัดไม้ทำลายป่าจำนวนมาก ส่งผลอย่างไร", opts:["ฝนตกสม่ำเสมอมากขึ้น","สัตว์ป่ามีที่อยู่มากขึ้น","เกิดน้ำป่าไหลหลากและดินถล่มได้ง่าย","อากาศสดชื่นขึ้น"], ans:2, exp:"เมื่อไม่มีต้นไม้ยึดดินและซับน้ำ จะเกิดน้ำป่าไหลหลากและดินถล่มง่าย" },
  { subj:5, text:"ข้อใดเป็นวิธีอนุรักษ์ดิน", opts:["ปลูกหญ้าแฝกเพื่อป้องกันการพังทลายของดิน","เผาตอซังข้าวทุกปี","ตัดต้นไม้บนภูเขาให้หมด","เทสารเคมีลงดิน"], ans:0, exp:"หญ้าแฝกมีรากยาวช่วยยึดดิน ป้องกันดินพังทลาย" },
  { subj:5, text:"ข้อใดเป็นการใช้น้ำอย่างคุ้มค่า", opts:["เปิดน้ำทิ้งไว้ขณะแปรงฟัน","ล้างรถด้วยสายยางเปิดน้ำตลอดเวลา","ทิ้งน้ำล้างผักลงท่อทุกครั้ง","นำน้ำที่ล้างผักแล้วไปรดต้นไม้"], ans:3, exp:"นำน้ำที่ใช้แล้วไปใช้ประโยชน์ต่อ เป็นการใช้น้ำอย่างคุ้มค่า" }
];
const subjNames = {
  1:"📖 วิชาภาษาไทย",
  2:"🔢 วิชาคณิตศาสตร์",
  3:"🔤 วิชาภาษาอังกฤษ",
  4:"🔬 วิชาวิทยาศาสตร์",
  5:"🗺️ วิชาสังคมศึกษา"
};
const subjShort = { 1:"📖 ภาษาไทย", 2:"🔢 คณิตศาสตร์", 3:"🔤 ภาษาอังกฤษ", 4:"🔬 วิทยาศาสตร์", 5:"🗺️ สังคมศึกษา" };

const selected = {};
const checkedSubj = {};
const scoreSubj = {};
let cur = 1;
const SUBJS = [1,2,3,4,5];

function qsOf(s){ return questions.map((q,i)=>({q,i})).filter(o=>o.q.subj===s); }

function renderTabs(){
  const t = document.getElementById('tabs');
  t.innerHTML = '';
  SUBJS.forEach(s=>{
    const b = document.createElement('button');
    b.className = 'tab' + (s===cur?' active':'') + (checkedSubj[s]?' done':'');
    const short = subjShort[s];
    b.innerHTML = short + '<span class="tn">' + (checkedSubj[s] ? (scoreSubj[s]+'/'+qsOf(s).length) : '20 ข้อ') + '</span>';
    b.onclick = ()=>{ cur = s; render(); window.scrollTo({top:0,behavior:'smooth'}); };
    t.appendChild(b);
  });
}

function render(){
  renderTabs();
  const box = document.getElementById('quiz');
  box.innerHTML = '';
  const title = document.createElement('div');
  title.className = 'subject-title';
  title.textContent = subjNames[cur];
  box.appendChild(title);

  qsOf(cur).forEach((o, n)=>{
    const q = o.q, i = o.i;
    const card = document.createElement('div');
    card.className = 'q';
    let html = '<div class="text"><span class="num">'+(n+1)+'</span>'+q.text+'</div>';
    q.opts.forEach((op, oi)=>{
      let cls = 'opt';
      if (checkedSubj[cur]) {
        if (oi === q.ans) cls += ' correct';
        else if (oi === selected[i]) cls += ' wrong';
      } else if (selected[i] === oi) cls += ' sel';
      html += '<button class="'+cls+'" data-q="'+i+'" data-o="'+oi+'" onclick="pick('+i+','+oi+')">'+op+'</button>';
    });
    html += '<div class="explain'+(checkedSubj[cur]?' show':'')+'" id="exp-'+i+'">💡 เฉลย: '+q.opts[q.ans]+' — '+q.exp+'</div>';
    card.innerHTML = html;
    box.appendChild(card);
  });

  const sb = document.getElementById('scorebox');
  if (checkedSubj[cur]) showScore(scoreSubj[cur], qsOf(cur).length); else sb.classList.remove('show');
  updateProgress();
  renderTotal();
}

function updateProgress(){
  const list = qsOf(cur);
  const done = list.filter(o=>selected[o.i]!==undefined).length;
  document.getElementById('progress').textContent = 'ทำไปแล้ว ' + done + ' / ' + list.length + ' ข้อ';
}

function pick(qi, oi){
  if (checkedSubj[questions[qi].subj]) return;
  selected[qi] = oi;
  document.querySelectorAll('.opt[data-q="'+qi+'"]').forEach(b=>b.classList.remove('sel'));
  document.querySelector('.opt[data-q="'+qi+'"][data-o="'+oi+'"]').classList.add('sel');
  updateProgress();
}

function checkSubject(){
  const list = qsOf(cur);
  let score = 0;
  list.forEach(o=>{ if (selected[o.i] === o.q.ans) score++; });
  checkedSubj[cur] = true;
  scoreSubj[cur] = score;
  render();
  document.getElementById('scorebox').scrollIntoView({behavior:'smooth'});
}

function resetSubject(){
  qsOf(cur).forEach(o=>{ delete selected[o.i]; });
  delete checkedSubj[cur];
  delete scoreSubj[cur];
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function nextSubject(){
  cur = cur % 5 + 1;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function showScore(score, total){
  const pct = score/total;
  let praise, emoji;
  if (pct === 1) { praise = "สุดยอดมากลูก! ทำได้เต็มทุกข้อ!"; emoji="🏆🎉"; }
  else if (pct >= 0.8) { praise = "เก่งมากยูน่า! เกือบเต็มแล้ว!"; emoji="🌟😍"; }
  else if (pct >= 0.6) { praise = "ทำได้ดีมากลูก! พัฒนาขึ้นเรื่อยๆ!"; emoji="😊👍"; }
  else { praise = "เยี่ยมที่ตั้งใจทำจนจบ! ลองทบทวนเฉลยแล้วสู้ต่อนะ!"; emoji="🤗💪"; }
  const sb = document.getElementById('scorebox');
  sb.innerHTML = '<div>'+subjShort[cur]+'</div><div class="big-score">'+score+' / '+total+' '+emoji+'</div><div class="praise">'+praise+'</div>';
  sb.classList.add('show');
}

function renderTotal(){
  const el = document.getElementById('total');
  const doneSubjs = SUBJS.filter(s=>checkedSubj[s]);
  if (!doneSubjs.length) { el.innerHTML = '<h3>📋 ตรวจวิชาไหนแล้ว คะแนนจะมาโชว์ตรงนี้</h3>'; return; }
  let sum = 0, tot = 0, rows = '';
  SUBJS.forEach(s=>{
    const n = qsOf(s).length;
    if (checkedSubj[s]) { sum += scoreSubj[s]; tot += n; rows += '<div class="row"><span>'+subjShort[s]+'</span><span>'+scoreSubj[s]+' / '+n+'</span></div>'; }
  });
  rows += '<div class="row"><span>รวมทั้งหมด</span><span>'+sum+' / '+tot+'</span></div>';
  el.innerHTML = '<h3>🏅 สรุปคะแนน</h3>' + rows;
}

render();
</script>
