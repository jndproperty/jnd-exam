<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ข้อสอบฝึกยูน่า ป.4 - 28 ก.ค. 2026 (ชุด C)</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Tahoma', 'Sarabun', sans-serif;
    margin: 0; padding: 0;
    background: linear-gradient(160deg, #e3f2fd 0%, #e8f5e9 100%);
    color: #263238;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
  header {
    text-align: center; background: #5c6bc0; color: #fff;
    border-radius: 20px; padding: 22px 16px; margin-bottom: 16px;
    box-shadow: 0 5px 0 #3f51b5;
  }
  header h1 { margin: 0 0 6px; font-size: 26px; }
  header .meta { font-size: 16px; opacity: .95; }
  .subject-title {
    font-size: 20px; font-weight: bold; color: #fff;
    background: #7e57c2; border-radius: 14px;
    padding: 11px 18px; margin: 22px 0 12px;
    box-shadow: 0 4px 0 #5e35b1;
  }
  .subject-title.s2 { background: #00897b; box-shadow: 0 4px 0 #00695c; }
  .q {
    background: #fff; border-radius: 16px; padding: 16px 18px;
    margin-bottom: 14px; box-shadow: 0 3px 8px rgba(0,0,0,.07);
  }
  .q .num {
    display: inline-block; background: #ffb74d; color: #4e342e;
    font-weight: bold; border-radius: 50%; width: 30px; height: 30px;
    line-height: 30px; text-align: center; font-size: 16px; margin-right: 8px;
  }
  .q .text { font-size: 19px; font-weight: bold; margin: 4px 0 12px; }
  .opt {
    display: block; width: 100%; text-align: left;
    font-size: 18px; font-family: inherit;
    background: #f5f5f5; border: 2px solid #e0e0e0;
    border-radius: 12px; padding: 11px 16px; margin-bottom: 8px;
    cursor: pointer; transition: .12s;
  }
  .opt:active { transform: scale(.99); }
  .opt.sel { background: #bbdefb; border-color: #2196f3; }
  .opt.correct { background: #c8e6c9; border-color: #43a047; }
  .opt.wrong { background: #ffcdd2; border-color: #e53935; }
  .explain {
    display: none; font-size: 16px; background: #fff8e1;
    border-left: 5px solid #ffb300; border-radius: 8px;
    padding: 9px 13px; margin-top: 9px; color: #6d4c00;
  }
  .explain.show { display: block; }
  .btnbar { text-align: center; margin: 24px 0; }
  button.big {
    font-family: inherit; font-size: 20px; font-weight: bold;
    color: #fff; border: none; border-radius: 16px;
    padding: 14px 26px; margin: 8px; cursor: pointer;
  }
  #checkBtn { background: #43a047; box-shadow: 0 5px 0 #2e7d32; }
  #resetBtn { background: #78909c; box-shadow: 0 5px 0 #546e7a; }
  button.big:active { transform: translateY(3px); box-shadow: none; }
  #scorebox {
    display: none; text-align: center; font-size: 22px; font-weight: bold;
    background: #fff; border-radius: 20px; padding: 22px;
    margin: 18px 0; box-shadow: 0 5px 12px rgba(0,0,0,.12);
  }
  #scorebox.show { display: block; }
  #scorebox .big-score { font-size: 40px; color: #f57c00; }
  #scorebox .praise { font-size: 20px; margin-top: 8px; }
  footer { text-align: center; color: #999; font-size: 13px; padding: 20px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>✨ ข้อสอบฝึกของยูน่า ✨</h1>
    <div class="meta">ชั้น ป.4 &nbsp;•&nbsp; วันที่ 28 ก.ค. 2026 &nbsp;•&nbsp; ชุด C 🎉</div>
    <div class="meta">วิชา: ภาษาอังกฤษ 🔤 + ศิลปะ 🎨</div>
  </header>

  <div id="quiz"></div>

  <div class="btnbar">
    <button class="big" id="checkBtn" onclick="checkAll()">✅ ตรวจคำตอบ</button>
    <button class="big" id="resetBtn" onclick="resetAll()">🔄 ทำใหม่</button>
  </div>

  <div id="scorebox"></div>

  <footer>JND • ฝึกทำทุกวัน เก่งขึ้นทุกวัน 💪</footer>
</div>

<script>
const questions = [
  // ===== ภาษาอังกฤษ: Present Simple & Vocabulary (15 ข้อ) =====
  { subj:1, text:"เติมคำให้ถูกต้อง: “I ___ a student.”", opts:["am","is","are","be"], ans:0, exp:"ประธาน I ใช้ am → I am a student." },
  { subj:1, text:"เติมคำให้ถูกต้อง: “She ___ to school every day.”", opts:["go","goes","going","went"], ans:1, exp:"ประธานเอกพจน์ (She) ใน Present Simple เติม -s → goes" },
  { subj:1, text:"เติมคำให้ถูกต้อง: “They ___ football on Sunday.”", opts:["plays","playing","play","played"], ans:2, exp:"ประธานพหูพจน์ (They) ใช้กริยารูปเดิม → play" },
  { subj:1, text:"เติมคำให้ถูกต้อง: “He ___ a teacher.”", opts:["am","are","is","be"], ans:2, exp:"ประธาน He ใช้ is → He is a teacher." },
  { subj:1, text:"คำว่า “book” แปลว่าอะไร?", opts:["ปากกา","หนังสือ","โต๊ะ","กระเป๋า"], ans:1, exp:"book = หนังสือ 📖" },
  { subj:1, text:"เติมคำให้ถูกต้อง: “We ___ happy today.”", opts:["is","am","are","be"], ans:2, exp:"ประธาน We ใช้ are → We are happy." },
  { subj:1, text:"ประโยคปฏิเสธข้อใดถูกต้อง?", opts:["I not like it.","I don't like it.","I doesn't like it.","I am not like it."], ans:1, exp:"ประธาน I ใช้ don't + กริยา → I don't like it." },
  { subj:1, text:"เติมคำให้ถูกต้อง: “My mother ___ dinner every evening.”", opts:["cook","cooks","cooking","cooked"], ans:1, exp:"ประธานเอกพจน์ (mother) เติม -s → cooks" },
  { subj:1, text:"คำว่า “water” แปลว่าอะไร?", opts:["ไฟ","น้ำ","ลม","ดิน"], ans:1, exp:"water = น้ำ 💧" },
  { subj:1, text:"เปลี่ยนเป็นประโยคคำถาม: “You like apples.”", opts:["Do you like apples?","Does you like apples?","You do like apples?","Are you like apples?"], ans:0, exp:"ประธาน You ใช้ Do ขึ้นต้น → Do you like apples?" },
  { subj:1, text:"เติมคำให้ถูกต้อง: “A cat ___ four legs.”", opts:["have","has","having","haves"], ans:1, exp:"ประธานเอกพจน์ (A cat) ใช้ has → A cat has four legs." },
  { subj:1, text:"คำว่า “morning” หมายถึงช่วงเวลาใด?", opts:["ตอนเช้า","ตอนเที่ยง","ตอนเย็น","ตอนกลางคืน"], ans:0, exp:"morning = ตอนเช้า 🌅" },
  { subj:1, text:"เติมคำให้ถูกต้อง: “The sun ___ in the east.”", opts:["rise","rises","rising","rose"], ans:1, exp:"ข้อเท็จจริงทั่วไปใช้ Present Simple, ประธานเอกพจน์เติม -s → rises" },
  { subj:1, text:"คำใดแปลว่า “โรงเรียน”?", opts:["hospital","school","market","temple"], ans:1, exp:"school = โรงเรียน 🏫" },
  { subj:1, text:"เติมคำให้ถูกต้อง: “I ___ my teeth every morning.”", opts:["brush","brushes","brushing","brushed"], ans:0, exp:"ประธาน I ใช้กริยารูปเดิม → brush" },

  // ===== ศิลปะ: ทัศนธาตุ (จุด เส้น สี รูปร่าง รูปทรง) (15 ข้อ) =====
  { subj:2, text:"ทัศนธาตุที่เล็กที่สุดและเป็นจุดเริ่มต้นของงานทัศนศิลป์คืออะไร?", opts:["เส้น","จุด","สี","รูปทรง"], ans:1, exp:"จุด (Dot) เป็นทัศนธาตุพื้นฐานที่เล็กที่สุด" },
  { subj:2, text:"จุดหลายๆ จุดที่เรียงต่อกันจะกลายเป็นทัศนธาตุใด?", opts:["สี","เส้น","รูปทรง","พื้นผิว"], ans:1, exp:"จุดเรียงต่อกันเกิดเป็นเส้น" },
  { subj:2, text:"แม่สี (สีขั้นที่ 1) มี 3 สี คือสีใด?", opts:["แดง เขียว น้ำเงิน","แดง เหลือง น้ำเงิน","ส้ม เขียว ม่วง","ดำ ขาว เทา"], ans:1, exp:"แม่สีคือ แดง เหลือง น้ำเงิน" },
  { subj:2, text:"สีแดง + สีเหลือง ผสมกันได้สีขั้นที่ 2 คือสีใด?", opts:["เขียว","ม่วง","ส้ม","น้ำตาล"], ans:2, exp:"แดง + เหลือง = ส้ม" },
  { subj:2, text:"สีน้ำเงิน + สีแดง ผสมกันได้สีใด?", opts:["เขียว","ส้ม","ม่วง","ชมพู"], ans:2, exp:"น้ำเงิน + แดง = ม่วง" },
  { subj:2, text:"สีเหลือง + สีน้ำเงิน ผสมกันได้สีใด?", opts:["เขียว","ส้ม","ม่วง","แดง"], ans:0, exp:"เหลือง + น้ำเงิน = เขียว" },
  { subj:2, text:"เส้นแบบใดให้ความรู้สึกสงบ นิ่ง มั่นคง?", opts:["เส้นหยัก","เส้นนอน","เส้นเฉียง","เส้นซิกแซ็ก"], ans:1, exp:"เส้นนอน (แนวราบ) ให้ความรู้สึกสงบ นิ่ง" },
  { subj:2, text:"เส้นตั้ง (แนวดิ่ง) มักให้ความรู้สึกอย่างไร?", opts:["อ่อนโยน","สูงสง่า มั่นคง แข็งแรง","วุ่นวาย","เคลื่อนไหวรวดเร็ว"], ans:1, exp:"เส้นตั้งให้ความรู้สึกสูงสง่า มั่นคง แข็งแรง" },
  { subj:2, text:"“รูปร่าง” (shape) ต่างจาก “รูปทรง” (form) อย่างไร?", opts:["รูปร่าง 3 มิติ รูปทรง 2 มิติ","รูปร่าง 2 มิติ รูปทรง 3 มิติ","เหมือนกันทุกอย่าง","รูปร่างต้องมีสีเสมอ"], ans:1, exp:"รูปร่างเป็น 2 มิติ (กว้าง-ยาว) ส่วนรูปทรงเป็น 3 มิติ (มีความหนา/ลึก)" },
  { subj:2, text:"ทัศนธาตุที่เกิดจากแสงตกกระทบวัตถุ ทำให้เห็นส่วนสว่าง-มืด เรียกว่าอะไร?", opts:["พื้นผิว","น้ำหนัก (แสงเงา)","จุด","เส้น"], ans:1, exp:"น้ำหนัก/แสงเงา บอกความอ่อน-แก่ของสว่างและมืด" },
  { subj:2, text:"ความรู้สึกที่ได้จากการสัมผัสผิวของวัตถุ เช่น หยาบ เรียบ เรียกว่าทัศนธาตุใด?", opts:["สี","พื้นผิว","เส้น","จุด"], ans:1, exp:"พื้นผิว (Texture) คือลักษณะผิวของวัตถุ หยาบ เรียบ ขรุขระ" },
  { subj:2, text:"วงกลม สามเหลี่ยม สี่เหลี่ยม จัดเป็นทัศนธาตุประเภทใด?", opts:["สี","เส้น","น้ำหนัก","รูปร่าง"], ans:3, exp:"วงกลม สามเหลี่ยม สี่เหลี่ยม เป็นรูปร่าง (2 มิติ)" },
  { subj:2, text:"สีใดต่อไปนี้เป็น “สีขั้นที่ 2” (สีผสม)?", opts:["สีแดง","สีเขียว","สีเหลือง","สีน้ำเงิน"], ans:1, exp:"สีเขียวเกิดจากเหลือง+น้ำเงิน จึงเป็นสีขั้นที่ 2 (แดง เหลือง น้ำเงิน เป็นแม่สี)" },
  { subj:2, text:"กลุ่มสีที่ให้ความรู้สึกอบอุ่น (สีโทนร้อน) คือกลุ่มใด?", opts:["แดง ส้ม เหลือง","น้ำเงิน เขียว ม่วง","ดำ ขาว เทา","ชมพู ฟ้า"], ans:0, exp:"สีโทนร้อน ได้แก่ แดง ส้ม เหลือง ให้ความรู้สึกอบอุ่น" },
  { subj:2, text:"เส้นที่ให้ความรู้สึกเคลื่อนไหว ตื่นเต้น ไม่สงบ คือเส้นแบบใด?", opts:["เส้นนอน","เส้นตรงแนวตั้ง","เส้นซิกแซ็ก","เส้นตรง"], ans:2, exp:"เส้นซิกแซ็ก/หยัก ให้ความรู้สึกเคลื่อนไหว ตื่นเต้น" }
];

const subjNames = { 1:"🔤 วิชาภาษาอังกฤษ — Present Simple & Vocabulary", 2:"🎨 วิชาศิลปะ — ทัศนธาตุ" };
const selected = {};
let checked = false;

function render() {
  const box = document.getElementById('quiz');
  box.innerHTML = '';
  let lastSubj = null;
  questions.forEach((q, i) => {
    if (q.subj !== lastSubj) {
      const t = document.createElement('div');
      t.className = 'subject-title' + (q.subj===2 ? ' s2' : '');
      t.textContent = subjNames[q.subj];
      box.appendChild(t);
      lastSubj = q.subj;
    }
    const card = document.createElement('div');
    card.className = 'q';
    const numInSubj = questions.slice(0,i+1).filter(x=>x.subj===q.subj).length;
    let html = '<div class="text"><span class="num">'+numInSubj+'</span>'+q.text+'</div>';
    q.opts.forEach((o, oi) => {
      html += '<button class="opt" data-q="'+i+'" data-o="'+oi+'" onclick="pick('+i+','+oi+')">'+o+'</button>';
    });
    html += '<div class="explain" id="exp-'+i+'">💡 เฉลย: '+q.opts[q.ans]+' — '+q.exp+'</div>';
    card.innerHTML = html;
    box.appendChild(card);
  });
}

function pick(qi, oi) {
  if (checked) return;
  selected[qi] = oi;
  document.querySelectorAll('.opt[data-q="'+qi+'"]').forEach(b => b.classList.remove('sel'));
  document.querySelector('.opt[data-q="'+qi+'"][data-o="'+oi+'"]').classList.add('sel');
}

function checkAll() {
  checked = true;
  let score = 0;
  questions.forEach((q, i) => {
    const sel = selected[i];
    document.querySelectorAll('.opt[data-q="'+i+'"]').forEach(b => {
      const oi = +b.dataset.o;
      b.classList.remove('sel');
      if (oi === q.ans) b.classList.add('correct');
      if (oi === sel && sel !== q.ans) b.classList.add('wrong');
    });
    document.getElementById('exp-'+i).classList.add('show');
    if (sel === q.ans) score++;
  });
  showScore(score);
}

function showScore(score) {
  const total = questions.length;
  const pct = score/total;
  let praise, emoji;
  if (pct === 1) { praise = "สุดยอดมากลูก! ทำได้เต็มทุกข้อ!"; emoji="🏆🎉"; }
  else if (pct >= 0.8) { praise = "เก่งมากยูน่า! เกือบเต็มแล้ว!"; emoji="🌟😍"; }
  else if (pct >= 0.6) { praise = "ทำได้ดีมากลูก! พัฒนาขึ้นเรื่อยๆ!"; emoji="😊👍"; }
  else { praise = "เยี่ยมที่ตั้งใจทำจนจบ! ลองทบทวนเฉลยแล้วสู้ต่อนะ!"; emoji="🤗💪"; }
  const sb = document.getElementById('scorebox');
  sb.innerHTML = '<div>ได้คะแนน</div><div class="big-score">'+score+' / '+total+' '+emoji+'</div><div class="praise">'+praise+'</div>';
  sb.classList.add('show');
  sb.scrollIntoView({behavior:'smooth'});
}

function resetAll() {
  checked = false;
  for (const k in selected) delete selected[k];
  document.getElementById('scorebox').classList.remove('show');
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

render();
</script>
</body>
</html>
