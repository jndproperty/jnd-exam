<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ข้อสอบฝึกยูน่า ป.4 - 28 ก.ค. 2026 (ชุด B ใหม่)</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Tahoma', 'Sarabun', sans-serif;
    margin: 0; padding: 0;
    background: linear-gradient(160deg, #e3f2fd 0%, #e8f5e9 100%);
    color: #263238;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
  header {
    text-align: center; background: #5c6bc0; color: #fff;
    border-radius: 20px; padding: 22px 16px; margin-bottom: 16px;
    box-shadow: 0 5px 0 #3f51b5;
  }
  header h1 { margin: 0 0 6px; font-size: 26px; }
  header .meta { font-size: 16px; opacity: .95; }
  .subject-title {
    font-size: 20px; font-weight: bold; color: #fff;
    background: #7e57c2; border-radius: 14px;
    padding: 11px 18px; margin: 22px 0 12px;
    box-shadow: 0 4px 0 #5e35b1;
  }
  .subject-title.s2 { background: #00897b; box-shadow: 0 4px 0 #00695c; }
  .q {
    background: #fff; border-radius: 16px; padding: 16px 18px;
    margin-bottom: 14px; box-shadow: 0 3px 8px rgba(0,0,0,.07);
  }
  .q .num {
    display: inline-block; background: #ffb74d; color: #4e342e;
    font-weight: bold; border-radius: 50%; width: 30px; height: 30px;
    line-height: 30px; text-align: center; font-size: 16px; margin-right: 8px;
  }
  .q .text { font-size: 19px; font-weight: bold; margin: 4px 0 12px; }
  .opt {
    display: block; width: 100%; text-align: left;
    font-size: 18px; font-family: inherit;
    background: #f5f5f5; border: 2px solid #e0e0e0;
    border-radius: 12px; padding: 11px 16px; margin-bottom: 8px;
    cursor: pointer; transition: .12s;
  }
  .opt:active { transform: scale(.99); }
  .opt.sel { background: #bbdefb; border-color: #2196f3; }
  .opt.correct { background: #c8e6c9; border-color: #43a047; }
  .opt.wrong { background: #ffcdd2; border-color: #e53935; }
  .explain {
    display: none; font-size: 16px; background: #fff8e1;
    border-left: 5px solid #ffb300; border-radius: 8px;
    padding: 9px 13px; margin-top: 9px; color: #6d4c00;
  }
  .explain.show { display: block; }
  .btnbar { text-align: center; margin: 24px 0; }
  button.big {
    font-family: inherit; font-size: 20px; font-weight: bold;
    color: #fff; border: none; border-radius: 16px;
    padding: 14px 26px; margin: 8px; cursor: pointer;
  }
  #checkBtn { background: #43a047; box-shadow: 0 5px 0 #2e7d32; }
  #resetBtn { background: #78909c; box-shadow: 0 5px 0 #546e7a; }
  button.big:active { transform: translateY(3px); box-shadow: none; }
  #scorebox {
    display: none; text-align: center; font-size: 22px; font-weight: bold;
    background: #fff; border-radius: 20px; padding: 22px;
    margin: 18px 0; box-shadow: 0 5px 12px rgba(0,0,0,.12);
  }
  #scorebox.show { display: block; }
  #scorebox .big-score { font-size: 40px; color: #f57c00; }
  #scorebox .praise { font-size: 20px; margin-top: 8px; }
  footer { text-align: center; color: #999; font-size: 13px; padding: 20px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>✨ ข้อสอบฝึกของยูน่า ✨</h1>
    <div class="meta">ชั้น ป.4 &nbsp;•&nbsp; วันที่ 28 ก.ค. 2026 &nbsp;•&nbsp; ชุด B ใหม่ 🎉</div>
    <div class="meta">วิชา: คณิตศาสตร์ ➕ + สุขศึกษา ❤️</div>
  </header>

  <div id="quiz"></div>

  <div class="btnbar">
    <button class="big" id="checkBtn" onclick="checkAll()">✅ ตรวจคำตอบ</button>
    <button class="big" id="resetBtn" onclick="resetAll()">🔄 ทำใหม่</button>
  </div>

  <div id="scorebox"></div>

  <footer>JND • ฝึกทำทุกวัน เก่งขึ้นทุกวัน 💪</footer>
</div>

<script>
const questions = [
  // ===== คณิตศาสตร์: การบวก/ลบจำนวนหลักหมื่น–แสน (15 ข้อ) =====
  { subj:1, text:"25,000 + 13,000 = ?", opts:["38,000","12,000","35,000","48,000"], ans:0, exp:"25,000 + 13,000 = 38,000" },
  { subj:1, text:"60,000 − 25,000 = ?", opts:["45,000","35,000","25,000","85,000"], ans:1, exp:"60,000 − 25,000 = 35,000" },
  { subj:1, text:"120,000 + 45,000 = ?", opts:["165,000","155,000","75,000","175,000"], ans:0, exp:"120,000 + 45,000 = 165,000" },
  { subj:1, text:"88,000 − 40,000 = ?", opts:["128,000","48,000","42,000","58,000"], ans:1, exp:"88,000 − 40,000 = 48,000" },
  { subj:1, text:"200,000 + 150,000 = ?", opts:["50,000","350,000","300,000","250,000"], ans:1, exp:"200,000 + 150,000 = 350,000" },
  { subj:1, text:"45,600 + 22,300 = ?", opts:["67,900","23,300","68,900","67,300"], ans:0, exp:"45,600 + 22,300 = 67,900" },
  { subj:1, text:"90,000 − 12,500 = ?", opts:["78,500","77,500","82,500","77,000"], ans:1, exp:"90,000 − 12,500 = 77,500" },
  { subj:1, text:"300,000 − 100,000 = ?", opts:["400,000","100,000","200,000","250,000"], ans:2, exp:"300,000 − 100,000 = 200,000" },
  { subj:1, text:"15,000 + 15,000 + 15,000 = ?", opts:["30,000","45,000","45,500","50,000"], ans:1, exp:"15,000 × 3 = 45,000" },
  { subj:1, text:"75,000 − 25,000 = ?", opts:["50,000","100,000","55,000","40,000"], ans:0, exp:"75,000 − 25,000 = 50,000" },
  { subj:1, text:"340,000 + 60,000 = ?", opts:["400,000","380,000","340,600","460,000"], ans:0, exp:"340,000 + 60,000 = 400,000" },
  { subj:1, text:"99,999 + 1 = ?", opts:["99,000","100,000","10,000","100,001"], ans:1, exp:"99,999 + 1 = 100,000" },
  { subj:1, text:"ซื้อของ 2 ชิ้น ราคาชิ้นละ 35,000 บาท รวมเป็นเงินเท่าใด?", opts:["70,000","35,000","65,000","75,000"], ans:0, exp:"35,000 × 2 = 70,000 บาท" },
  { subj:1, text:"500,000 − 250,000 = ?", opts:["750,000","200,000","250,000","350,000"], ans:2, exp:"500,000 − 250,000 = 250,000" },
  { subj:1, text:"12,000 + 8,000 = ?", opts:["20,000","18,000","22,000","10,000"], ans:0, exp:"12,000 + 8,000 = 20,000" },

  // ===== สุขศึกษา: ระบบไหลเวียนเลือด / กล้ามเนื้อและกระดูก (15 ข้อ) =====
  { subj:2, text:"อวัยวะใดทำหน้าที่สูบฉีดเลือดไปเลี้ยงทั่วร่างกาย?", opts:["ปอด","หัวใจ","ตับ","ไต"], ans:1, exp:"หัวใจสูบฉีดเลือดไปเลี้ยงทั่วร่างกาย ❤️" },
  { subj:2, text:"ท่อที่นำเลือดไปเลี้ยงส่วนต่างๆ ของร่างกาย เรียกว่าอะไร?", opts:["หลอดเลือด","หลอดลม","หลอดอาหาร","ลำไส้"], ans:0, exp:"เลือดไหลไปตามหลอดเลือดทั่วร่างกาย" },
  { subj:2, text:"เลือดทำหน้าที่ลำเลียงสิ่งใดไปเลี้ยงเซลล์ร่างกาย?", opts:["อากาศเสีย","ออกซิเจนและสารอาหาร","น้ำลาย","เหงื่อ"], ans:1, exp:"เลือดลำเลียงออกซิเจนและสารอาหารไปเลี้ยงเซลล์" },
  { subj:2, text:"อวัยวะใดเป็นศูนย์กลางของระบบไหลเวียนเลือด?", opts:["กระเพาะ","ปอด","หัวใจ","สมอง"], ans:2, exp:"หัวใจเป็นศูนย์กลางของระบบไหลเวียนเลือด" },
  { subj:2, text:"การเต้นของหัวใจที่รู้สึกได้เมื่อจับที่ข้อมือ เรียกว่าอะไร?", opts:["ชีพจร","ลมหายใจ","เหงื่อ","น้ำเหลือง"], ans:0, exp:"จังหวะที่จับได้ที่ข้อมือ เรียกว่า ชีพจร" },
  { subj:2, text:"โครงสร้างที่เป็นแกนค้ำจุนร่างกายและช่วยให้ยืน/เคลื่อนไหวได้ คืออะไร?", opts:["ผิวหนัง","กระดูก","เส้นผม","เล็บ"], ans:1, exp:"กระดูกเป็นโครงค้ำจุนร่างกาย" },
  { subj:2, text:"กระดูกหลายชิ้นต่อกันเป็นโครงร่างของร่างกาย เรียกว่าอะไร?", opts:["ระบบหายใจ","โครงกระดูก","ระบบย่อยอาหาร","ผิวหนัง"], ans:1, exp:"กระดูกหลายชิ้นประกอบเป็นโครงกระดูก" },
  { subj:2, text:"ส่วนใดของร่างกายที่หดและคลายตัว ทำให้เราเคลื่อนไหวได้?", opts:["กล้ามเนื้อ","กระดูก","เล็บ","ผม"], ans:0, exp:"กล้ามเนื้อหดและคลายตัวทำให้เคลื่อนไหว" },
  { subj:2, text:"เพื่อให้กระดูกแข็งแรง เราควรกินอาหารที่มีสารใด?", opts:["น้ำตาล","แคลเซียม","ไขมันทรานส์","ผงชูรส"], ans:1, exp:"แคลเซียม (เช่นในนม) ช่วยให้กระดูกแข็งแรง" },
  { subj:2, text:"อาหารข้อใดมีแคลเซียมสูง ช่วยบำรุงกระดูกและฟัน?", opts:["น้ำอัดลม","นม","ลูกอม","มันฝรั่งทอด"], ans:1, exp:"นมมีแคลเซียมสูง บำรุงกระดูกและฟัน 🥛" },
  { subj:2, text:"รอยต่อระหว่างกระดูกที่ช่วยให้เรางอ-เหยียดได้ เรียกว่าอะไร?", opts:["ข้อต่อ","กล้ามเนื้อ","หลอดเลือด","ผิวหนัง"], ans:0, exp:"ข้อต่อคือรอยต่อของกระดูกที่ช่วยให้เคลื่อนไหวได้" },
  { subj:2, text:"การออกกำลังกายสม่ำเสมอ มีประโยชน์ต่อร่างกายอย่างไร?", opts:["ทำให้กระดูกเปราะ","ทำให้หัวใจและกล้ามเนื้อแข็งแรง","ทำให้หัวใจอ่อนแอ","ไม่มีผล"], ans:1, exp:"ออกกำลังกายช่วยให้หัวใจและกล้ามเนื้อแข็งแรง" },
  { subj:2, text:"เลือดที่มีออกซิเจนสูง ถูกสูบออกจากหัวใจไปเลี้ยงร่างกายผ่านหลอดเลือดชนิดใด?", opts:["หลอดเลือดดำ","หลอดเลือดแดง","หลอดลม","หลอดอาหาร"], ans:1, exp:"หลอดเลือดแดงนำเลือดออกจากหัวใจไปเลี้ยงร่างกาย" },
  { subj:2, text:"เพื่อให้หัวใจแข็งแรง เราควรหลีกเลี่ยงสิ่งใด?", opts:["อาหารมันจัดและการสูบบุหรี่","การออกกำลังกาย","การกินผักผลไม้","การนอนพักผ่อน"], ans:0, exp:"ควรเลี่ยงอาหารมันจัดและควันบุหรี่ เพื่อหัวใจแข็งแรง" },
  { subj:2, text:"กล้ามเนื้อทำงานร่วมกับสิ่งใด เพื่อให้ร่างกายเคลื่อนไหว?", opts:["กระดูกและข้อต่อ","เส้นผม","เล็บ","ต่อมเหงื่อ"], ans:0, exp:"กล้ามเนื้อทำงานร่วมกับกระดูกและข้อต่อในการเคลื่อนไหว" }
];

const subjNames = { 1:"➕ วิชาคณิตศาสตร์ — การบวก/ลบจำนวนหลักหมื่น–แสน", 2:"❤️ วิชาสุขศึกษา — ระบบไหลเวียนเลือด กล้ามเนื้อและกระดูก" };
const selected = {};
let checked = false;

function render() {
  const box = document.getElementById('quiz');
  box.innerHTML = '';
  let lastSubj = null;
  questions.forEach((q, i) => {
    if (q.subj !== lastSubj) {
      const t = document.createElement('div');
      t.className = 'subject-title' + (q.subj===2 ? ' s2' : '');
      t.textContent = subjNames[q.subj];
      box.appendChild(t);
      lastSubj = q.subj;
    }
    const card = document.createElement('div');
    card.className = 'q';
    const numInSubj = questions.slice(0,i+1).filter(x=>x.subj===q.subj).length;
    let html = '<div class="text"><span class="num">'+numInSubj+'</span>'+q.text+'</div>';
    q.opts.forEach((o, oi) => {
      html += '<button class="opt" data-q="'+i+'" data-o="'+oi+'" onclick="pick('+i+','+oi+')">'+o+'</button>';
    });
    html += '<div class="explain" id="exp-'+i+'">💡 เฉลย: '+q.opts[q.ans]+' — '+q.exp+'</div>';
    card.innerHTML = html;
    box.appendChild(card);
  });
}

function pick(qi, oi) {
  if (checked) return;
  selected[qi] = oi;
  document.querySelectorAll('.opt[data-q="'+qi+'"]').forEach(b => b.classList.remove('sel'));
  document.querySelector('.opt[data-q="'+qi+'"][data-o="'+oi+'"]').classList.add('sel');
}

function checkAll() {
  checked = true;
  let score = 0;
  questions.forEach((q, i) => {
    const sel = selected[i];
    document.querySelectorAll('.opt[data-q="'+i+'"]').forEach(b => {
      const oi = +b.dataset.o;
      b.classList.remove('sel');
      if (oi === q.ans) b.classList.add('correct');
      if (oi === sel && sel !== q.ans) b.classList.add('wrong');
    });
    document.getElementById('exp-'+i).classList.add('show');
    if (sel === q.ans) score++;
  });
  showScore(score);
}

function showScore(score) {
  const total = questions.length;
  const pct = score/total;
  let praise, emoji;
  if (pct === 1) { praise = "สุดยอดมากลูก! ทำได้เต็มทุกข้อ!"; emoji="🏆🎉"; }
  else if (pct >= 0.8) { praise = "เก่งมากยูน่า! เกือบเต็มแล้ว!"; emoji="🌟😍"; }
  else if (pct >= 0.6) { praise = "ทำได้ดีมากลูก! พัฒนาขึ้นเรื่อยๆ!"; emoji="😊👍"; }
  else { praise = "เยี่ยมที่ตั้งใจทำจนจบ! ลองทบทวนเฉลยแล้วสู้ต่อนะ!"; emoji="🤗💪"; }
  const sb = document.getElementById('scorebox');
  sb.innerHTML = '<div>ได้คะแนน</div><div class="big-score">'+score+' / '+total+' '+emoji+'</div><div class="praise">'+praise+'</div>';
  sb.classList.add('show');
  sb.scrollIntoView({behavior:'smooth'});
}

function resetAll() {
  checked = false;
  for (const k in selected) delete selected[k];
  document.getElementById('scorebox').classList.remove('show');
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

render();
</script>
</body>
</html>
