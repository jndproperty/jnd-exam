<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ข้อสอบฝึกยูน่า ป.4 - 28 ก.ค. 2026 (ชุด D)</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Tahoma', 'Sarabun', sans-serif;
    margin: 0; padding: 0;
    background: linear-gradient(160deg, #e3f2fd 0%, #e8f5e9 100%);
    color: #263238;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
  header {
    text-align: center; background: #5c6bc0; color: #fff;
    border-radius: 20px; padding: 22px 16px; margin-bottom: 16px;
    box-shadow: 0 5px 0 #3f51b5;
  }
  header h1 { margin: 0 0 6px; font-size: 26px; }
  header .meta { font-size: 16px; opacity: .95; }
  .subject-title {
    font-size: 20px; font-weight: bold; color: #fff;
    background: #7e57c2; border-radius: 14px;
    padding: 11px 18px; margin: 22px 0 12px;
    box-shadow: 0 4px 0 #5e35b1;
  }
  .subject-title.s2 { background: #00897b; box-shadow: 0 4px 0 #00695c; }
  .q {
    background: #fff; border-radius: 16px; padding: 16px 18px;
    margin-bottom: 14px; box-shadow: 0 3px 8px rgba(0,0,0,.07);
  }
  .q .num {
    display: inline-block; background: #ffb74d; color: #4e342e;
    font-weight: bold; border-radius: 50%; width: 30px; height: 30px;
    line-height: 30px; text-align: center; font-size: 16px; margin-right: 8px;
  }
  .q .text { font-size: 19px; font-weight: bold; margin: 4px 0 12px; }
  .opt {
    display: block; width: 100%; text-align: left;
    font-size: 18px; font-family: inherit;
    background: #f5f5f5; border: 2px solid #e0e0e0;
    border-radius: 12px; padding: 11px 16px; margin-bottom: 8px;
    cursor: pointer; transition: .12s;
  }
  .opt:active { transform: scale(.99); }
  .opt.sel { background: #bbdefb; border-color: #2196f3; }
  .opt.correct { background: #c8e6c9; border-color: #43a047; }
  .opt.wrong { background: #ffcdd2; border-color: #e53935; }
  .explain {
    display: none; font-size: 16px; background: #fff8e1;
    border-left: 5px solid #ffb300; border-radius: 8px;
    padding: 9px 13px; margin-top: 9px; color: #6d4c00;
  }
  .explain.show { display: block; }
  .btnbar { text-align: center; margin: 24px 0; }
  button.big {
    font-family: inherit; font-size: 20px; font-weight: bold;
    color: #fff; border: none; border-radius: 16px;
    padding: 14px 26px; margin: 8px; cursor: pointer;
  }
  #checkBtn { background: #43a047; box-shadow: 0 5px 0 #2e7d32; }
  #resetBtn { background: #78909c; box-shadow: 0 5px 0 #546e7a; }
  button.big:active { transform: translateY(3px); box-shadow: none; }
  #scorebox {
    display: none; text-align: center; font-size: 22px; font-weight: bold;
    background: #fff; border-radius: 20px; padding: 22px;
    margin: 18px 0; box-shadow: 0 5px 12px rgba(0,0,0,.12);
  }
  #scorebox.show { display: block; }
  #scorebox .big-score { font-size: 40px; color: #f57c00; }
  #scorebox .praise { font-size: 20px; margin-top: 8px; }
  footer { text-align: center; color: #999; font-size: 13px; padding: 20px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>✨ ข้อสอบฝึกของยูน่า ✨</h1>
    <div class="meta">ชั้น ป.4 &nbsp;•&nbsp; วันที่ 28 ก.ค. 2026 &nbsp;•&nbsp; ชุด D 🎉</div>
    <div class="meta">วิชา: วิทยาศาสตร์ 🔬 + การงานอาชีพฯ 🛠️</div>
  </header>

  <div id="quiz"></div>

  <div class="btnbar">
    <button class="big" id="checkBtn" onclick="checkAll()">✅ ตรวจคำตอบ</button>
    <button class="big" id="resetBtn" onclick="resetAll()">🔄 ทำใหม่</button>
  </div>

  <div id="scorebox"></div>

  <footer>JND • ฝึกทำทุกวัน เก่งขึ้นทุกวัน 💪</footer>
</div>

<script>
const questions = [
  // ===== วิทยาศาสตร์: วงจรชีวิตของพืชและสัตว์ (15 ข้อ) =====
  { subj:1, text:"วงจรชีวิตของพืชดอกเริ่มต้นจากอะไร?", opts:["ดอก","เมล็ด","ผล","ลำต้น"], ans:1, exp:"พืชดอกเริ่มจากเมล็ด → งอก → ต้นอ่อน → ต้นโต → ออกดอกออกผล" },
  { subj:1, text:"ลำดับวงจรชีวิตของผีเสื้อข้อใดถูกต้อง?", opts:["ไข่ → หนอน → ดักแด้ → ผีเสื้อ","หนอน → ไข่ → ผีเสื้อ → ดักแด้","ผีเสื้อ → ไข่ → ดักแด้ → หนอน","ไข่ → ดักแด้ → หนอน → ผีเสื้อ"], ans:0, exp:"ผีเสื้อ: ไข่ → ตัวหนอน → ดักแด้ → ผีเสื้อ 🦋" },
  { subj:1, text:"ระยะ “ดักแด้” ของผีเสื้อ มีลักษณะอย่างไร?", opts:["บินได้","หุ้มอยู่ในเปลือก ไม่เคลื่อนไหว","ว่ายน้ำ","กินใบไม้ตลอดเวลา"], ans:1, exp:"ดักแด้จะอยู่นิ่งในเปลือกหุ้ม รอเปลี่ยนเป็นผีเสื้อ" },
  { subj:1, text:"กบมีการเปลี่ยนแปลงรูปร่างระหว่างเติบโต เริ่มจากระยะใด?", opts:["ลูกอ๊อด","ไข่","กบเต็มวัย","ดักแด้"], ans:1, exp:"กบเริ่มจากไข่ → ลูกอ๊อด → กบมีขา → กบเต็มวัย" },
  { subj:1, text:"ลูกอ๊อดหายใจด้วยอวัยวะใด?", opts:["เหงือก","ปอด","จมูก","ท่อลม"], ans:0, exp:"ลูกอ๊อดอยู่ในน้ำ หายใจด้วยเหงือก" },
  { subj:1, text:"สัตว์ข้อใดออกลูกเป็น “ไข่”?", opts:["สุนัข","แมว","ไก่","วัว"], ans:2, exp:"ไก่ออกลูกเป็นไข่ 🥚 แล้วฟักเป็นลูกไก่" },
  { subj:1, text:"สัตว์ข้อใดออกลูกเป็น “ตัว”?", opts:["ไก่","นก","แมว","ปลา"], ans:2, exp:"แมวออกลูกเป็นตัว 🐱 ส่วนไก่ นก ปลา ออกไข่" },
  { subj:1, text:"พืชใช้ส่วนใดในการดูดน้ำและแร่ธาตุจากดิน?", opts:["ราก","ใบ","ดอก","ผล"], ans:0, exp:"รากทำหน้าที่ดูดน้ำและแร่ธาตุจากดิน" },
  { subj:1, text:"ส่วนใดของพืชทำหน้าที่สร้างอาหาร (สังเคราะห์แสง)?", opts:["ดอก","ใบ","ราก","เมล็ด"], ans:1, exp:"ใบมีคลอโรฟิลล์ ใช้แสงแดดสร้างอาหาร" },
  { subj:1, text:"การขยายพันธุ์พืชด้วยเมล็ด ต้องมีสิ่งใดเกิดขึ้นก่อน?", opts:["ราก","ดอกที่ได้รับการผสมเกสร","ลำต้น","ใบ"], ans:1, exp:"ดอกได้รับการผสมเกสร → ติดผล → เกิดเมล็ด" },
  { subj:1, text:"วงจรชีวิตของไก่ เริ่มจากอะไร?", opts:["ไข่","ลูกไก่","แม่ไก่","ดักแด้"], ans:0, exp:"ไก่: ไข่ → ลูกไก่ → ไก่โตเต็มวัย" },
  { subj:1, text:"การเปลี่ยนแปลงรูปร่างของผีเสื้อและกบ เรียกว่ากระบวนการใด?", opts:["การสังเคราะห์แสง","การหายใจ","เมทามอร์โฟซิส (การเปลี่ยนรูปร่าง)","การสืบพันธุ์"], ans:2, exp:"การเปลี่ยนรูปร่างขณะเติบโต เรียกว่า เมทามอร์โฟซิส" },
  { subj:1, text:"เมื่อกบโตเต็มวัย หายใจด้วยอวัยวะใด?", opts:["ปอดและผิวหนัง","เหงือก","เหงือกและปอด","ท่อลม"], ans:0, exp:"กบเต็มวัยหายใจด้วยปอดและผิวหนัง" },
  { subj:1, text:"เมล็ดพืชจะงอกเป็นต้นได้ ต้องการปัจจัยใด?", opts:["ความมืดสนิท","ไม่ต้องการน้ำ","น้ำ อากาศ และอุณหภูมิที่เหมาะสม","ยาฆ่าแมลง"], ans:2, exp:"เมล็ดงอกต้องการน้ำ อากาศ และอุณหภูมิที่เหมาะสม" },
  { subj:1, text:"สัตว์ที่มีวงจรชีวิตครบ 4 ระยะ (ไข่–หนอน–ดักแด้–ตัวเต็มวัย) คือข้อใด?", opts:["ผีเสื้อ","ไก่","กบ","ปลา"], ans:0, exp:"ผีเสื้อมี 4 ระยะครบ คือ ไข่ หนอน ดักแด้ และตัวเต็มวัย" },

  // ===== การงานอาชีพฯ: งานบ้าน งานประดิษฐ์ และความปลอดภัย (15 ข้อ) =====
  { subj:2, text:"ก่อนใช้มีดหรือกรรไกร เราควรทำอย่างไรเพื่อความปลอดภัย?", opts:["วิ่งไปมาขณะถือ","ใช้ด้วยความระมัดระวัง ไม่หยอกเล่น","ชี้ปลายใส่เพื่อน","ถือวิ่ง"], ans:1, exp:"ของมีคมต้องใช้อย่างระมัดระวัง ไม่เล่นหยอกกัน" },
  { subj:2, text:"อุปกรณ์ใดใช้สำหรับเย็บผ้า?", opts:["ค้อน","เข็มและด้าย","ไขควง","เลื่อย"], ans:1, exp:"เย็บผ้าใช้เข็มและด้าย 🧵" },
  { subj:2, text:"เมื่อใช้เตารีด เราต้องระวังสิ่งใดมากที่สุด?", opts:["ความร้อนที่อาจลวกมือ","สีของเตารีด","น้ำหนักเบา","เสียงดัง"], ans:0, exp:"เตารีดร้อนมาก ต้องระวังไม่ให้ลวกมือ" },
  { subj:2, text:"หลังทำงานประดิษฐ์เสร็จ เราควรทำอย่างไร?", opts:["ทิ้งขยะไว้","เก็บอุปกรณ์และทำความสะอาดที่ทำงาน","วางของมีคมกระจาย","ปล่อยไว้"], ans:1, exp:"เก็บอุปกรณ์และทำความสะอาดพื้นที่ทำงานทุกครั้ง" },
  { subj:2, text:"การถนอมอาหารด้วยการแช่เย็นในตู้เย็น ช่วยเรื่องใด?", opts:["ทำให้อาหารเสียเร็ว","ทำให้อาหารเก็บได้นานขึ้น","เปลี่ยนสีอาหาร","ทำให้หนักขึ้น"], ans:1, exp:"ความเย็นชะลอการเน่าเสีย ทำให้เก็บอาหารได้นานขึ้น" },
  { subj:2, text:"เมื่อปลั๊กไฟหรือสายไฟชำรุด เราควรทำอย่างไร?", opts:["ใช้ต่อไป","เอามือแตะสายไฟ","แจ้งผู้ใหญ่ ไม่ใช้เอง","เอาน้ำราด"], ans:2, exp:"ไฟฟ้าอันตราย ต้องแจ้งผู้ใหญ่ ไม่ซ่อมหรือแตะเอง ⚡" },
  { subj:2, text:"อุปกรณ์ใดใช้ตอกตะปู?", opts:["กรรไกร","ค้อน","เข็ม","ช้อน"], ans:1, exp:"ตอกตะปูใช้ค้อน 🔨" },
  { subj:2, text:"การล้างผักก่อนนำมาปรุงอาหาร มีประโยชน์อย่างไร?", opts:["ขจัดสิ่งสกปรกและสารตกค้าง","ทำให้ผักเหี่ยว","เพิ่มเชื้อโรค","ไม่มีประโยชน์"], ans:0, exp:"ล้างผักช่วยขจัดดิน เชื้อโรค และสารเคมีตกค้าง" },
  { subj:2, text:"เมื่อทำงานที่มีฝุ่นหรือกลิ่นสารเคมี ควรทำอย่างไร?", opts:["สูดดมให้เต็มที่","สวมหน้ากากและอยู่ในที่อากาศถ่ายเท","ปิดหน้าต่างทั้งหมด","ไม่ป้องกัน"], ans:1, exp:"สวมหน้ากากป้องกันและทำงานในที่อากาศถ่ายเท" },
  { subj:2, text:"ก่อนปลูกต้นไม้ลงกระถาง สิ่งแรกที่ต้องเตรียมคืออะไร?", opts:["ดินปลูกและกระถาง","ปุ๋ยเคมีอย่างเดียว","น้ำแข็ง","กระดาษ"], ans:0, exp:"เตรียมดินปลูกและกระถางก่อนลงต้นไม้ 🪴" },
  { subj:2, text:"การพับผ้าและจัดเก็บเสื้อผ้าให้เป็นระเบียบ เป็นทักษะด้านใด?", opts:["งานช่างไม้","งานบ้าน","งานไฟฟ้า","งานเกษตร"], ans:1, exp:"การดูแลเสื้อผ้าและจัดบ้านเป็นทักษะงานบ้าน" },
  { subj:2, text:"เมื่อจะส่งกรรไกรให้เพื่อน ควรส่งอย่างไร?", opts:["ขว้างไปให้","หันด้ามจับให้เพื่อน ปลายแหลมเข้าหาตัว","หันปลายแหลมใส่เพื่อน","โยนบนโต๊ะ"], ans:1, exp:"ส่งของมีคมโดยหันด้ามจับให้ผู้รับ เพื่อความปลอดภัย" },
  { subj:2, text:"การทำอาหารต้องล้างมือก่อนเสมอ เพราะเหตุใด?", opts:["ป้องกันเชื้อโรคปนเปื้อนอาหาร","ให้มือเปียก","เสียเวลา","ไม่มีเหตุผล"], ans:0, exp:"ล้างมือก่อนทำอาหารเพื่อไม่ให้เชื้อโรคปนเปื้อน" },
  { subj:2, text:"เครื่องมือใดใช้ขันหรือคลายสกรู (น็อต)?", opts:["ค้อน","เลื่อย","ไขควง","พู่กัน"], ans:2, exp:"ไขควงใช้ขันและคลายสกรู 🪛" },
  { subj:2, text:"งานประดิษฐ์จากวัสดุเหลือใช้ (เช่น ขวดพลาสติก) มีประโยชน์อย่างไร?", opts:["ช่วยลดขยะและนำกลับมาใช้ใหม่","เพิ่มขยะ","สิ้นเปลือง","ไม่มีประโยชน์"], ans:0, exp:"นำวัสดุเหลือใช้มาประดิษฐ์ ช่วยลดขยะ (Reuse/Recycle) ♻️" }
];

const subjNames = { 1:"🔬 วิชาวิทยาศาสตร์ — วงจรชีวิตของพืชและสัตว์", 2:"🛠️ วิชาการงานอาชีพฯ — งานบ้าน งานประดิษฐ์ และความปลอดภัย" };
const selected = {};
let checked = false;

function render() {
  const box = document.getElementById('quiz');
  box.innerHTML = '';
  let lastSubj = null;
  questions.forEach((q, i) => {
    if (q.subj !== lastSubj) {
      const t = document.createElement('div');
      t.className = 'subject-title' + (q.subj===2 ? ' s2' : '');
      t.textContent = subjNames[q.subj];
      box.appendChild(t);
      lastSubj = q.subj;
    }
    const card = document.createElement('div');
    card.className = 'q';
    const numInSubj = questions.slice(0,i+1).filter(x=>x.subj===q.subj).length;
    let html = '<div class="text"><span class="num">'+numInSubj+'</span>'+q.text+'</div>';
    q.opts.forEach((o, oi) => {
      html += '<button class="opt" data-q="'+i+'" data-o="'+oi+'" onclick="pick('+i+','+oi+')">'+o+'</button>';
    });
    html += '<div class="explain" id="exp-'+i+'">💡 เฉลย: '+q.opts[q.ans]+' — '+q.exp+'</div>';
    card.innerHTML = html;
    box.appendChild(card);
  });
}

function pick(qi, oi) {
  if (checked) return;
  selected[qi] = oi;
  document.querySelectorAll('.opt[data-q="'+qi+'"]').forEach(b => b.classList.remove('sel'));
  document.querySelector('.opt[data-q="'+qi+'"][data-o="'+oi+'"]').classList.add('sel');
}

function checkAll() {
  checked = true;
  let score = 0;
  questions.forEach((q, i) => {
    const sel = selected[i];
    document.querySelectorAll('.opt[data-q="'+i+'"]').forEach(b => {
      const oi = +b.dataset.o;
      b.classList.remove('sel');
      if (oi === q.ans) b.classList.add('correct');
      if (oi === sel && sel !== q.ans) b.classList.add('wrong');
    });
    document.getElementById('exp-'+i).classList.add('show');
    if (sel === q.ans) score++;
  });
  showScore(score);
}

function showScore(score) {
  const total = questions.length;
  const pct = score/total;
  let praise, emoji;
  if (pct === 1) { praise = "สุดยอดมากลูก! ทำได้เต็มทุกข้อ!"; emoji="🏆🎉"; }
  else if (pct >= 0.8) { praise = "เก่งมากยูน่า! เกือบเต็มแล้ว!"; emoji="🌟😍"; }
  else if (pct >= 0.6) { praise = "ทำได้ดีมากลูก! พัฒนาขึ้นเรื่อยๆ!"; emoji="😊👍"; }
  else { praise = "เยี่ยมที่ตั้งใจทำจนจบ! ลองทบทวนเฉลยแล้วสู้ต่อนะ!"; emoji="🤗💪"; }
  const sb = document.getElementById('scorebox');
  sb.innerHTML = '<div>ได้คะแนน</div><div class="big-score">'+score+' / '+total+' '+emoji+'</div><div class="praise">'+praise+'</div>';
  sb.classList.add('show');
  sb.scrollIntoView({behavior:'smooth'});
}

function resetAll() {
  checked = false;
  for (const k in selected) delete selected[k];
  document.getElementById('scorebox').classList.remove('show');
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

render();
</script>
