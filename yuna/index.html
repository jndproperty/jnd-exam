<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<title>ข้อสอบฝึกยูน่า ป.4 - 4 ต.ค. 2026 (100 ข้อ)</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  .opt.wrong { background:#ffcdd2; border-color:#e53935; }

  .resetBtn { background:#78909c; box-shadow:0 5px 0 #546e7a; }
  .nextBtn  { background:#5c6bc0; box-shadow:0 5px 0 #3949ab; }

  .total .row:last-child { border-bottom:none; font-weight:bold; color:#ff6f00; }
  footer { text-align:center; color:#999; font-size:14px; padding:18px 0; }

</head>

<div class="wrap">
  <header>
    <h1>✨ ข้อสอบฝึกของยูน่า ✨</h1>

  <footer>JND • ฝึกทำทุกวัน เก่งขึ้นทุกวัน 💪</footer>

  { subj:1, text:"พระสงฆ์ฉันอาหาร เราใช้คำว่าอะไรเรียกอาหารของพระสงฆ์", opts:["ของว่าง","เครื่องเสวย","ภัตตาหาร","พระกระยาหาร"], ans:2, exp:"อาหารของพระสงฆ์เรียกว่า ภัตตาหาร" },

  { subj:1, text:"คำสุภาพของคำว่า “หัว” คือคำใด", opts:["กระหม่อม","ศีรษะ","เศียร","พระเศียร"], ans:1, exp:"คำสุภาพของ หัว ใช้ ศีรษะ ส่วน พระเศียร เป็นคำราชาศัพท์" },
  { subj:1, text:"คำราชาศัพท์ของคำว่า “พูด” สำหรับพระมหากษัตริย์ คือคำใด", opts:["เอ่ย","บอก","ตรัส","กล่าว"], ans:2, exp:"พระมหากษัตริย์ใช้คำว่า ตรัส" },

  { subj:1, text:"คำว่า “สระ” ในประโยค “ปลาอยู่ในสระน้ำ” อ่านว่าอย่างไร", opts:["สาระ","สะ","สะ-ระ","สระ"], ans:1, exp:"สระ ที่หมายถึงแหล่งน้ำ อ่านว่า สะ ส่วนสระในภาษาไทยอ่าน สะ-ระ" },

  { subj:4, text:"ข้อใดเป็นสสารสถานะแก๊ส", opts:["อากาศในลูกโป่ง","น้ำแข็ง","น้ำเชื่อม","ก้อนหิน"], ans:0, exp:"อากาศในลูกโป่งเป็นแก๊ส ฟุ้งกระจายเต็มภาชนะ" },
  { subj:4, text:"วัสดุใดเหมาะทำด้ามจับหม้อมากที่สุด เพราะไม่นำความร้อน", opts:["เหล็ก","อะลูมิเนียม","ไม้","ทองแดง"], ans:2, exp:"ไม้ไม่นำความร้อน จึงจับได้ไม่ร้อนมือ" },

  { subj:4, text:"การที่น้ำในจานหายไปเมื่อตั้งไว้กลางแดด เกิดจากกระบวนการใด", opts:["การแข็งตัว","การหลอมเหลว","การระเหย","การควบแน่น"], ans:2, exp:"น้ำได้รับความร้อนกลายเป็นไอน้ำ เรียกว่า การระเหย" },
  { subj:4, text:"เมื่อนำน้ำใส่ขวดแล้วแช่ช่องแข็ง น้ำจะเปลี่ยนสถานะอย่างไร", opts:["ของเหลวเป็นของแข็ง","ของแข็งเป็นของเหลว","ของเหลวเป็นแก๊ส","แก๊สเป็นของเหลว"], ans:0, exp:"น้ำเย็นจัดจะแข็งตัวเป็นน้ำแข็ง คือของเหลวเป็นของแข็ง" },
  // (ข) แรงและพลังงาน + วงจรไฟฟ้า 10 ข้อ
  { subj:4, text:"แรงที่ทำให้ผลไม้หล่นจากต้นลงสู่พื้นคือแรงใด", opts:["แรงแม่เหล็ก","แรงดึงของมือ","แรงเสียดทาน","แรงโน้มถ่วงของโลก"], ans:3, exp:"แรงโน้มถ่วงของโลกดึงวัตถุเข้าหาพื้นโลก" },
  { subj:4, text:"การเดินบนพื้นทรายแล้วรู้สึกฝืดเท้า เกี่ยวข้องกับแรงใด", opts:["แรงไฟฟ้า","แรงเสียดทาน","แรงโน้มถ่วง","แรงแม่เหล็ก"], ans:1, exp:"แรงเสียดทานเกิดเมื่อผิววัตถุสองผิวสัมผัสและต้านการเคลื่อนที่" },

  { subj:4, text:"เหตุใดจึงต้องหุ้มฉนวนพลาสติกไว้รอบสายไฟ", opts:["ทำให้สายไฟหนักขึ้น","ป้องกันไฟฟ้าดูด เพราะพลาสติกไม่นำไฟฟ้า","ทำให้ไฟสว่างขึ้น","ทำให้กระแสไฟไหลเร็วขึ้น"], ans:1, exp:"พลาสติกเป็นฉนวน ไม่ให้กระแสไฟฟ้าผ่านออกมาถูกตัวเรา" },

  { subj:4, text:"เมื่อกดสวิตช์ให้วงจรเปิดวงจร (ขาด) จะเกิดผลอย่างไร", opts:["หลอดไฟดับ เพราะกระแสไฟฟ้าไหลไม่ครบวงจร","หลอดไฟสว่างขึ้นกว่าเดิม","ถ่านไฟฉายชาร์จไฟเพิ่ม","สายไฟนำไฟฟ้าได้ดีขึ้น"], ans:0, exp:"กระแสไฟฟ้าไหลได้เมื่อวงจรครบ ถ้าวงจรขาดหลอดไฟจะดับ" },

  { subj:5, text:"สมเด็จพระนเรศวรมหาราชทรงมีวีรกรรมสำคัญเรื่องใด", opts:["ทรงตั้งกรุงธนบุรี","ทรงเลิกทาส","ทรงประดิษฐ์ลายสือไทย","ทรงกู้อิสรภาพของกรุงศรีอยุธยาและทำยุทธหัตถี"], ans:3, exp:"พระนเรศวรทรงประกาศอิสรภาพและทำยุทธหัตถีชนะข้าศึก" },
  { subj:5, text:"ผู้ทรงกอบกู้เอกราชหลังเสียกรุงศรีอยุธยาครั้งที่ 2 และตั้งกรุงธนบุรีเป็นราชธานี คือพระองค์ใด", opts:["พระบาทสมเด็จพระพุทธยอดฟ้าจุฬาโลกมหาราช","สมเด็จพระเจ้าตากสินมหาราช","พ่อขุนศรีอินทราทิตย์","สมเด็จพระนารายณ์มหาราช"], ans:1, exp:"สมเด็จพระเจ้าตากสินมหาราชทรงกอบกู้เอกราชและตั้งกรุงธนบุรี" },
  { subj:5, text:"การเลิกทาสในประเทศไทยเกิดขึ้นในรัชสมัยใด", opts:["รัชกาลที่ 4","รัชกาลที่ 7","รัชกาลที่ 5","รัชกาลที่ 1"], ans:2, exp:"พระบาทสมเด็จพระจุลจอมเกล้าเจ้าอยู่หัว รัชกาลที่ 5 ทรงเลิกทาส" },
  { subj:5, text:"ราชธานีของไทยในปัจจุบันอยู่ในสมัยใด", opts:["รัตนโกสินทร์","ธนบุรี","อยุธยา","สุโขทัย"], ans:0, exp:"กรุงเทพมหานครเป็นราชธานีในสมัยรัตนโกสินทร์" },
  { subj:5, text:"ศิลาจารึกหลักที่ 1 ของพ่อขุนรามคำแหงให้ความรู้เรื่องใดมากที่สุด", opts:["ความเป็นอยู่และการปกครองสมัยสุโขทัย","การค้ากับยุโรปสมัยอยุธยา","การสร้างกรุงธนบุรี","การปฏิรูปการศึกษาสมัยรัชกาลที่ 5"], ans:0, exp:"ศิลาจารึกบอกเรื่องชีวิตผู้คนและการปกครองแบบพ่อปกครองลูกในสุโขทัย" },
  { subj:5, text:"การปกครองสมัยสุโขทัยมีลักษณะเด่นอย่างไร", opts:["ปกครองโดยขุนนางต่างชาติ","ไม่มีพระมหากษัตริย์","พ่อปกครองลูก พระมหากษัตริย์ใกล้ชิดราษฎร","แบ่งเป็นรัฐสภาและศาล"], ans:2, exp:"สุโขทัยปกครองแบบพ่อปกครองลูก ราษฎรเข้าถึงกษัตริย์ได้" },
  { subj:5, text:"กรุงธนบุรีเป็นราชธานีของไทยในช่วงเวลาสั้นเพียงรัชกาลเดียว เพราะเหตุใดจึงย้ายราชธานี", opts:["เพราะอยู่ไกลทะเลเกินไป","ย้ายมาตั้งกรุงรัตนโกสินทร์ที่ฝั่งตะวันออกของแม่น้ำเจ้าพระยาเพื่อความเหมาะสมในการป้องกันเมือง","เพราะไม่มีคนอยู่","เพราะไม่มีแม่น้ำ"], ans:1, exp:"รัชกาลที่ 1 ย้ายราชธานีมาฝั่งตะวันออกซึ่งป้องกันเมืองได้ดีกว่า" },
  { subj:5, text:"หลักฐานทางประวัติศาสตร์ประเภทใดที่เป็นวัตถุหรือสิ่งก่อสร้างที่หลงเหลือมาถึงปัจจุบัน", opts:["คำบอกเล่า","นิทานพื้นบ้าน","เพลงกล่อมเด็ก","โบราณสถานและโบราณวัตถุ"], ans:3, exp:"วัด เจดีย์ เครื่องปั้นดินเผา เป็นโบราณสถานและโบราณวัตถุ" }
];
const subjNames = {
  1:"📖 วิชาภาษาไทย",
  2:"🔢 วิชาคณิตศาสตร์",
  3:"🔤 วิชาภาษาอังกฤษ",
  4:"🔬 วิชาวิทยาศาสตร์",
  5:"🗺️ วิชาสังคมศึกษา"
};
const subjShort = { 1:"📖 ภาษาไทย", 2:"🔢 คณิตศาสตร์", 3:"🔤 ภาษาอังกฤษ", 4:"🔬 วิทยาศาสตร์", 5:"🗺️ สังคมศึกษา" };

const selected = {};
const checkedSubj = {};
const scoreSubj = {};
let cur = 1;
const SUBJS = [1,2,3,4,5];

function qsOf(s){ return questions.map((q,i)=>({q,i})).filter(o=>o.q.subj===s); }

function renderTabs(){
  const t = document.getElementById('tabs');
  t.innerHTML = '';
  SUBJS.forEach(s=>{
    const b = document.createElement('button');
    b.className = 'tab' + (s===cur?' active':'') + (checkedSubj[s]?' done':'');
    const short = subjShort[s];
    b.innerHTML = short + '<span class="tn">' + (checkedSubj[s] ? (scoreSubj[s]+'/'+qsOf(s).length) : '20 ข้อ') + '</span>';
    b.onclick = ()=>{ cur = s; render(); window.scrollTo({top:0,behavior:'smooth'}); };
    t.appendChild(b);
  });
}

function render(){
  renderTabs();
  const box = document.getElementById('quiz');
  box.innerHTML = '';
  const title = document.createElement('div');
  title.className = 'subject-title';
  title.textContent = subjNames[cur];
  box.appendChild(title);

  qsOf(cur).forEach((o, n)=>{
    const q = o.q, i = o.i;
    const card = document.createElement('div');
    card.className = 'q';
    let html = '<div class="text"><span class="num">'+(n+1)+'</span>'+q.text+'</div>';
    q.opts.forEach((op, oi)=>{
      let cls = 'opt';
      if (checkedSubj[cur]) {
        if (oi === q.ans) cls += ' correct';
        else if (oi === selected[i]) cls += ' wrong';
      } else if (selected[i] === oi) cls += ' sel';
      html += '<button class="'+cls+'" data-q="'+i+'" data-o="'+oi+'" onclick="pick('+i+','+oi+')">'+op+'</button>';
    });
    html += '<div class="explain'+(checkedSubj[cur]?' show':'')+'" id="exp-'+i+'">💡 เฉลย: '+q.opts[q.ans]+' — '+q.exp+'</div>';
    card.innerHTML = html;
    box.appendChild(card);
  });

  const sb = document.getElementById('scorebox');
  if (checkedSubj[cur]) showScore(scoreSubj[cur], qsOf(cur).length); else sb.classList.remove('show');
  updateProgress();
  renderTotal();
}

function updateProgress(){
  const list = qsOf(cur);
  const done = list.filter(o=>selected[o.i]!==undefined).length;
  document.getElementById('progress').textContent = 'ทำไปแล้ว ' + done + ' / ' + list.length + ' ข้อ';
}

function pick(qi, oi){
  if (checkedSubj[questions[qi].subj]) return;
  selected[qi] = oi;
  document.querySelectorAll('.opt[data-q="'+qi+'"]').forEach(b=>b.classList.remove('sel'));
  document.querySelector('.opt[data-q="'+qi+'"][data-o="'+oi+'"]').classList.add('sel');
  updateProgress();
}

function checkSubject(){
  const list = qsOf(cur);
  let score = 0;
  list.forEach(o=>{ if (selected[o.i] === o.q.ans) score++; });
  checkedSubj[cur] = true;
  scoreSubj[cur] = score;
  render();
  document.getElementById('scorebox').scrollIntoView({behavior:'smooth'});
}

function resetSubject(){
  qsOf(cur).forEach(o=>{ delete selected[o.i]; });
  delete checkedSubj[cur];
  delete scoreSubj[cur];
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function nextSubject(){
  cur = cur % 5 + 1;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function showScore(score, total){
  const pct = score/total;
  let praise, emoji;
  if (pct === 1) { praise = "สุดยอดมากลูก! ทำได้เต็มทุกข้อ!"; emoji="🏆🎉"; }
  else if (pct >= 0.8) { praise = "เก่งมากยูน่า! เกือบเต็มแล้ว!"; emoji="🌟😍"; }
  else if (pct >= 0.6) { praise = "ทำได้ดีมากลูก! พัฒนาขึ้นเรื่อยๆ!"; emoji="😊👍"; }
  else { praise = "เยี่ยมที่ตั้งใจทำจนจบ! ลองทบทวนเฉลยแล้วสู้ต่อนะ!"; emoji="🤗💪"; }
  const sb = document.getElementById('scorebox');
  sb.innerHTML = '<div>'+subjShort[cur]+'</div><div class="big-score">'+score+' / '+total+' '+emoji+'</div><div class="praise">'+praise+'</div>';
  sb.classList.add('show');
}

function renderTotal(){
  const el = document.getElementById('total');
  const doneSubjs = SUBJS.filter(s=>checkedSubj[s]);
  if (!doneSubjs.length) { el.innerHTML = '<h3>📋 ตรวจวิชาไหนแล้ว คะแนนจะมาโชว์ตรงนี้</h3>'; return; }
  let sum = 0, tot = 0, rows = '';
  SUBJS.forEach(s=>{
    const n = qsOf(s).length;
    if (checkedSubj[s]) { sum += scoreSubj[s]; tot += n; rows += '<div class="row"><span>'+subjShort[s]+'</span><span>'+scoreSubj[s]+' / '+n+'</span></div>'; }
  });
  rows += '<div class="row"><span>รวมทั้งหมด</span><span>'+sum+' / '+tot+'</span></div>';
  el.innerHTML = '<h3>🏅 สรุปคะแนน</h3>' + rows;
}

render();
</script>
</body>
</html>
