<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ข้อสอบฝึกยูน่า ป.4 - 28 ก.ค. 2026 (ชุด D ใหม่)</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Tahoma', 'Sarabun', sans-serif;
    margin: 0; padding: 0;
    background: linear-gradient(160deg, #e3f2fd 0%, #e8f5e9 100%);
    color: #263238;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
  header {
    text-align: center; background: #5c6bc0; color: #fff;
    border-radius: 20px; padding: 22px 16px; margin-bottom: 16px;
    box-shadow: 0 5px 0 #3f51b5;
  }
  header h1 { margin: 0 0 6px; font-size: 26px; }
  header .meta { font-size: 16px; opacity: .95; }
  .subject-title {
    font-size: 20px; font-weight: bold; color: #fff;
    background: #7e57c2; border-radius: 14px;
    padding: 11px 18px; margin: 22px 0 12px;
    box-shadow: 0 4px 0 #5e35b1;
  }
  .subject-title.s2 { background: #00897b; box-shadow: 0 4px 0 #00695c; }
  .q {
    background: #fff; border-radius: 16px; padding: 16px 18px;
    margin-bottom: 14px; box-shadow: 0 3px 8px rgba(0,0,0,.07);
  }
  .q .num {
    display: inline-block; background: #ffb74d; color: #4e342e;
    font-weight: bold; border-radius: 50%; width: 30px; height: 30px;
    line-height: 30px; text-align: center; font-size: 16px; margin-right: 8px;
  }
  .q .text { font-size: 19px; font-weight: bold; margin: 4px 0 12px; }
  .opt {
    display: block; width: 100%; text-align: left;
    font-size: 18px; font-family: inherit;
    background: #f5f5f5; border: 2px solid #e0e0e0;
    border-radius: 12px; padding: 11px 16px; margin-bottom: 8px;
    cursor: pointer; transition: .12s;
  }
  .opt:active { transform: scale(.99); }
  .opt.sel { background: #bbdefb; border-color: #2196f3; }
  .opt.correct { background: #c8e6c9; border-color: #43a047; }
  .opt.wrong { background: #ffcdd2; border-color: #e53935; }
  .explain {
    display: none; font-size: 16px; background: #fff8e1;
    border-left: 5px solid #ffb300; border-radius: 8px;
    padding: 9px 13px; margin-top: 9px; color: #6d4c00;
  }
  .explain.show { display: block; }
  .btnbar { text-align: center; margin: 24px 0; }
  button.big {
    font-family: inherit; font-size: 20px; font-weight: bold;
    color: #fff; border: none; border-radius: 16px;
    padding: 14px 26px; margin: 8px; cursor: pointer;
  }
  #checkBtn { background: #43a047; box-shadow: 0 5px 0 #2e7d32; }
  #resetBtn { background: #78909c; box-shadow: 0 5px 0 #546e7a; }
  button.big:active { transform: translateY(3px); box-shadow: none; }
  #scorebox {
    display: none; text-align: center; font-size: 22px; font-weight: bold;
    background: #fff; border-radius: 20px; padding: 22px;
    margin: 18px 0; box-shadow: 0 5px 12px rgba(0,0,0,.12);
  }
  #scorebox.show { display: block; }
  #scorebox .big-score { font-size: 40px; color: #f57c00; }
  #scorebox .praise { font-size: 20px; margin-top: 8px; }
  footer { text-align: center; color: #999; font-size: 13px; padding: 20px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>✨ ข้อสอบฝึกของยูน่า ✨</h1>
    <div class="meta">ชั้น ป.4 &nbsp;•&nbsp; วันที่ 28 ก.ค. 2026 &nbsp;•&nbsp; ชุด D ใหม่ 🎉</div>
    <div class="meta">วิชา: วิทยาศาสตร์ 🔬 + การงานอาชีพฯ 🍳</div>
  </header>

  <div id="quiz"></div>

  <div class="btnbar">
    <button class="big" id="checkBtn" onclick="checkAll()">✅ ตรวจคำตอบ</button>
    <button class="big" id="resetBtn" onclick="resetAll()">🔄 ทำใหม่</button>
  </div>

  <div id="scorebox"></div>

  <footer>JND • ฝึกทำทุกวัน เก่งขึ้นทุกวัน 💪</footer>
</div>

<script>
const questions = [
  // ===== วิทยาศาสตร์: ระบบสุริยะและโลกของเรา (15 ข้อ) =====
  { subj:1, text:"ดาวฤกษ์ที่เป็นศูนย์กลางของระบบสุริยะ คืออะไร?", opts:["ดวงจันทร์","ดวงอาทิตย์","โลก","ดาวอังคาร"], ans:1, exp:"ดวงอาทิตย์เป็นดาวฤกษ์ศูนย์กลางของระบบสุริยะ ☀️" },
  { subj:1, text:"โลกของเราเป็นดาวเคราะห์ลำดับที่เท่าไรจากดวงอาทิตย์?", opts:["ดวงที่ 1","ดวงที่ 2","ดวงที่ 3","ดวงที่ 4"], ans:2, exp:"โลกเป็นดาวเคราะห์ดวงที่ 3 จากดวงอาทิตย์" },
  { subj:1, text:"การที่โลกหมุนรอบตัวเอง ทำให้เกิดสิ่งใด?", opts:["กลางวันและกลางคืน","ฤดูกาล","น้ำขึ้นน้ำลง","ฝนตก"], ans:0, exp:"โลกหมุนรอบตัวเองทำให้เกิดกลางวัน-กลางคืน" },
  { subj:1, text:"การที่โลกโคจรรอบดวงอาทิตย์ครบ 1 รอบ ใช้เวลาประมาณเท่าใด?", opts:["1 วัน","1 เดือน","1 ปี","1 สัปดาห์"], ans:2, exp:"โลกโคจรรอบดวงอาทิตย์ครบ 1 รอบ ใช้เวลา 1 ปี" },
  { subj:1, text:"ดาวเคราะห์ดวงใดได้ชื่อว่า “ดาวเคราะห์สีแดง”?", opts:["ดาวศุกร์","ดาวพฤหัสบดี","ดาวอังคาร","ดาวเสาร์"], ans:2, exp:"ดาวอังคารมีพื้นผิวสีแดง เรียกว่าดาวเคราะห์สีแดง" },
  { subj:1, text:"บริวารของโลกที่โคจรรอบโลก คืออะไร?", opts:["ดวงอาทิตย์","ดวงจันทร์","ดาวอังคาร","ดาวหาง"], ans:1, exp:"ดวงจันทร์เป็นบริวารที่โคจรรอบโลก 🌙" },
  { subj:1, text:"โลกหมุนรอบตัวเองครบ 1 รอบ ใช้เวลาประมาณเท่าใด?", opts:["1 ชั่วโมง","24 ชั่วโมง (1 วัน)","1 เดือน","1 ปี"], ans:1, exp:"โลกหมุนรอบตัวเองครบ 1 รอบใน 24 ชั่วโมง (1 วัน)" },
  { subj:1, text:"ดาวเคราะห์ที่มีวงแหวนสวยงามล้อมรอบ คือดวงใด?", opts:["ดาวพุธ","โลก","ดาวเสาร์","ดาวศุกร์"], ans:2, exp:"ดาวเสาร์มีวงแหวนสวยงามล้อมรอบ 🪐" },
  { subj:1, text:"แหล่งกำเนิดแสงสว่างและความร้อนของระบบสุริยะ คืออะไร?", opts:["ดวงจันทร์","ดวงอาทิตย์","ดาวเทียม","ดาวหาง"], ans:1, exp:"ดวงอาทิตย์ให้แสงสว่างและความร้อนแก่ระบบสุริยะ" },
  { subj:1, text:"ดาวเคราะห์ดวงใดใหญ่ที่สุดในระบบสุริยะ?", opts:["โลก","ดาวพฤหัสบดี","ดาวอังคาร","ดาวพุธ"], ans:1, exp:"ดาวพฤหัสบดีเป็นดาวเคราะห์ที่ใหญ่ที่สุด" },
  { subj:1, text:"การเกิดฤดูกาลบนโลก เกิดจากสาเหตุใด?", opts:["โลกเอียงและโคจรรอบดวงอาทิตย์","ดวงจันทร์บังโลก","ดาวตก","ลมพายุ"], ans:0, exp:"โลกเอียงแกนและโคจรรอบดวงอาทิตย์ ทำให้เกิดฤดูกาล" },
  { subj:1, text:"เมื่อด้านที่เราอยู่หันเข้าหาดวงอาทิตย์ จะเป็นเวลาใด?", opts:["กลางคืน","เที่ยงคืน","กลางวัน","ไม่มีเวลา"], ans:2, exp:"ด้านที่หันเข้าหาดวงอาทิตย์จะเป็นกลางวัน" },
  { subj:1, text:"ดวงจันทร์ที่เราเห็นสว่างบนท้องฟ้า ได้แสงมาจากที่ใด?", opts:["สร้างแสงเอง","สะท้อนแสงจากดวงอาทิตย์","จากโลก","จากดาวอังคาร"], ans:1, exp:"ดวงจันทร์ไม่มีแสงเอง แต่สะท้อนแสงจากดวงอาทิตย์" },
  { subj:1, text:"ระบบสุริยะมีดาวเคราะห์ทั้งหมดกี่ดวง?", opts:["8 ดวง","5 ดวง","10 ดวง","12 ดวง"], ans:0, exp:"ระบบสุริยะมีดาวเคราะห์ 8 ดวง" },
  { subj:1, text:"ปรากฏการณ์ที่ดวงจันทร์บังดวงอาทิตย์ เรียกว่าอะไร?", opts:["จันทรุปราคา","ฝนดาวตก","สุริยุปราคา","รุ้งกินน้ำ"], ans:2, exp:"ดวงจันทร์บังดวงอาทิตย์ เรียกว่า สุริยุปราคา" },

  // ===== การงานอาชีพฯ: การประกอบอาหารและการถนอมอาหาร (15 ข้อ) =====
  { subj:2, text:"ก่อนประกอบอาหารทุกครั้ง เราควรทำสิ่งใดเป็นอันดับแรก?", opts:["เปิดทีวี","ล้างมือให้สะอาด","เล่นโทรศัพท์","นอนพัก"], ans:1, exp:"ล้างมือให้สะอาดก่อนทำอาหารทุกครั้ง 🧼" },
  { subj:2, text:"การถนอมอาหารด้วย “การตากแห้ง” เหมาะกับอาหารประเภทใด?", opts:["ปลา เนื้อ ผลไม้","น้ำเปล่า","น้ำแข็ง","นมสด"], ans:0, exp:"การตากแห้งเหมาะกับปลา เนื้อ และผลไม้" },
  { subj:2, text:"การเก็บอาหารในตู้เย็น เป็นการถนอมอาหารด้วยวิธีใด?", opts:["การตากแห้ง","การแช่เย็น","การรมควัน","การดอง"], ans:1, exp:"การเก็บในตู้เย็นคือการถนอมด้วยความเย็น (แช่เย็น)" },
  { subj:2, text:"อุปกรณ์ใดใช้สำหรับหั่นผักและเนื้อ?", opts:["ช้อน","มีดและเขียง","แก้วน้ำ","จาน"], ans:1, exp:"ใช้มีดและเขียงในการหั่นผักและเนื้อ 🔪" },
  { subj:2, text:"การทำ “ผลไม้ดอง” หรือ “ผักดอง” เป็นการถนอมอาหารด้วยวิธีใด?", opts:["การตากแห้ง","การแช่แข็ง","การดอง","การต้ม"], ans:2, exp:"การแช่ในน้ำเกลือ/น้ำส้ม เรียกว่า การดอง" },
  { subj:2, text:"เพื่อความปลอดภัย เวลาใช้มีด เราควรทำอย่างไร?", opts:["ใช้ด้วยความระมัดระวัง","ถือวิ่งเล่น","แกว่งไปมา","ชี้ใส่คน"], ans:0, exp:"มีดเป็นของมีคม ต้องใช้อย่างระมัดระวัง" },
  { subj:2, text:"การถนอมอาหารมีประโยชน์อย่างไร?", opts:["ทำให้อาหารเสียเร็ว","เก็บอาหารไว้กินได้นานขึ้น","เพิ่มเชื้อโรค","ไม่มีประโยชน์"], ans:1, exp:"ช่วยเก็บอาหารไว้กินได้นานขึ้น ไม่เน่าเสียเร็ว" },
  { subj:2, text:"อาหารประเภทใดควรเก็บในช่องแช่แข็ง (freezer)?", opts:["ข้าวสาร","เนื้อสัตว์สด","ผลไม้ตากแห้ง","เกลือ"], ans:1, exp:"เนื้อสัตว์สดควรเก็บในช่องแช่แข็งให้เก็บได้นาน" },
  { subj:2, text:"หลังประกอบอาหารเสร็จ เราควรทำอะไร?", opts:["ล้างและเก็บอุปกรณ์ให้สะอาด","ทิ้งไว้เลอะเทอะ","ปล่อยเตาเปิดไว้","วางมีดกระจาย"], ans:0, exp:"ล้างและเก็บอุปกรณ์ ปิดเตาให้เรียบร้อย" },
  { subj:2, text:"การทำ “แยม” จากผลไม้ ใช้สิ่งใดช่วยถนอมและเพิ่มรสหวาน?", opts:["เกลือ","น้ำตาล","น้ำแข็ง","พริกไทย"], ans:1, exp:"แยมใช้น้ำตาลช่วยถนอมอาหารและเพิ่มความหวาน" },
  { subj:2, text:"เวลาต้มน้ำร้อนหรือทอดอาหาร เราต้องระวังสิ่งใด?", opts:["ความร้อนและน้ำมันกระเด็น","สีของหม้อ","เสียงดัง","น้ำหนักเบา"], ans:0, exp:"ต้องระวังความร้อนและน้ำมันกระเด็นลวกผิว" },
  { subj:2, text:"การล้างผักผลไม้ก่อนนำมาปรุงหรือกิน มีประโยชน์อย่างไร?", opts:["ทำให้เน่าเร็ว","ขจัดสิ่งสกปรกและสารตกค้าง","เพิ่มเชื้อโรค","ไม่มีผล"], ans:1, exp:"ล้างผักผลไม้ช่วยขจัดดิน เชื้อโรค และสารตกค้าง" },
  { subj:2, text:"อาหารที่มีกลิ่นเหม็นเปรี้ยวหรือขึ้นรา เราควรทำอย่างไร?", opts:["ทิ้งไป ไม่นำมากิน","กินต่อได้","เก็บไว้กินพรุ่งนี้","แบ่งให้เพื่อน"], ans:0, exp:"อาหารเสีย/ขึ้นราต้องทิ้ง ไม่นำมากินเพราะอันตราย" },
  { subj:2, text:"การถนอมอาหารด้วย “การรมควัน” มักใช้กับอาหารประเภทใด?", opts:["ผลไม้สด","เนื้อสัตว์ ปลา","น้ำผลไม้","ไอศกรีม"], ans:1, exp:"การรมควันมักใช้กับเนื้อสัตว์และปลา" },
  { subj:2, text:"เพื่อสุขอนามัยที่ดี เขียงสำหรับหั่นเนื้อสดและผัก ควรเป็นอย่างไร?", opts:["ใช้เขียงเดียวกันได้เลย","แยกเขียงกัน","ไม่ต้องล้าง","ใช้พื้นแทนเขียง"], ans:1, exp:"ควรแยกเขียงเนื้อสดกับผัก กันเชื้อโรคปนเปื้อน" }
];

const subjNames = { 1:"🔬 วิชาวิทยาศาสตร์ — ระบบสุริยะและโลกของเรา", 2:"🍳 วิชาการงานอาชีพฯ — การประกอบอาหารและการถนอมอาหาร" };
const selected = {};
let checked = false;

function render() {
  const box = document.getElementById('quiz');
  box.innerHTML = '';
  let lastSubj = null;
  questions.forEach((q, i) => {
    if (q.subj !== lastSubj) {
      const t = document.createElement('div');
      t.className = 'subject-title' + (q.subj===2 ? ' s2' : '');
      t.textContent = subjNames[q.subj];
      box.appendChild(t);
      lastSubj = q.subj;
    }
    const card = document.createElement('div');
    card.className = 'q';
    const numInSubj = questions.slice(0,i+1).filter(x=>x.subj===q.subj).length;
    let html = '<div class="text"><span class="num">'+numInSubj+'</span>'+q.text+'</div>';
    q.opts.forEach((o, oi) => {
      html += '<button class="opt" data-q="'+i+'" data-o="'+oi+'" onclick="pick('+i+','+oi+')">'+o+'</button>';
    });
    html += '<div class="explain" id="exp-'+i+'">💡 เฉลย: '+q.opts[q.ans]+' — '+q.exp+'</div>';
    card.innerHTML = html;
    box.appendChild(card);
  });
}

function pick(qi, oi) {
  if (checked) return;
  selected[qi] = oi;
  document.querySelectorAll('.opt[data-q="'+qi+'"]').forEach(b => b.classList.remove('sel'));
  document.querySelector('.opt[data-q="'+qi+'"][data-o="'+oi+'"]').classList.add('sel');
}

function checkAll() {
  checked = true;
  let score = 0;
  questions.forEach((q, i) => {
    const sel = selected[i];
    document.querySelectorAll('.opt[data-q="'+i+'"]').forEach(b => {
      const oi = +b.dataset.o;
      b.classList.remove('sel');
      if (oi === q.ans) b.classList.add('correct');
      if (oi === sel && sel !== q.ans) b.classList.add('wrong');
    });
    document.getElementById('exp-'+i).classList.add('show');
    if (sel === q.ans) score++;
  });
  showScore(score);
}

function showScore(score) {
  const total = questions.length;
  const pct = score/total;
  let praise, emoji;
  if (pct === 1) { praise = "สุดยอดมากลูก! ทำได้เต็มทุกข้อ!"; emoji="🏆🎉"; }
  else if (pct >= 0.8) { praise = "เก่งมากยูน่า! เกือบเต็มแล้ว!"; emoji="🌟😍"; }
  else if (pct >= 0.6) { praise = "ทำได้ดีมากลูก! พัฒนาขึ้นเรื่อยๆ!"; emoji="😊👍"; }
  else { praise = "เยี่ยมที่ตั้งใจทำจนจบ! ลองทบทวนเฉลยแล้วสู้ต่อนะ!"; emoji="🤗💪"; }
  const sb = document.getElementById('scorebox');
  sb.innerHTML = '<div>ได้คะแนน</div><div class="big-score">'+score+' / '+total+' '+emoji+'</div><div class="praise">'+praise+'</div>';
  sb.classList.add('show');
  sb.scrollIntoView({behavior:'smooth'});
}

function resetAll() {
  checked = false;
  for (const k in selected) delete selected[k];
  document.getElementById('scorebox').classList.remove('show');
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

render();
</script>
</body>
</html>
