<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ข้อสอบฝึกยูน่า ป.4 - 16 ต.ค. 2026 (100 ข้อ)</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Trebuchet MS', 'Tahoma', sans-serif; margin:0; padding:0; background: linear-gradient(160deg, #e8f5e9 0%, #ede7f6 100%); color:#333; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 14px; }
  header { text-align:center; background: #66bb6a; color:#fff; border-radius:24px; padding:18px 14px; margin-bottom:14px; box-shadow: 0 6px 0 #43a047; }
  header h1 { margin:0 0 6px; font-size: 26px; }
  header .meta { font-size: 16px; opacity:.95; }
  .tabs { display:grid; grid-template-columns: repeat(5, 1fr); gap:6px; margin-bottom:14px; }
  .tab { font-family:inherit; font-size: 14px; font-weight:bold; border:none; border-radius:14px;
         padding:10px 4px; cursor:pointer; background:#fff; color:#555; box-shadow:0 3px 0 #ddd; line-height:1.3; }
  .tab .tn { display:block; font-size: 12px; font-weight:normal; opacity:.75; margin-top:2px; }
  .tab.active { background: #7e57c2; color:#fff; box-shadow:0 3px 0 #5e35b1; }
  .tab.done { background:#c8e6c9; color:#2e7d32; box-shadow:0 3px 0 #a5d6a7; }
  .tab.done.active { background: #7e57c2; color:#fff; box-shadow:0 3px 0 #5e35b1; }
  .subject-title { font-size: 20px; font-weight:bold; color:#fff; background: #7e57c2; border-radius:18px;
                   padding:12px 18px; margin: 6px 0 12px; box-shadow:0 4px 0 #5e35b1; text-align:center; }
  .progress { text-align:center; font-size: 16px; color:#777; margin-bottom:10px; }
  .q { background:#fff; border-radius:20px; padding:16px; margin-bottom:14px; box-shadow:0 4px 10px rgba(0,0,0,.08); }
  .q .num { display:inline-block; background:#ffca28; color:#5d4037; font-weight:bold; border-radius:50%;
            width:36px; height:36px; line-height:36px; text-align:center; font-size:18px; margin-right:8px; }
  .q .text { font-size: 20px; font-weight:bold; margin:4px 0 12px; }
  .opt { display:block; width:100%; text-align:left; font-size: 19px; font-family:inherit;
         background:#f5f5f5; border:3px solid #e0e0e0; border-radius:16px; padding:12px 16px; margin-bottom:9px; cursor:pointer; transition:.12s; }
  .opt:active { transform: scale(.98); }
  .opt.sel { background:#bbdefb; border-color:#2196f3; }
  .opt.correct { background:#c8e6c9; border-color:#43a047; }
  .opt.wrong { background:#ffcdd2; border-color:#e53935; }
  .explain { display:none; font-size: 16px; background:#fff8e1; border-left:6px solid #ffb300;
             border-radius:10px; padding:10px 14px; margin-top:10px; color:#6d4c00; }
  .explain.show { display:block; }
  .btnbar { text-align:center; margin:20px 0; }
  button.big { font-family:inherit; font-size: 19px; font-weight:bold; color:#fff; border:none;
               border-radius:20px; padding:14px 24px; margin:6px; cursor:pointer; }
  .checkBtn { background:#43a047; box-shadow:0 5px 0 #2e7d32; }
  .resetBtn { background:#78909c; box-shadow:0 5px 0 #546e7a; }
  .nextBtn  { background:#5c6bc0; box-shadow:0 5px 0 #3949ab; }
  button.big:active { transform: translateY(3px); box-shadow:none; }
  .scorebox { display:none; text-align:center; font-size: 22px; font-weight:bold; background:#fff;
              border-radius:24px; padding:20px; margin:16px 0; box-shadow:0 6px 14px rgba(0,0,0,.12); }
  .scorebox.show { display:block; }
  .scorebox .big-score { font-size: 38px; color:#ff6f00; }
  .scorebox .praise { font-size: 19px; margin-top:8px; }
  .total { background:#fff; border-radius:20px; padding:16px; margin:16px 0; box-shadow:0 4px 10px rgba(0,0,0,.08); }
  .total h3 { margin:0 0 10px; text-align:center; font-size: 20px; color:#555; }
  .total .row { display:flex; justify-content:space-between; font-size: 16px; padding:7px 4px; border-bottom:1px dashed #eee; }
  .total .row:last-child { border-bottom:none; font-weight:bold; color:#ff6f00; }
  footer { text-align:center; color:#999; font-size:14px; padding:18px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>✨ ข้อสอบฝึกของยูน่า ✨</h1>
    <div class="meta">ชั้น ป.4 &nbsp;•&nbsp; วันที่ 16 ต.ค. 2026 🎉</div>
    <div class="meta">5 วิชา วิชาละ 20 ข้อ &nbsp;•&nbsp; รวม 100 ข้อ 💯</div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="progress" id="progress"></div>
  <div id="quiz"></div>

  <div class="btnbar">
    <button class="big checkBtn" onclick="checkSubject()">✅ ตรวจวิชานี้</button>
    <button class="big nextBtn" onclick="nextSubject()">➡️ วิชาถัดไป</button>
    <button class="big resetBtn" onclick="resetSubject()">🔄 ทำวิชานี้ใหม่</button>
  </div>

  <div class="scorebox" id="scorebox"></div>
  <div class="total" id="total"></div>

  <footer>JND • ฝึกทำทุกวัน เก่งขึ้นทุกวัน 💪</footer>
</div>

<script>
const questions = [
  // ===== ภาษาไทย (20 ข้อ) =====
  // (ก) การอ่านจับใจความ 10 ข้อ
  { subj:1, text:"อ่านข้อความ: “ผึ้งเป็นแมลงที่มีประโยชน์มาก ผึ้งช่วยผสมเกสรดอกไม้ ทำให้ต้นไม้ติดผล นอกจากนี้ผึ้งยังผลิตน้ำผึ้งให้คนได้กินอีกด้วย” ใจความสำคัญของข้อความนี้คือข้อใด?", opts:["ต้นไม้ติดผลได้เพราะดอกไม้","ผึ้งเป็นแมลงที่มีประโยชน์มาก","ผึ้งผลิตน้ำผึ้งได้","ผึ้งต่อยคนแล้วเจ็บ"], ans:1, exp:"ประโยคแรกเป็นใจความสำคัญ ประโยคที่เหลือเป็นส่วนขยายที่บอกว่าผึ้งมีประโยชน์อย่างไร" },
  { subj:1, text:"อ่านข้อความ: “หมู่บ้านริมคลองแห่งหนึ่ง ชาวบ้านใช้เรือเป็นพาหนะไปมาหาสู่กัน ทุกเช้าจะมีแม่ค้าพายเรือขายผักและผลไม้ ส่วนเด็ก ๆ ก็นั่งเรือไปโรงเรียน” ชาวบ้านในหมู่บ้านนี้ใช้อะไรเป็นพาหนะ?", opts:["รถไฟ","รถจักรยาน","เกวียน","เรือ"], ans:3, exp:"ข้อความบอกว่า ชาวบ้านใช้เรือเป็นพาหนะไปมาหาสู่กัน" },
  { subj:1, text:"อ่านเรื่อง: “ปลาทองตัวหนึ่งไม่ฟังแม่ที่เตือนว่าอย่าว่ายไปไกลจากฝูง วันหนึ่งมันว่ายออกไปไกลจนหลงทาง กว่าจะกลับมาถึงฝูงก็ทั้งเหนื่อยและหวาดกลัว ตั้งแต่นั้นมาปลาทองก็เชื่อฟังแม่” เรื่องนี้ให้ข้อคิดว่าอย่างไร?", opts:["ควรเชื่อฟังคำเตือนของผู้ใหญ่","ควรอยู่ตามลำพังคนเดียว","ควรฝึกว่ายน้ำให้เร็ว","ไม่ควรคบเพื่อนมาก"], ans:0, exp:"ปลาทองไม่ฟังคำเตือนจึงหลงทาง สอนว่าควรเชื่อฟังคำเตือนของผู้ใหญ่" },
  { subj:1, text:"อ่านเรื่อง: “ทุกวันอาทิตย์ ครอบครัวของนิดจะช่วยกันทำงานบ้าน พ่อตัดหญ้า แม่ซักผ้า นิดกับน้องช่วยกันกวาดบ้านและถูพื้น เมื่อเสร็จแล้วทุกคนก็นั่งกินข้าวด้วยกันอย่างมีความสุข” ชื่อเรื่องใดเหมาะสมที่สุด?", opts:["พ่อชอบตัดหญ้า","แม่ทำอาหารอร่อย","นิดไปโรงเรียน","ครอบครัวช่วยกันทำงานบ้าน"], ans:3, exp:"เรื่องทั้งหมดเล่าว่าทุกคนในครอบครัวช่วยกันทำงานบ้าน ชื่อเรื่องต้องครอบคลุมทั้งเรื่อง" },
  { subj:1, text:"อ่านเรื่อง: “ต้นไม้ในสวนของคุณยายเหี่ยวเฉา เพราะไม่ได้รดน้ำมาหลายวัน ต้นกล้าจึงอาสารดน้ำให้ทุกเช้าก่อนไปโรงเรียน ไม่นานต้นไม้ก็กลับมาเขียวสดอีกครั้ง” เพราะเหตุใดต้นไม้จึงเหี่ยวเฉา?", opts:["คุณยายตัดกิ่งออก","ไม่ได้รดน้ำมาหลายวัน","ได้รับแสงแดดน้อย","มีแมลงมากัดกิน"], ans:1, exp:"เรื่องบอกเหตุผลไว้ว่า เพราะไม่ได้รดน้ำมาหลายวัน" },
  { subj:1, text:"อ่านข้อความ: “การนอนหลับพักผ่อนให้เพียงพอสำคัญต่อร่างกายมาก ขณะที่เรานอนหลับ ร่างกายจะได้พักและซ่อมแซมส่วนที่สึกหรอ เด็กที่นอนหลับเพียงพอจะตื่นมาสดชื่นและมีสมาธิในการเรียน” ใจความสำคัญของข้อความนี้คือข้อใด?", opts:["ร่างกายของเราสึกหรอได้","ควรอ่านหนังสือตอนกลางคืน","การนอนหลับให้เพียงพอสำคัญต่อร่างกาย","เด็กควรตื่นนอนแต่เช้า"], ans:2, exp:"ประโยคแรกคือใจความสำคัญ ส่วนประโยคต่อมาอธิบายเหตุผลสนับสนุน" },
  { subj:1, text:"อ่านประกาศ: “ห้องสมุดโรงเรียนเปิดวันจันทร์ถึงวันศุกร์ เวลา 07.30–16.30 น. นักเรียนยืมหนังสือได้ครั้งละ 2 เล่ม และต้องคืนภายใน 7 วัน ห้ามนำอาหารและเครื่องดื่มเข้าห้องสมุด” ข้อใดถูกต้องตามประกาศ?", opts:["ต้องคืนหนังสือภายใน 14 วัน","นำขนมเข้าไปกินในห้องสมุดได้","ยืมหนังสือได้ครั้งละ 2 เล่ม","ห้องสมุดเปิดวันเสาร์"], ans:2, exp:"ประกาศบอกว่ายืมได้ครั้งละ 2 เล่ม ข้ออื่นขัดกับประกาศ" },
  { subj:1, text:"อ่านเรื่อง: “ปรางตั้งใจซ้อมเปียโนทุกวันเป็นเวลาหลายเดือน ในวันแข่งขันมือของเธอสั่นเล็กน้อย แต่เธอก็เล่นจนจบเพลง เมื่อประกาศผลว่าปรางได้รางวัลชนะเลิศ เธอยิ้มกว้างแล้วกอดคุณแม่ทันที” ตอนประกาศผล ปรางรู้สึกอย่างไร?", opts:["ดีใจ","เสียใจ","โกรธ","เบื่อหน่าย"], ans:0, exp:"ปรางยิ้มกว้างและกอดแม่หลังได้รางวัลชนะเลิศ แสดงว่าดีใจมาก" },
  { subj:1, text:"อ่านเรื่อง: “เก่งเก็บกระเป๋าสตางค์ได้ที่สนามเด็กเล่น ข้างในมีเงินหลายร้อยบาท เก่งนำไปส่งให้คุณครูเพื่อตามหาเจ้าของ เจ้าของกระเป๋าดีใจมากและกล่าวขอบคุณเก่ง” เรื่องนี้สอนเรื่องใด?", opts:["ความขยันหมั่นเพียร","ความซื่อสัตย์","ความประหยัด","ความอดทน"], ans:1, exp:"เก่งไม่เอาเงินที่ไม่ใช่ของตน แต่นำไปคืน แสดงถึงความซื่อสัตย์" },
  { subj:1, text:"อ่านข้อความ: “ขยะพลาสติกที่ถูกทิ้งลงทะเลทำร้ายสัตว์ทะเลจำนวนมาก เต่าทะเลบางตัวกินถุงพลาสติกเข้าไปเพราะคิดว่าเป็นแมงกะพรุน เราจึงควรลดการใช้ถุงพลาสติกและทิ้งขยะให้ถูกที่” ชื่อเรื่องใดเหมาะสมที่สุด?", opts:["แมงกะพรุนแสนสวย","ไปเที่ยวทะเลกันเถอะ","ภัยของขยะพลาสติกต่อสัตว์ทะเล","เต่าทะเลว่ายน้ำเก่ง"], ans:2, exp:"ข้อความทั้งหมดพูดถึงอันตรายของขยะพลาสติกที่มีต่อสัตว์ทะเล" },
  // (ข) คำที่มักเขียนผิด 10 ข้อ
  { subj:1, text:"ข้อใดเขียนถูกต้อง?", opts:["ใบกะเพรา","ใบกะเพา","ใบกระเพา","ใบกระเพรา"], ans:0, exp:"เขียนว่า “กะเพรา” (กะ ไม่มี ร) ตามพจนานุกรม" },
  { subj:1, text:"ข้อใดเขียนถูกต้อง?", opts:["อนุญาต","อณุญาต","อนุยาต","อนุญาติ"], ans:0, exp:"เขียนว่า “อนุญาต” ไม่มีสระ อิ ท้ายคำ" },
  { subj:1, text:"ข้อใดเขียนถูกต้อง?", opts:["สังเกตุ","สังเกด","สังเกตุ์","สังเกต"], ans:3, exp:"เขียนว่า “สังเกต” ไม่มีสระ อุ ใต้ ต" },
  { subj:1, text:"ข้อใดเขียนผิด?", opts:["ประณีต","ศีรษะ","ผลลัพธ์","โอกาศ"], ans:3, exp:"ที่ถูกคือ “โอกาส” ใช้ ส เสือ ส่วนอีก 3 คำเขียนถูกแล้ว" },
  { subj:1, text:"ข้อใดเขียนผิด?", opts:["ปรากฏ","ลายเซ็นต์","บิณฑบาต","สัญลักษณ์"], ans:1, exp:"ที่ถูกคือ “ลายเซ็น” ไม่มี ต์ ส่วนอีก 3 คำเขียนถูกแล้ว" },
  { subj:1, text:"ประโยคใดเขียนถูกต้องทุกคำ?", opts:["คุณแม่เซ็นลายเซ็นต์ในสมุด","ฝนตกกะทันหันจนเปียกศรีษะ","น้องชอบกินไอศกรีมรสสับปะรด","พระสงฆ์ออกบิณฑบาตรตอนเช้า"], ans:2, exp:"“ไอศกรีม” และ “สับปะรด” เขียนถูก ข้ออื่นผิดที่ ลายเซ็นต์ (ลายเซ็น) ศรีษะ (ศีรษะ) บิณฑบาตร (บิณฑบาต)" },
  { subj:1, text:"เติมคำที่เขียนถูกต้อง: “ต้มยำหม้อนี้ ___ อร่อยมาก”", opts:["รดชาติ","รสชาติ","รสชาต","รสชาด"], ans:1, exp:"เขียนว่า “รสชาติ” (ชาติ มีสระ อิ)" },
  { subj:1, text:"ข้อใดเขียนถูกต้อง?", opts:["อุปสรรค","อุปสัค","อุปสรรถ","อุปสรรร"], ans:0, exp:"เขียนว่า “อุปสรรค” ลงท้ายด้วย ค ควาย" },
  { subj:1, text:"ข้อใดเขียนผิด?", opts:["ทะเลสาบ","เกียรติ","เครื่องสำอาง","ผาสุข"], ans:3, exp:"ที่ถูกคือ “ผาสุก” ลงท้ายด้วย ก ไก่ ส่วนอีก 3 คำเขียนถูกแล้ว" },
  { subj:1, text:"ข้อใดเขียนถูกต้องทั้งสองคำ?", opts:["ปรากฏ – จราจล","ปรากฎ – จลาจล","ปรากฏ – จลาจล","ปรากฎ – จราจล"], ans:2, exp:"“ปรากฏ” ใช้ ฏ ปฏัก และ “จลาจล” ใช้ ล ลิง ทั้งสองพยางค์" },
  // ===== คณิตศาสตร์ (20 ข้อ) =====
  // (ก) มุม 10 ข้อ
  { subj:2, text:"มุมที่มีขนาด 90 องศา เรียกว่ามุมอะไร?", opts:["มุมแหลม","มุมฉาก","มุมป้าน","มุมตรง"], ans:1, exp:"มุมฉากมีขนาดเท่ากับ 90° พอดี" },
  { subj:2, text:"มุมขนาด 135° เป็นมุมชนิดใด?", opts:["มุมแหลม","มุมฉาก","มุมตรง","มุมป้าน"], ans:3, exp:"135° มากกว่า 90° แต่น้อยกว่า 180° จึงเป็นมุมป้าน" },
  { subj:2, text:"ข้อใดเป็นขนาดของมุมแหลม?", opts:["45°","95°","180°","210°"], ans:0, exp:"มุมแหลมมีขนาดน้อยกว่า 90° มีเพียง 45° ที่น้อยกว่า 90°" },
  { subj:2, text:"มุมขนาด 250° เป็นมุมชนิดใด?", opts:["มุมป้าน","มุมตรง","มุมกลับ","มุมฉาก"], ans:2, exp:"มุมที่มากกว่า 180° (แต่น้อยกว่า 360°) เรียกว่ามุมกลับ" },
  { subj:2, text:"เครื่องมือที่ใช้วัดขนาดของมุมคืออะไร?", opts:["ไม้บรรทัด","โพรแทรกเตอร์","วงเวียน","ตาชั่ง"], ans:1, exp:"โพรแทรกเตอร์ (ไม้โปรแทรกเตอร์) ใช้วัดขนาดมุมเป็นองศา" },
  { subj:2, text:"มุม ABC (∠ABC) มีจุดยอดมุมคือจุดใด?", opts:["จุด A","จุด C","ไม่มีจุดยอดมุม","จุด B"], ans:3, exp:"การเรียกชื่อมุม ตัวอักษรตรงกลางคือจุดยอดมุม ∠ABC จึงมีจุดยอดมุมที่ B" },
  { subj:2, text:"เวลา 3 นาฬิกาพอดี เข็มสั้นกับเข็มยาวทำมุมกัน (มุมด้านที่เล็กกว่า) กี่องศา?", opts:["90°","30°","60°","180°"], ans:0, exp:"เข็มยาวชี้ 12 เข็มสั้นชี้ 3 ห่างกัน 3 ช่อง ช่องละ 30° → 3 × 30° = 90° เป็นมุมฉาก" },
  { subj:2, text:"เวลา 6 นาฬิกาพอดี เข็มสั้นกับเข็มยาวทำมุมชนิดใด?", opts:["มุมฉาก","มุมแหลม","มุมตรง","มุมป้าน"], ans:2, exp:"เข็มยาวชี้ 12 เข็มสั้นชี้ 6 อยู่ตรงข้ามกันเป็นเส้นตรง = 180° คือมุมตรง" },
  { subj:2, text:"มุมตรง 1 มุม มีขนาดเท่ากับมุมฉากกี่มุม?", opts:["1 มุม","2 มุม","3 มุม","4 มุม"], ans:1, exp:"มุมตรง = 180° และมุมฉาก = 90° → 180 ÷ 90 = 2 มุม" },
  { subj:2, text:"ข้อใดเรียงชนิดของมุมจากขนาดเล็กไปใหญ่ได้ถูกต้อง?", opts:["มุมแหลม → มุมฉาก → มุมป้าน → มุมตรง","มุมฉาก → มุมแหลม → มุมป้าน → มุมตรง","มุมแหลม → มุมป้าน → มุมฉาก → มุมตรง","มุมตรง → มุมป้าน → มุมฉาก → มุมแหลม"], ans:0, exp:"มุมแหลม < 90° < มุมป้าน < 180° (มุมฉาก = 90°, มุมตรง = 180°)" },
  // (ข) ความยาวรอบรูปและพื้นที่รูปสี่เหลี่ยมมุมฉาก 10 ข้อ
  { subj:2, text:"รูปสี่เหลี่ยมจัตุรัสยาวด้านละ 7 ซม. มีความยาวรอบรูปเท่าไร?", opts:["14 ซม.","49 ซม.","28 ซม.","21 ซม."], ans:2, exp:"สี่เหลี่ยมจัตุรัสมี 4 ด้านยาวเท่ากัน → 4 × 7 = 28 ซม." },
  { subj:2, text:"รูปสี่เหลี่ยมผืนผ้ากว้าง 6 ซม. ยาว 9 ซม. มีพื้นที่เท่าไร?", opts:["30 ตร.ซม.","15 ตร.ซม.","45 ตร.ซม.","54 ตร.ซม."], ans:3, exp:"พื้นที่ = กว้าง × ยาว = 6 × 9 = 54 ตร.ซม." },
  { subj:2, text:"รูปสี่เหลี่ยมผืนผ้ากว้าง 5 ม. ยาว 12 ม. มีความยาวรอบรูปเท่าไร?", opts:["34 ม.","17 ม.","60 ม.","24 ม."], ans:0, exp:"รอบรูป = 2 × (กว้าง + ยาว) = 2 × (5 + 12) = 34 ม." },
  { subj:2, text:"รูปสี่เหลี่ยมจัตุรัสมีพื้นที่ 64 ตร.ซม. ยาวด้านละกี่เซนติเมตร?", opts:["16 ซม.","8 ซม.","32 ซม.","6 ซม."], ans:1, exp:"ด้าน × ด้าน = 64 → 8 × 8 = 64 จึงยาวด้านละ 8 ซม." },
  { subj:2, text:"รูปสี่เหลี่ยมผืนผ้ามีพื้นที่ 72 ตร.ม. กว้าง 8 ม. จะยาวกี่เมตร?", opts:["8 ม.","64 ม.","9 ม.","28 ม."], ans:2, exp:"ยาว = พื้นที่ ÷ กว้าง = 72 ÷ 8 = 9 ม." },
  { subj:2, text:"สนามรูปสี่เหลี่ยมผืนผ้ากว้าง 15 ม. ยาว 25 ม. ต้องการล้อมรั้วรอบสนาม ต้องใช้รั้วยาวกี่เมตร?", opts:["40 ม.","375 ม.","65 ม.","80 ม."], ans:3, exp:"ล้อมรั้ว = หาความยาวรอบรูป = 2 × (15 + 25) = 80 ม. (375 คือพื้นที่ ไม่ใช่รั้ว)" },
  { subj:2, text:"ห้องรูปสี่เหลี่ยมผืนผ้ากว้าง 3 ม. ยาว 4 ม. ปูกระเบื้องแผ่นละ 1 ตร.ม. เต็มห้อง ต้องใช้กระเบื้องกี่แผ่น?", opts:["7 แผ่น","12 แผ่น","14 แผ่น","16 แผ่น"], ans:1, exp:"ปูกระเบื้อง = หาพื้นที่ = 3 × 4 = 12 ตร.ม. ใช้แผ่นละ 1 ตร.ม. จึงใช้ 12 แผ่น" },
  { subj:2, text:"ข้อใดเป็นหน่วยที่ใช้บอก “พื้นที่”?", opts:["ตารางเซนติเมตร","เซนติเมตร","กิโลกรัม","ลิตร"], ans:0, exp:"พื้นที่ใช้หน่วยตาราง เช่น ตร.ซม. ตร.ม. ส่วนเซนติเมตรเป็นหน่วยความยาว" },
  { subj:2, text:"รูปสี่เหลี่ยมจัตุรัสมีความยาวรอบรูป 36 ซม. มีพื้นที่เท่าไร?", opts:["36 ตร.ซม.","144 ตร.ซม.","81 ตร.ซม.","72 ตร.ซม."], ans:2, exp:"ด้านยาว = 36 ÷ 4 = 9 ซม. → พื้นที่ = 9 × 9 = 81 ตร.ซม." },
  { subj:2, text:"รูปสี่เหลี่ยมผืนผ้ามีความยาวรอบรูป 30 ซม. ด้านยาว 10 ซม. ด้านกว้างยาวกี่เซนติเมตร?", opts:["20 ซม.","3 ซม.","15 ซม.","5 ซม."], ans:3, exp:"กว้าง + ยาว = 30 ÷ 2 = 15 ซม. → กว้าง = 15 − 10 = 5 ซม." },
  // ===== ภาษาอังกฤษ (20 ข้อ) =====
  // (ก) Comparative / Superlative 10 ข้อ
  { subj:3, text:"An elephant is ______ than a dog.", opts:["big","bigger","biggest","more big"], ans:1, exp:"มี than ใช้ขั้นกว่า big เป็นคำพยางค์เดียว สระเดียว ตัวสะกดเดียว ต้องซ้อน g → bigger" },
  { subj:3, text:"Mount Everest is ______ mountain in the world.", opts:["the highest","higher","the higher","most high"], ans:0, exp:"เปรียบกับทั้งโลก ใช้ขั้นสูงสุด the + -est → the highest" },
  { subj:3, text:"รูปขั้นกว่า (comparative) ของคำว่า happy คือข้อใด", opts:["happyer","happyest","happier","happiest"], ans:2, exp:"คำลงท้าย y หลังพยัญชนะ เปลี่ยน y เป็น i แล้วเติม -er → happier (happiest เป็นขั้นสูงสุด)" },
  { subj:3, text:"My handwriting is bad, but Tom's handwriting is ______ than mine.", opts:["badder","worse","worst","more bad"], ans:1, exp:"bad เป็นคำไม่ปกติ bad – worse – worst มี than จึงใช้ worse" },
  { subj:3, text:"Yuna is ______ student in our class. She always gets full marks.", opts:["the best","better","the good","the goodest"], ans:0, exp:"เก่งที่สุดในห้อง ใช้ขั้นสูงสุด good – better – best → the best" },
  { subj:3, text:"A cheetah runs ______ than a horse.", opts:["fast","fastest","more fast","faster"], ans:3, exp:"มี than ใช้ขั้นกว่า fast → faster (เสือชีตาห์วิ่งเร็วกว่าม้า)" },
  { subj:3, text:"This dress is ______ than that one. (ชุดนี้สวยกว่าชุดนั้น)", opts:["beautifuler","most beautiful","more beautiful","the more beautiful"], ans:2, exp:"คำยาวหลายพยางค์ ใช้ more นำหน้าในขั้นกว่า → more beautiful" },
  { subj:3, text:"ข้อใดเป็นรูปขั้นสูงสุด (superlative) ของคำว่า hot ที่สะกดถูกต้อง", opts:["the hotest","the hottest","the hoter","the hotter"], ans:1, exp:"hot ต้องซ้อน t แล้วเติม -est → the hottest (hotter เป็นขั้นกว่า)" },
  { subj:3, text:"Bangkok is ______ city in Thailand. (เมืองที่ใหญ่ที่สุด)", opts:["the largest","larger","the larger","largest than"], ans:0, exp:"ใหญ่ที่สุดในประเทศ ใช้ the + ขั้นสูงสุด → the largest" },
  { subj:3, text:"This puzzle is the ______ of all. (ยากที่สุด)", opts:["more difficult","difficultest","difficulter","most difficult"], ans:3, exp:"คำยาวหลายพยางค์ ขั้นสูงสุดใช้ the most → the most difficult" },
  // (ข) Countable / Uncountable + a / an / some / any 10 ข้อ
  { subj:3, text:"I eat ______ apple every day.", opts:["a","an","some","any"], ans:1, exp:"apple ขึ้นต้นด้วยเสียงสระ และเป็นนามนับได้เอกพจน์ ใช้ an" },
  { subj:3, text:"She is wearing ______ uniform.", opts:["a","an","some","any"], ans:0, exp:"uniform อ่านขึ้นต้นด้วยเสียง “ยู” (เสียงพยัญชนะ y) จึงใช้ a ไม่ใช่ an" },
  { subj:3, text:"Please wait for ______ hour.", opts:["some","any","an","a"], ans:2, exp:"hour ไม่ออกเสียง h ขึ้นต้นด้วยเสียงสระ จึงใช้ an" },
  { subj:3, text:"I am thirsty. Can I have ______ water, please?", opts:["a","an","some","many"], ans:2, exp:"water นับไม่ได้ ใช้ a/an/many ไม่ได้ ประโยคขอสิ่งของใช้ some ได้" },
  { subj:3, text:"There isn't ______ milk in the fridge.", opts:["any","some","a","an"], ans:0, exp:"ประโยคปฏิเสธใช้ any และ milk นับไม่ได้ ใช้ a/an ไม่ได้" },
  { subj:3, text:"ข้อใดเป็นคำนามนับไม่ได้ (uncountable noun)", opts:["banana","pencil","chair","water"], ans:3, exp:"water (น้ำ) นับเป็นชิ้นไม่ได้ ส่วน banana pencil chair นับได้" },
  { subj:3, text:"ข้อใดใช้ any ได้ถูกต้อง", opts:["I have any money.","There is any sugar in the jar.","She wants any apples.","Is there any bread on the table?"], ans:3, exp:"any ใช้ในประโยคคำถามและปฏิเสธ ข้อนี้เป็นคำถามจึงถูก ข้ออื่นเป็นบอกเล่าต้องใช้ some" },
  { subj:3, text:"ข้อใดใช้ a / an ถูกต้องทั้งสองคำ", opts:["an egg, a umbrella","a egg, an umbrella","an egg, an umbrella","a egg, a umbrella"], ans:2, exp:"egg และ umbrella ขึ้นต้นด้วยเสียงสระ ใช้ an ทั้งคู่" },
  { subj:3, text:"There are ______ eggs in the basket.", opts:["an","a","any","some"], ans:3, exp:"ประโยคบอกเล่า + นามพหูพจน์ (eggs) ใช้ some ส่วน a/an ใช้กับเอกพจน์" },
  { subj:3, text:"My mother bought ______ rice and ______ bananas.", opts:["a / some","some / some","an / any","some / a"], ans:1, exp:"rice นับไม่ได้ ใช้ some และ bananas เป็นพหูพจน์ในประโยคบอกเล่า ใช้ some" },
  // ===== วิทยาศาสตร์ (20 ข้อ) =====
  // (ก) การจำแนกสัตว์ 10 ข้อ
  { subj:4, text:"สัตว์ในข้อใดเป็นสัตว์ไม่มีกระดูกสันหลัง", opts:["กบ","งู","ไส้เดือนดิน","นกพิราบ"], ans:2, exp:"ไส้เดือนดินไม่มีกระดูกสันหลัง ส่วนกบ งู และนกพิราบเป็นสัตว์มีกระดูกสันหลัง" },
  { subj:4, text:"วาฬและโลมาอาศัยอยู่ในทะเล แต่จัดอยู่ในกลุ่มสัตว์ใด", opts:["สัตว์เลี้ยงลูกด้วยน้ำนม","ปลา","สัตว์สะเทินน้ำสะเทินบก","สัตว์เลื้อยคลาน"], ans:0, exp:"วาฬและโลมาหายใจด้วยปอด ออกลูกเป็นตัว และเลี้ยงลูกด้วยน้ำนม จึงเป็นสัตว์เลี้ยงลูกด้วยน้ำนม" },
  { subj:4, text:"ค้างคาวบินได้ แต่ไม่จัดเป็นสัตว์ปีก (นก) เพราะเหตุใด", opts:["ค้างคาวหายใจด้วยเหงือก","ค้างคาวมีขนเป็นเส้นและเลี้ยงลูกด้วยน้ำนม","ค้างคาวออกลูกเป็นไข่","ค้างคาวไม่มีกระดูกสันหลัง"], ans:1, exp:"ค้างคาวมีขนเป็นเส้น ออกลูกเป็นตัวและเลี้ยงลูกด้วยน้ำนม จึงเป็นสัตว์เลี้ยงลูกด้วยน้ำนม" },
  { subj:4, text:"เพนกวินบินไม่ได้แต่ว่ายน้ำเก่ง ลักษณะใดทำให้เพนกวินจัดเป็นสัตว์ปีก", opts:["มีครีบและหายใจด้วยเหงือก","เลี้ยงลูกด้วยน้ำนม","ผิวหนังเปียกชื้นตลอดเวลา","มีขนนกปกคลุมร่างกายและออกลูกเป็นไข่"], ans:3, exp:"เพนกวินมีขนนก มีปีก และออกลูกเป็นไข่ จึงเป็นสัตว์ปีก (นก)" },
  { subj:4, text:"สัตว์ที่ผิวหนังเปียกชื้น ไม่มีเกล็ด ตอนเล็กอยู่ในน้ำหายใจด้วยเหงือก โตแล้วขึ้นบกหายใจด้วยปอด จัดอยู่ในกลุ่มใด", opts:["ปลา","สัตว์เลื้อยคลาน","สัตว์สะเทินน้ำสะเทินบก","สัตว์ปีก"], ans:2, exp:"ลักษณะนี้เป็นของสัตว์สะเทินน้ำสะเทินบก เช่น กบ คางคก" },
  { subj:4, text:"เต่าจัดอยู่ในกลุ่มสัตว์ใด", opts:["สัตว์สะเทินน้ำสะเทินบก","สัตว์เลื้อยคลาน","ปลา","สัตว์เลี้ยงลูกด้วยน้ำนม"], ans:1, exp:"เต่ามีผิวหนังแห้งเป็นเกล็ด หายใจด้วยปอด ออกลูกเป็นไข่ จึงเป็นสัตว์เลื้อยคลาน" },
  { subj:4, text:"ข้อใดเป็นลักษณะเด่นของปลา", opts:["หายใจด้วยเหงือก และมีครีบช่วยในการว่ายน้ำ","มีขนนกปกคลุมร่างกาย","เลี้ยงลูกด้วยน้ำนม","มีขนเป็นเส้นปกคลุมร่างกาย"], ans:0, exp:"ปลาอาศัยในน้ำ หายใจด้วยเหงือก และใช้ครีบช่วยว่ายน้ำ" },
  { subj:4, text:"แมงมุมไม่ใช่แมลง เพราะเหตุใด", opts:["แมงมุมมีกระดูกสันหลัง","แมงมุมเลี้ยงลูกด้วยน้ำนม","แมงมุมมีปีก 2 คู่","แมงมุมมี 8 ขา ส่วนแมลงมี 6 ขา"], ans:3, exp:"แมลงมี 6 ขาและลำตัว 3 ส่วน ส่วนแมงมุมมี 8 ขาและลำตัว 2 ส่วน" },
  { subj:4, text:"“ปลาหมึก” มีคำว่า “ปลา” อยู่ในชื่อ แต่จริงๆ แล้วจัดอยู่ในกลุ่มใด", opts:["ปลา","สัตว์สะเทินน้ำสะเทินบก","สัตว์ไม่มีกระดูกสันหลัง","สัตว์เลี้ยงลูกด้วยน้ำนม"], ans:2, exp:"หมึกไม่มีกระดูกสันหลัง จึงไม่ใช่ปลา แต่เป็นสัตว์ไม่มีกระดูกสันหลัง" },

const subjShort = { 1:"📖 ภาษาไทย", 2:"🔢 คณิตศาสตร์", 3:"🔤 ภาษาอังกฤษ", 4:"🔬 วิทยาศาสตร์", 5:"🗺️ สังคมศึกษา" };

const selected = {};
const checkedSubj = {};
const scoreSubj = {};
let cur = 1;
const SUBJS = [1,2,3,4,5];

function qsOf(s){ return questions.map((q,i)=>({q,i})).filter(o=>o.q.subj===s); }

function renderTabs(){
  const t = document.getElementById('tabs');
  t.innerHTML = '';
  SUBJS.forEach(s=>{
    const b = document.createElement('button');
    b.className = 'tab' + (s===cur?' active':'') + (checkedSubj[s]?' done':'');
    const short = subjShort[s];
    b.innerHTML = short + '<span class="tn">' + (checkedSubj[s] ? (scoreSubj[s]+'/'+qsOf(s).length) : '20 ข้อ') + '</span>';
    b.onclick = ()=>{ cur = s; render(); window.scrollTo({top:0,behavior:'smooth'}); };
    t.appendChild(b);
  });
}

function render(){
  renderTabs();
  const box = document.getElementById('quiz');
  box.innerHTML = '';
  const title = document.createElement('div');
  title.className = 'subject-title';
  title.textContent = subjNames[cur];
  box.appendChild(title);

  qsOf(cur).forEach((o, n)=>{
    const q = o.q, i = o.i;
    const card = document.createElement('div');
    card.className = 'q';
    let html = '<div class="text"><span class="num">'+(n+1)+'</span>'+q.text+'</div>';
    q.opts.forEach((op, oi)=>{
      let cls = 'opt';
      if (checkedSubj[cur]) {
        if (oi === q.ans) cls += ' correct';
        else if (oi === selected[i]) cls += ' wrong';
      } else if (selected[i] === oi) cls += ' sel';
      html += '<button class="'+cls+'" data-q="'+i+'" data-o="'+oi+'" onclick="pick('+i+','+oi+')">'+op+'</button>';
    });
    html += '<div class="explain'+(checkedSubj[cur]?' show':'')+'" id="exp-'+i+'">💡 เฉลย: '+q.opts[q.ans]+' — '+q.exp+'</div>';
    card.innerHTML = html;
    box.appendChild(card);
  });

  const sb = document.getElementById('scorebox');
  if (checkedSubj[cur]) showScore(scoreSubj[cur], qsOf(cur).length); else sb.classList.remove('show');
  updateProgress();
  renderTotal();
}

function updateProgress(){
  const list = qsOf(cur);
  const done = list.filter(o=>selected[o.i]!==undefined).length;
  document.getElementById('progress').textContent = 'ทำไปแล้ว ' + done + ' / ' + list.length + ' ข้อ';
}

function pick(qi, oi){
  if (checkedSubj[questions[qi].subj]) return;
  selected[qi] = oi;
  document.querySelectorAll('.opt[data-q="'+qi+'"]').forEach(b=>b.classList.remove('sel'));
  document.querySelector('.opt[data-q="'+qi+'"][data-o="'+oi+'"]').classList.add('sel');
  updateProgress();
}

function checkSubject(){
  const list = qsOf(cur);
  let score = 0;
  list.forEach(o=>{ if (selected[o.i] === o.q.ans) score++; });
  checkedSubj[cur] = true;
  scoreSubj[cur] = score;
  render();
  document.getElementById('scorebox').scrollIntoView({behavior:'smooth'});
}

function resetSubject(){
  qsOf(cur).forEach(o=>{ delete selected[o.i]; });
  delete checkedSubj[cur];
  delete scoreSubj[cur];
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function nextSubject(){
  cur = cur % 5 + 1;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function showScore(score, total){
  const pct = score/total;
  let praise, emoji;
  if (pct === 1) { praise = "สุดยอดมากลูก! ทำได้เต็มทุกข้อ!"; emoji="🏆🎉"; }
  else if (pct >= 0.8) { praise = "เก่งมากยูน่า! เกือบเต็มแล้ว!"; emoji="🌟😍"; }
  else if (pct >= 0.6) { praise = "ทำได้ดีมากลูก! พัฒนาขึ้นเรื่อยๆ!"; emoji="😊👍"; }
  else { praise = "เยี่ยมที่ตั้งใจทำจนจบ! ลองทบทวนเฉลยแล้วสู้ต่อนะ!"; emoji="🤗💪"; }
  const sb = document.getElementById('scorebox');
  sb.innerHTML = '<div>'+subjShort[cur]+'</div><div class="big-score">'+score+' / '+total+' '+emoji+'</div><div class="praise">'+praise+'</div>';
  sb.classList.add('show');
}

function renderTotal(){
  const el = document.getElementById('total');
  const doneSubjs = SUBJS.filter(s=>checkedSubj[s]);
  if (!doneSubjs.length) { el.innerHTML = '<h3>📋 ตรวจวิชาไหนแล้ว คะแนนจะมาโชว์ตรงนี้</h3>'; return; }
  let sum = 0, tot = 0, rows = '';
  SUBJS.forEach(s=>{
    const n = qsOf(s).length;
    if (checkedSubj[s]) { sum += scoreSubj[s]; tot += n; rows += '<div class="row"><span>'+subjShort[s]+'</span><span>'+scoreSubj[s]+' / '+n+'</span></div>'; }
  });
  rows += '<div class="row"><span>รวมทั้งหมด</span><span>'+sum+' / '+tot+'</span></div>';
  el.innerHTML = '<h3>🏅 สรุปคะแนน</h3>' + rows;
}

render();
</script>
</body>
</html>
