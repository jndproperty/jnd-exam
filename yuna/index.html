<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ข้อสอบฝึกยูน่า ป.4 - 28 ก.ค. 2026</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Tahoma', 'Sarabun', sans-serif;
    margin: 0; padding: 0;
    background: linear-gradient(160deg, #e3f2fd 0%, #e8f5e9 100%);
    color: #263238;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
  header {
    text-align: center; background: #5c6bc0; color: #fff;
    border-radius: 20px; padding: 22px 16px; margin-bottom: 16px;
    box-shadow: 0 5px 0 #3f51b5;
  }
  header h1 { margin: 0 0 6px; font-size: 26px; }
  header .meta { font-size: 16px; opacity: .95; }
  .subject-title {
    font-size: 20px; font-weight: bold; color: #fff;
    background: #7e57c2; border-radius: 14px;
    padding: 11px 18px; margin: 22px 0 12px;
    box-shadow: 0 4px 0 #5e35b1;
  }
  .subject-title.s2 { background: #00897b; box-shadow: 0 4px 0 #00695c; }
  .q {
    background: #fff; border-radius: 16px; padding: 16px 18px;
    margin-bottom: 14px; box-shadow: 0 3px 8px rgba(0,0,0,.07);
  }
  .q .num {
    display: inline-block; background: #ffb74d; color: #4e342e;
    font-weight: bold; border-radius: 50%; width: 30px; height: 30px;
    line-height: 30px; text-align: center; font-size: 16px; margin-right: 8px;
  }
  .q .text { font-size: 19px; font-weight: bold; margin: 4px 0 12px; }
  .opt {
    display: block; width: 100%; text-align: left;
    font-size: 18px; font-family: inherit;
    background: #f5f5f5; border: 2px solid #e0e0e0;
    border-radius: 12px; padding: 11px 16px; margin-bottom: 8px;
    cursor: pointer; transition: .12s;
  }
  .opt:active { transform: scale(.99); }
  .opt.sel { background: #bbdefb; border-color: #2196f3; }
  .opt.correct { background: #c8e6c9; border-color: #43a047; }
  .opt.wrong { background: #ffcdd2; border-color: #e53935; }
  .explain {
    display: none; font-size: 16px; background: #fff8e1;
    border-left: 5px solid #ffb300; border-radius: 8px;
    padding: 9px 13px; margin-top: 9px; color: #6d4c00;
  }
  .explain.show { display: block; }
  .btnbar { text-align: center; margin: 24px 0; }
  button.big {
    font-family: inherit; font-size: 20px; font-weight: bold;
    color: #fff; border: none; border-radius: 16px;
    padding: 14px 26px; margin: 8px; cursor: pointer;
  }
  #checkBtn { background: #43a047; box-shadow: 0 5px 0 #2e7d32; }
  #resetBtn { background: #78909c; box-shadow: 0 5px 0 #546e7a; }
  button.big:active { transform: translateY(3px); box-shadow: none; }
  #scorebox {
    display: none; text-align: center; font-size: 22px; font-weight: bold;
    background: #fff; border-radius: 20px; padding: 22px;
    margin: 18px 0; box-shadow: 0 5px 12px rgba(0,0,0,.12);
  }
  #scorebox.show { display: block; }
  #scorebox .big-score { font-size: 40px; color: #f57c00; }
  #scorebox .praise { font-size: 20px; margin-top: 8px; }
  footer { text-align: center; color: #999; font-size: 13px; padding: 20px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>✨ ข้อสอบฝึกของยูน่า ✨</h1>
    <div class="meta">ชั้น ป.4 &nbsp;•&nbsp; วันที่ 28 ก.ค. 2026 🎉</div>
    <div class="meta">วิชา: คณิตศาสตร์ ➕ + สุขศึกษา 🩺</div>
  </header>

  <div id="quiz"></div>

  <div class="btnbar">
    <button class="big" id="checkBtn" onclick="checkAll()">✅ ตรวจคำตอบ</button>
    <button class="big" id="resetBtn" onclick="resetAll()">🔄 ทำใหม่</button>
  </div>

  <div id="scorebox"></div>

  <footer>JND • ฝึกทำทุกวัน เก่งขึ้นทุกวัน 💪</footer>
</div>

<script>
const questions = [
  // ===== คณิตศาสตร์: จำนวนนับหลักหมื่น–แสน (15 ข้อ) =====
  { subj:1, text:"ในจำนวน 45,678 เลข 4 อยู่ในหลักใด?", opts:["หลักพัน","หลักหมื่น","หลักแสน","หลักร้อย"], ans:1, exp:"45,678 → 4=หมื่น, 5=พัน, 6=ร้อย, 7=สิบ, 8=หน่วย ดังนั้น 4 อยู่หลักหมื่น" },
  { subj:1, text:"จำนวน 328,150 อ่านว่าอย่างไร?", opts:["สามหมื่นสองพันแปดร้อยสิบห้า","สองแสนสามหมื่นแปดพันหนึ่งร้อยห้าสิบ","สามแสนสองหมื่นแปดพันหนึ่งร้อยห้าสิบ","สามแสนสองหมื่นแปดพันห้าสิบ"], ans:2, exp:"328,150 = สามแสน(3) สองหมื่น(2) แปดพัน(8) หนึ่งร้อย(1) ห้าสิบ(50)" },
  { subj:1, text:"ในจำนวน 76,542 เลข 7 มีค่าเท่าใด?", opts:["7,000","700,000","70,000","7"], ans:2, exp:"เลข 7 อยู่หลักหมื่น มีค่าเท่ากับ 70,000" },
  { subj:1, text:"“หนึ่งแสนสองหมื่นสามพันสี่ร้อยห้าสิบหก” เขียนเป็นตัวเลขได้อย่างไร?", opts:["123,465","123,456","132,456","12,3456"], ans:1, exp:"หนึ่งแสน(1) สองหมื่น(2) สามพัน(3) สี่ร้อย(4) ห้าสิบ(5) หก(6) = 123,456" },
  { subj:1, text:"จำนวนใดต่อไปนี้มีค่ามากที่สุด?", opts:["89,999","90,001","90,010","88,888"], ans:2, exp:"เทียบทีละหลัก 90,010 มากกว่า 90,001 จึงมากที่สุด" },
  { subj:1, text:"จำนวนนับที่มากที่สุดที่มี 5 หลัก คือจำนวนใด?", opts:["100,000","99,999","10,000","99,990"], ans:1, exp:"5 หลักที่มากที่สุดคือ 99,999 (ถ้าเพิ่มอีก 1 จะเป็น 6 หลัก)" },
  { subj:1, text:"จำนวนนับที่น้อยที่สุดที่มี 6 หลัก คือจำนวนใด?", opts:["99,999","100,001","100,000","999,999"], ans:2, exp:"6 หลักที่น้อยที่สุดคือ 100,000" },
  { subj:1, text:"ในจำนวน 253,600 เลข 5 อยู่ในหลักใด?", opts:["หลักพัน","หลักแสน","หลักหมื่น","หลักร้อย"], ans:2, exp:"253,600 → 2=แสน, 5=หมื่น, 3=พัน ดังนั้น 5 อยู่หลักหมื่น" },
  { subj:1, text:"60,000 + 4,000 + 200 + 30 + 5 เท่ากับจำนวนใด?", opts:["64,235","60,435","64,253","46,235"], ans:0, exp:"รวมค่าประจำหลักได้ 64,235" },
  { subj:1, text:"จำนวน 500,000 อ่านว่าอย่างไร?", opts:["ห้าหมื่น","ห้าแสน","ห้าล้าน","ห้าพัน"], ans:1, exp:"500,000 อ่านว่า ห้าแสน" },
  { subj:1, text:"จำนวนที่นับต่อจาก 99,999 คือจำนวนใด?", opts:["99,990","100,000","10,000","90,000"], ans:1, exp:"99,999 + 1 = 100,000" },
  { subj:1, text:"ในจำนวน 418,326 เลขในหลักแสนคือเลขใด?", opts:["1","8","4","3"], ans:2, exp:"418,326 → เลขหลักแสนคือ 4" },
  { subj:1, text:"เรียงจำนวนจากน้อยไปมากข้อใดถูกต้อง?", opts:["45,000 < 44,900 < 54,000","44,900 < 45,000 < 54,000","54,000 < 45,000 < 44,900","44,900 < 54,000 < 45,000"], ans:1, exp:"44,900 น้อยสุด แล้ว 45,000 และ 54,000 มากสุด" },
  { subj:1, text:"ในจำนวน 380,000 เลข 8 มีค่าเท่าใด?", opts:["8,000","800,000","80,000","8"], ans:2, exp:"เลข 8 อยู่หลักหมื่น มีค่าเท่ากับ 80,000" },
  { subj:1, text:"จำนวนใดอยู่ระหว่าง 79,999 กับ 80,001?", opts:["79,998","80,000","80,002","81,000"], ans:1, exp:"ระหว่าง 79,999 กับ 80,001 คือ 80,000" },

  // ===== สุขศึกษา: ระบบต่างๆ ของร่างกาย (ย่อยอาหาร/หายใจ) (15 ข้อ) =====
  { subj:2, text:"อวัยวะใดทำหน้าที่ย่อยอาหารเป็นด่านแรกของร่างกาย?", opts:["กระเพาะอาหาร","ปาก","ลำไส้เล็ก","ตับ"], ans:1, exp:"การย่อยเริ่มที่ปาก ฟันบดเคี้ยวและน้ำลายช่วยย่อย" },
  { subj:2, text:"อวัยวะที่ใช้ในการหายใจโดยตรง คืออวัยวะใด?", opts:["หัวใจ","ปอด","ตับ","ไต"], ans:1, exp:"ปอดเป็นอวัยวะหลักของระบบหายใจ" },
  { subj:2, text:"อาหารที่เคี้ยวในปากถูกส่งผ่านท่อใดไปยังกระเพาะอาหาร?", opts:["หลอดลม","หลอดอาหาร","ลำไส้ใหญ่","หลอดเลือด"], ans:1, exp:"อาหารผ่านหลอดอาหารลงสู่กระเพาะอาหาร" },
  { subj:2, text:"การดูดซึมสารอาหารส่วนใหญ่เกิดขึ้นที่อวัยวะใด?", opts:["กระเพาะอาหาร","ลำไส้ใหญ่","ลำไส้เล็ก","ปาก"], ans:2, exp:"ลำไส้เล็กเป็นที่ดูดซึมสารอาหารเข้าสู่ร่างกาย" },
  { subj:2, text:"เมื่อหายใจเข้า ร่างกายรับแก๊สใดเข้าไปใช้?", opts:["คาร์บอนไดออกไซด์","ออกซิเจน","ไนโตรเจน","ไฮโดรเจน"], ans:1, exp:"ร่างกายรับออกซิเจนเข้าไปใช้ในการหายใจ" },
  { subj:2, text:"เมื่อหายใจออก ร่างกายปล่อยแก๊สใดออกมา?", opts:["ออกซิเจน","ไฮโดรเจน","คาร์บอนไดออกไซด์","ฮีเลียม"], ans:2, exp:"ร่างกายปล่อยแก๊สคาร์บอนไดออกไซด์ออกมา" },
  { subj:2, text:"น้ำลายในปากช่วยย่อยอาหารประเภทใดเป็นหลัก?", opts:["โปรตีน","ไขมัน","แป้ง","วิตามิน"], ans:2, exp:"น้ำลายมีเอนไซม์ช่วยย่อยแป้ง (คาร์โบไฮเดรต)" },
  { subj:2, text:"กากอาหารที่ย่อยแล้วจะถูกเก็บและขับออกจากอวัยวะใด?", opts:["ลำไส้เล็ก","กระเพาะอาหาร","ลำไส้ใหญ่","ปอด"], ans:2, exp:"ลำไส้ใหญ่เก็บกากอาหารก่อนขับออกเป็นอุจจาระ" },
  { subj:2, text:"อวัยวะใดเป็นทางผ่านของอากาศจากคอหอยลงสู่ปอด?", opts:["หลอดอาหาร","หลอดลม","กระเพาะอาหาร","ตับ"], ans:1, exp:"อากาศผ่านหลอดลมลงสู่ปอด" },
  { subj:2, text:"การกินอาหารให้ครบ 5 หมู่ มีประโยชน์อย่างไร?", opts:["ทำให้ร่างกายแข็งแรง เจริญเติบโต","ทำให้ป่วยง่าย","ทำให้ผอมลง","ไม่มีผลต่อร่างกาย"], ans:0, exp:"อาหารครบ 5 หมู่ช่วยให้ร่างกายเจริญเติบโตแข็งแรง" },
  { subj:2, text:"เพื่อให้ระบบย่อยอาหารทำงานดี เราควรทำอย่างไร?", opts:["กลืนอาหารทั้งชิ้น","เคี้ยวอาหารให้ละเอียด ไม่รีบกิน","กินเร็วๆ","อดอาหาร"], ans:1, exp:"เคี้ยวอาหารให้ละเอียดช่วยให้ย่อยง่ายขึ้น" },
  { subj:2, text:"อวัยวะใดสร้างน้ำดีช่วยย่อยไขมัน?", opts:["ตับ","ปอด","หัวใจ","ไต"], ans:0, exp:"ตับสร้างน้ำดีที่ช่วยย่อยไขมัน" },
  { subj:2, text:"กระเพาะอาหารมีหน้าที่อย่างไร?", opts:["สูบฉีดเลือด","ย่อยอาหารด้วยน้ำย่อยและคลุกเคล้าอาหาร","ฟอกอากาศ","กรองของเสีย"], ans:1, exp:"กระเพาะอาหารหลั่งน้ำย่อยและคลุกเคล้าอาหารให้ละเอียด" },
  { subj:2, text:"เพื่อให้ปอดแข็งแรง เราควรหลีกเลี่ยงสิ่งใด?", opts:["อากาศบริสุทธิ์","การออกกำลังกาย","ควันบุหรี่","การดื่มน้ำ"], ans:2, exp:"ควันบุหรี่ทำร้ายปอด ควรหลีกเลี่ยง" },
  { subj:2, text:"อวัยวะใดทำงานคู่กับปอด โดยสูบฉีดเลือดไปเลี้ยงร่างกาย?", opts:["ไต","หัวใจ","ตับ","กระเพาะอาหาร"], ans:1, exp:"หัวใจสูบฉีดเลือดที่รับออกซิเจนจากปอดไปเลี้ยงร่างกาย" }
];

const subjNames = { 1:"➕ วิชาคณิตศาสตร์ — จำนวนนับหลักหมื่น–แสน", 2:"🩺 วิชาสุขศึกษา — ระบบต่างๆ ของร่างกาย" };
const selected = {};
let checked = false;

function render() {
  const box = document.getElementById('quiz');
  box.innerHTML = '';
  let lastSubj = null;
  questions.forEach((q, i) => {
    if (q.subj !== lastSubj) {
      const t = document.createElement('div');
      t.className = 'subject-title' + (q.subj===2 ? ' s2' : '');
      t.textContent = subjNames[q.subj];
      box.appendChild(t);
      lastSubj = q.subj;
    }
    const card = document.createElement('div');
    card.className = 'q';
    const numInSubj = questions.slice(0,i+1).filter(x=>x.subj===q.subj).length;
    let html = '<div class="text"><span class="num">'+numInSubj+'</span>'+q.text+'</div>';
    q.opts.forEach((o, oi) => {
      html += '<button class="opt" data-q="'+i+'" data-o="'+oi+'" onclick="pick('+i+','+oi+')">'+o+'</button>';
    });
    html += '<div class="explain" id="exp-'+i+'">💡 เฉลย: '+q.opts[q.ans]+' — '+q.exp+'</div>';
    card.innerHTML = html;
    box.appendChild(card);
  });
}

function pick(qi, oi) {
  if (checked) return;
  selected[qi] = oi;
  document.querySelectorAll('.opt[data-q="'+qi+'"]').forEach(b => b.classList.remove('sel'));
  document.querySelector('.opt[data-q="'+qi+'"][data-o="'+oi+'"]').classList.add('sel');
}

function checkAll() {
  checked = true;
  let score = 0;
  questions.forEach((q, i) => {
    const sel = selected[i];
    document.querySelectorAll('.opt[data-q="'+i+'"]').forEach(b => {
      const oi = +b.dataset.o;
      b.classList.remove('sel');
      if (oi === q.ans) b.classList.add('correct');
      if (oi === sel && sel !== q.ans) b.classList.add('wrong');
    });
    document.getElementById('exp-'+i).classList.add('show');
    if (sel === q.ans) score++;
  });
  showScore(score);
}

function showScore(score) {
  const total = questions.length;
  const pct = score/total;
  let praise, emoji;
  if (pct === 1) { praise = "สุดยอดมากลูก! ทำได้เต็มทุกข้อ!"; emoji="🏆🎉"; }
  else if (pct >= 0.8) { praise = "เก่งมากยูน่า! เกือบเต็มแล้ว!"; emoji="🌟😍"; }
  else if (pct >= 0.6) { praise = "ทำได้ดีมากลูก! พัฒนาขึ้นเรื่อยๆ!"; emoji="😊👍"; }
  else { praise = "เยี่ยมที่ตั้งใจทำจนจบ! ลองทบทวนเฉลยแล้วสู้ต่อนะ!"; emoji="🤗💪"; }
  const sb = document.getElementById('scorebox');
  sb.innerHTML = '<div>ได้คะแนน</div><div class="big-score">'+score+' / '+total+' '+emoji+'</div><div class="praise">'+praise+'</div>';
  sb.classList.add('show');
  sb.scrollIntoView({behavior:'smooth'});
}

function resetAll() {
  checked = false;
  for (const k in selected) delete selected[k];
  document.getElementById('scorebox').classList.remove('show');
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

render();
</script>
</body>
</html>
