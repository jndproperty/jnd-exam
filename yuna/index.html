<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ข้อสอบฝึกยูน่า ป.4 - 29 ก.ค. 2026</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Tahoma', 'Sarabun', sans-serif;
    margin: 0; padding: 0;
    background: linear-gradient(160deg, #e3f2fd 0%, #e8f5e9 100%);
    color: #263238;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
  header {
    text-align: center; background: #5c6bc0; color: #fff;
    border-radius: 20px; padding: 22px 16px; margin-bottom: 16px;
    box-shadow: 0 5px 0 #3f51b5;
  }
  header h1 { margin: 0 0 6px; font-size: 26px; }
  header .meta { font-size: 16px; opacity: .95; }
  .subject-title {
    font-size: 20px; font-weight: bold; color: #fff;
    background: #7e57c2; border-radius: 14px;
    padding: 11px 18px; margin: 22px 0 12px;
    box-shadow: 0 4px 0 #5e35b1;
  }
  .subject-title.s2 { background: #00897b; box-shadow: 0 4px 0 #00695c; }
  .q {
    background: #fff; border-radius: 16px; padding: 16px 18px;
    margin-bottom: 14px; box-shadow: 0 3px 8px rgba(0,0,0,.07);
  }
  .q .num {
    display: inline-block; background: #ffb74d; color: #4e342e;
    font-weight: bold; border-radius: 50%; width: 30px; height: 30px;
    line-height: 30px; text-align: center; font-size: 16px; margin-right: 8px;
  }
  .q .text { font-size: 19px; font-weight: bold; margin: 4px 0 12px; }
  .opt {
    display: block; width: 100%; text-align: left;
    font-size: 18px; font-family: inherit;
    background: #f5f5f5; border: 2px solid #e0e0e0;
    border-radius: 12px; padding: 11px 16px; margin-bottom: 8px;
    cursor: pointer; transition: .12s;
  }
  .opt:active { transform: scale(.99); }
  .opt.sel { background: #bbdefb; border-color: #2196f3; }
  .opt.correct { background: #c8e6c9; border-color: #43a047; }
  .opt.wrong { background: #ffcdd2; border-color: #e53935; }
  .explain {
    display: none; font-size: 16px; background: #fff8e1;
    border-left: 5px solid #ffb300; border-radius: 8px;
    padding: 9px 13px; margin-top: 9px; color: #6d4c00;
  }
  .explain.show { display: block; }
  .btnbar { text-align: center; margin: 24px 0; }
  button.big {
    font-family: inherit; font-size: 20px; font-weight: bold;
    color: #fff; border: none; border-radius: 16px;
    padding: 14px 26px; margin: 8px; cursor: pointer;
  }
  #checkBtn { background: #43a047; box-shadow: 0 5px 0 #2e7d32; }
  #resetBtn { background: #78909c; box-shadow: 0 5px 0 #546e7a; }
  button.big:active { transform: translateY(3px); box-shadow: none; }
  #scorebox {
    display: none; text-align: center; font-size: 22px; font-weight: bold;
    background: #fff; border-radius: 20px; padding: 22px;
    margin: 18px 0; box-shadow: 0 5px 12px rgba(0,0,0,.12);
  }
  #scorebox.show { display: block; }
  #scorebox .big-score { font-size: 40px; color: #f57c00; }
  #scorebox .praise { font-size: 20px; margin-top: 8px; }
  footer { text-align: center; color: #999; font-size: 13px; padding: 20px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>✨ ข้อสอบฝึกของยูน่า ✨</h1>
    <div class="meta">ชั้น ป.4 &nbsp;•&nbsp; วันที่ 29 ก.ค. 2026 🎉</div>
    <div class="meta">วิชา: ภาษาไทย 📖 + สังคมศึกษา 🗺️</div>
  </header>

  <div id="quiz"></div>

  <div class="btnbar">
    <button class="big" id="checkBtn" onclick="checkAll()">✅ ตรวจคำตอบ</button>
    <button class="big" id="resetBtn" onclick="resetAll()">🔄 ทำใหม่</button>
  </div>

  <div id="scorebox"></div>

  <footer>JND • ฝึกทำทุกวัน เก่งขึ้นทุกวัน 💪</footer>
</div>

<script>
const questions = [
  // ===== ภาษาไทย: คำเป็น–คำตาย และการผันวรรณยุกต์ (15 ข้อ) =====
  { subj:1, text:"“คำเป็น” คือคำที่มีลักษณะอย่างไร?", opts:["ประสมสระเสียงสั้น","ประสมสระเสียงยาว หรือสะกดแม่ กง กน กม เกย เกอว","สะกดแม่ กก กด กบ เท่านั้น","ไม่มีสระ"], ans:1, exp:"คำเป็น = สระเสียงยาว หรือสะกดด้วยแม่ กง กน กม เกย เกอว" },
  { subj:1, text:"“คำตาย” สะกดด้วยมาตราใดต่อไปนี้?", opts:["แม่กก แม่กด แม่กบ","แม่กง แม่กน แม่กม","แม่เกย แม่เกอว","แม่ ก กา เสียงยาว"], ans:0, exp:"คำตาย = สระเสียงสั้น หรือสะกดแม่ กก กด กบ" },
  { subj:1, text:"คำว่า “นก” เป็นคำเป็นหรือคำตาย?", opts:["คำเป็น","คำตาย","ทั้งสองอย่าง","ไม่ใช่ทั้งสอง"], ans:1, exp:"นก สะกดแม่กก จึงเป็นคำตาย" },
  { subj:1, text:"คำว่า “กา” เป็นคำเป็นหรือคำตาย?", opts:["คำเป็น","คำตาย","คำควบ","คำซ้ำ"], ans:0, exp:"กา เป็นสระเสียงยาว (แม่ ก กา) จึงเป็นคำเป็น" },
  { subj:1, text:"คำว่า “จับ” เป็นคำประเภทใด?", opts:["คำเป็น","คำตาย","คำเป็นและคำตาย","ไม่มีคำตอบ"], ans:1, exp:"จับ สะกดแม่กบ จึงเป็นคำตาย" },
  { subj:1, text:"คำว่า “ยาว” เป็นคำประเภทใด?", opts:["คำตาย","คำควบกล้ำ","คำเป็น","คำสมาส"], ans:2, exp:"ยาว สะกดแม่เกอว จึงเป็นคำเป็น" },
  { subj:1, text:"วรรณยุกต์ในภาษาไทยมีกี่รูป?", opts:["5 รูป","4 รูป","3 รูป","6 รูป"], ans:1, exp:"วรรณยุกต์มี 4 รูป ( ่ ้ ๊ ๋ )" },
  { subj:1, text:"วรรณยุกต์ในภาษาไทยมีกี่เสียง?", opts:["5 เสียง","4 เสียง","3 เสียง","6 เสียง"], ans:0, exp:"มี 5 เสียง: สามัญ เอก โท ตรี จัตวา" },
  { subj:1, text:"เครื่องหมาย “ ่ ” เรียกว่าไม้อะไร?", opts:["ไม้เอก","ไม้โท","ไม้ตรี","ไม้จัตวา"], ans:0, exp:"เครื่องหมาย  ่  คือ ไม้เอก" },
  { subj:1, text:"เครื่องหมาย “ ้ ” เรียกว่าไม้อะไร?", opts:["ไม้เอก","ไม้โท","ไม้ตรี","ไม้จัตวา"], ans:1, exp:"เครื่องหมาย  ้  คือ ไม้โท" },
  { subj:1, text:"คำว่า “ป่า” ผันด้วยวรรณยุกต์รูปใด?", opts:["ไม้โท","ไม้ตรี","ไม้เอก","ไม่มีรูป"], ans:2, exp:"ป่า มีไม้เอกกำกับ" },
  { subj:1, text:"เสียงวรรณยุกต์ของคำที่ไม่มีรูปกำกับ (เช่น “กา”) คือเสียงใด?", opts:["เสียงสามัญ","เสียงเอก","เสียงโท","เสียงตรี"], ans:0, exp:"กา ไม่มีรูปวรรณยุกต์ ออกเสียงสามัญ" },
  { subj:1, text:"คำว่า “ตี๋” ใช้วรรณยุกต์รูปใด?", opts:["ไม้ตรี","ไม้โท","ไม้จัตวา","ไม้เอก"], ans:2, exp:"ตี๋ มีไม้จัตวา ( ๋ ) กำกับ" },
  { subj:1, text:"ข้อใดเป็น “คำเป็น” ทั้งหมด?", opts:["กบ นก จับ","มด รัก บาป","มา ดี งาน","จก ตัด ลบ"], ans:2, exp:"มา ดี (สระยาว) และ งาน (แม่กน) ล้วนเป็นคำเป็น" },
  { subj:1, text:"ข้อใดเป็น “คำตาย” ทั้งหมด?", opts:["มา ดี งาน","ยาว เรียน คน","ปู นา ตา","นก จับ มด"], ans:3, exp:"นก(กก) จับ(กบ) มด(กด) ล้วนเป็นคำตาย" },

  // ===== สังคมศึกษา: หน้าที่พลเมือง (สิทธิและหน้าที่) (15 ข้อ) =====
  { subj:2, text:"“หน้าที่” ของนักเรียนที่ดี คืออะไร?", opts:["หนีเรียน","ตั้งใจเรียนและเชื่อฟังครู","แกล้งเพื่อน","ไม่ทำการบ้าน"], ans:1, exp:"นักเรียนที่ดีมีหน้าที่ตั้งใจเรียนและเชื่อฟังครู" },
  { subj:2, text:"“สิทธิ” ขั้นพื้นฐานของเด็กทุกคน คือข้อใด?", opts:["สิทธิในการทำผิดกฎ","สิทธิในการได้รับการศึกษา","สิทธิในการรังแกผู้อื่น","ไม่มีสิทธิใดๆ"], ans:1, exp:"เด็กทุกคนมีสิทธิได้รับการศึกษา" },
  { subj:2, text:"การเคารพกฎระเบียบของโรงเรียน แสดงถึงสิ่งใด?", opts:["ความเห็นแก่ตัว","ความมีระเบียบวินัย","ความขี้เกียจ","ความก้าวร้าว"], ans:1, exp:"การทำตามกฎแสดงถึงความมีระเบียบวินัย" },
  { subj:2, text:"เมื่ออยู่ในที่สาธารณะ พลเมืองที่ดีควรทำอย่างไร?", opts:["ทิ้งขยะให้ถูกที่ ไม่ส่งเสียงดัง","ทิ้งขยะเรี่ยราด","ทำลายของส่วนรวม","แซงคิว"], ans:0, exp:"ในที่สาธารณะควรมีมารยาท ไม่รบกวนผู้อื่น" },
  { subj:2, text:"การเข้าแถวรอตามลำดับก่อน-หลัง เป็นการแสดงถึงสิ่งใด?", opts:["การเอาเปรียบ","การเคารพสิทธิผู้อื่น (ไม่แซงคิว)","การเห็นแก่ตัว","การละเมิดกฎ"], ans:1, exp:"การเข้าคิวคือการเคารพสิทธิของผู้อื่น" },
  { subj:2, text:"หน้าที่ของพลเมืองไทยที่มีต่อประเทศชาติ คือข้อใด?", opts:["หลบหนีภาษี","ทำผิดกฎหมาย","เสียภาษี เคารพกฎหมาย","ทำลายสาธารณสมบัติ"], ans:2, exp:"พลเมืองดีมีหน้าที่เสียภาษีและเคารพกฎหมาย" },
  { subj:2, text:"ทรัพย์สินส่วนรวม เช่น โต๊ะเก้าอี้ในโรงเรียน เราควรทำอย่างไร?", opts:["ช่วยกันดูแลรักษา","ขีดเขียนทำลาย","เอาไปเป็นของตัวเอง","ไม่สนใจ"], ans:0, exp:"ของส่วนรวมต้องช่วยกันดูแลรักษา" },
  { subj:2, text:"การช่วยกันรักษาความสะอาดของห้องเรียน เป็นหน้าที่ของใคร?", opts:["ภารโรงคนเดียว","นักเรียนทุกคน","ครูคนเดียว","ไม่ใช่หน้าที่ใคร"], ans:1, exp:"ห้องเรียนเป็นของส่วนรวม นักเรียนทุกคนต้องช่วยกัน" },
  { subj:2, text:"เมื่อเห็นเพื่อนถูกรังแก พลเมืองที่ดีควรทำอย่างไร?", opts:["ยืนดูเฉยๆ","ช่วยเหลือหรือแจ้งครู","ร่วมรังแก","หัวเราะเยาะ"], ans:1, exp:"ควรช่วยเหลือเพื่อนหรือแจ้งครู" },
  { subj:2, text:"การปฏิบัติตามกฎจราจร เช่น หยุดเมื่อไฟแดง มีประโยชน์อย่างไร?", opts:["ทำให้รถติด","ปลอดภัยและเป็นระเบียบ","ไม่มีประโยชน์","เสียเวลา"], ans:1, exp:"ทำตามกฎจราจรช่วยให้ปลอดภัยและเป็นระเบียบ" },
  { subj:2, text:"สิทธิและหน้าที่มีความสัมพันธ์กันอย่างไร?", opts:["มีสิทธิแล้วก็ต้องมีหน้าที่ควบคู่กัน","มีแต่สิทธิ ไม่ต้องมีหน้าที่","มีแต่หน้าที่ ไม่มีสิทธิ","ไม่เกี่ยวข้องกัน"], ans:0, exp:"ทุกคนมีสิทธิและต้องมีหน้าที่ควบคู่กันไป" },
  { subj:2, text:"การใช้วาจาสุภาพกับผู้อื่น แสดงถึงสิ่งใด?", opts:["ความอ่อนแอ","มารยาทที่ดีของพลเมือง","ความกลัว","ความเสียเปรียบ"], ans:1, exp:"การพูดจาสุภาพเป็นมารยาทที่ดีของพลเมือง" },
  { subj:2, text:"การไปใช้สิทธิเลือกตั้งเมื่อโตเป็นผู้ใหญ่ เป็นหน้าที่ของใคร?", opts:["เฉพาะคนรวย","เฉพาะข้าราชการ","พลเมืองไทยทุกคนที่มีสิทธิ","ไม่ใช่หน้าที่ใคร"], ans:2, exp:"การเลือกตั้งเป็นหน้าที่ของพลเมืองไทยทุกคนที่มีสิทธิ" },
  { subj:2, text:"การอยู่ร่วมกันในสังคมอย่างสงบสุข ต้องอาศัยสิ่งใด?", opts:["การแย่งชิง","การเคารพกฎกติกาและสิทธิของกันและกัน","การทะเลาะกัน","การเอาเปรียบ"], ans:1, exp:"สังคมสงบสุขได้ด้วยการเคารพกฎและสิทธิของกันและกัน" },
  { subj:2, text:"นักเรียนที่ทำเวรทำความสะอาดตามที่ได้รับมอบหมาย แสดงถึงสิ่งใด?", opts:["ความรับผิดชอบต่อหน้าที่","ความเกียจคร้าน","การเอาเปรียบเพื่อน","การหลีกเลี่ยงงาน"], ans:0, exp:"การทำเวรตามหน้าที่คือความรับผิดชอบ" }
];

const subjNames = { 1:"📖 วิชาภาษาไทย — คำเป็น–คำตาย และการผันวรรณยุกต์", 2:"🗺️ วิชาสังคมศึกษา — หน้าที่พลเมือง (สิทธิและหน้าที่)" };
const selected = {};
let checked = false;

function render() {
  const box = document.getElementById('quiz');
  box.innerHTML = '';
  let lastSubj = null;
  questions.forEach((q, i) => {
    if (q.subj !== lastSubj) {
      const t = document.createElement('div');
      t.className = 'subject-title' + (q.subj===2 ? ' s2' : '');
      t.textContent = subjNames[q.subj];
      box.appendChild(t);
      lastSubj = q.subj;
    }
    const card = document.createElement('div');
    card.className = 'q';
    const numInSubj = questions.slice(0,i+1).filter(x=>x.subj===q.subj).length;
    let html = '<div class="text"><span class="num">'+numInSubj+'</span>'+q.text+'</div>';
    q.opts.forEach((o, oi) => {
      html += '<button class="opt" data-q="'+i+'" data-o="'+oi+'" onclick="pick('+i+','+oi+')">'+o+'</button>';
    });
    html += '<div class="explain" id="exp-'+i+'">💡 เฉลย: '+q.opts[q.ans]+' — '+q.exp+'</div>';
    card.innerHTML = html;
    box.appendChild(card);
  });
}

function pick(qi, oi) {
  if (checked) return;
  selected[qi] = oi;
  document.querySelectorAll('.opt[data-q="'+qi+'"]').forEach(b => b.classList.remove('sel'));
  document.querySelector('.opt[data-q="'+qi+'"][data-o="'+oi+'"]').classList.add('sel');
}

function checkAll() {
  checked = true;
  let score = 0;
  questions.forEach((q, i) => {
    const sel = selected[i];
    document.querySelectorAll('.opt[data-q="'+i+'"]').forEach(b => {
      const oi = +b.dataset.o;
      b.classList.remove('sel');
      if (oi === q.ans) b.classList.add('correct');
      if (oi === sel && sel !== q.ans) b.classList.add('wrong');
    });
    document.getElementById('exp-'+i).classList.add('show');
    if (sel === q.ans) score++;
  });
  showScore(score);
}

function showScore(score) {
  const total = questions.length;
  const pct = score/total;
  let praise, emoji;
  if (pct === 1) { praise = "สุดยอดมากลูก! ทำได้เต็มทุกข้อ!"; emoji="🏆🎉"; }
  else if (pct >= 0.8) { praise = "เก่งมากยูน่า! เกือบเต็มแล้ว!"; emoji="🌟😍"; }
  else if (pct >= 0.6) { praise = "ทำได้ดีมากลูก! พัฒนาขึ้นเรื่อยๆ!"; emoji="😊👍"; }
  else { praise = "เยี่ยมที่ตั้งใจทำจนจบ! ลองทบทวนเฉลยแล้วสู้ต่อนะ!"; emoji="🤗💪"; }
  const sb = document.getElementById('scorebox');
  sb.innerHTML = '<div>ได้คะแนน</div><div class="big-score">'+score+' / '+total+' '+emoji+'</div><div class="praise">'+praise+'</div>';
  sb.classList.add('show');
  sb.scrollIntoView({behavior:'smooth'});
}

function resetAll() {
  checked = false;
  for (const k in selected) delete selected[k];
  document.getElementById('scorebox').classList.remove('show');
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

render();
</script>
</body>
</html>
