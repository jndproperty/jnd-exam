<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ข้อสอบฝึกยูน่า ป.4 - 28 ก.ค. 2026 (ชุด C ใหม่)</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Tahoma', 'Sarabun', sans-serif;
    margin: 0; padding: 0;
    background: linear-gradient(160deg, #e3f2fd 0%, #e8f5e9 100%);
    color: #263238;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
  header {
    text-align: center; background: #5c6bc0; color: #fff;
    border-radius: 20px; padding: 22px 16px; margin-bottom: 16px;
    box-shadow: 0 5px 0 #3f51b5;
  }
  header h1 { margin: 0 0 6px; font-size: 26px; }
  header .meta { font-size: 16px; opacity: .95; }
  .subject-title {
    font-size: 20px; font-weight: bold; color: #fff;
    background: #7e57c2; border-radius: 14px;
    padding: 11px 18px; margin: 22px 0 12px;
    box-shadow: 0 4px 0 #5e35b1;
  }
  .subject-title.s2 { background: #00897b; box-shadow: 0 4px 0 #00695c; }
  .q {
    background: #fff; border-radius: 16px; padding: 16px 18px;
    margin-bottom: 14px; box-shadow: 0 3px 8px rgba(0,0,0,.07);
  }
  .q .num {
    display: inline-block; background: #ffb74d; color: #4e342e;
    font-weight: bold; border-radius: 50%; width: 30px; height: 30px;
    line-height: 30px; text-align: center; font-size: 16px; margin-right: 8px;
  }
  .q .text { font-size: 19px; font-weight: bold; margin: 4px 0 12px; }
  .opt {
    display: block; width: 100%; text-align: left;
    font-size: 18px; font-family: inherit;
    background: #f5f5f5; border: 2px solid #e0e0e0;
    border-radius: 12px; padding: 11px 16px; margin-bottom: 8px;
    cursor: pointer; transition: .12s;
  }
  .opt:active { transform: scale(.99); }
  .opt.sel { background: #bbdefb; border-color: #2196f3; }
  .opt.correct { background: #c8e6c9; border-color: #43a047; }
  .opt.wrong { background: #ffcdd2; border-color: #e53935; }
  .explain {
    display: none; font-size: 16px; background: #fff8e1;
    border-left: 5px solid #ffb300; border-radius: 8px;
    padding: 9px 13px; margin-top: 9px; color: #6d4c00;
  }
  .explain.show { display: block; }
  .btnbar { text-align: center; margin: 24px 0; }
  button.big {
    font-family: inherit; font-size: 20px; font-weight: bold;
    color: #fff; border: none; border-radius: 16px;
    padding: 14px 26px; margin: 8px; cursor: pointer;
  }
  #checkBtn { background: #43a047; box-shadow: 0 5px 0 #2e7d32; }
  #resetBtn { background: #78909c; box-shadow: 0 5px 0 #546e7a; }
  button.big:active { transform: translateY(3px); box-shadow: none; }
  #scorebox {
    display: none; text-align: center; font-size: 22px; font-weight: bold;
    background: #fff; border-radius: 20px; padding: 22px;
    margin: 18px 0; box-shadow: 0 5px 12px rgba(0,0,0,.12);
  }
  #scorebox.show { display: block; }
  #scorebox .big-score { font-size: 40px; color: #f57c00; }
  #scorebox .praise { font-size: 20px; margin-top: 8px; }
  footer { text-align: center; color: #999; font-size: 13px; padding: 20px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>✨ ข้อสอบฝึกของยูน่า ✨</h1>
    <div class="meta">ชั้น ป.4 &nbsp;•&nbsp; วันที่ 28 ก.ค. 2026 &nbsp;•&nbsp; ชุด C ใหม่ 🎉</div>
    <div class="meta">วิชา: ภาษาอังกฤษ 🔤 + ศิลปะ 🎨</div>
  </header>

  <div id="quiz"></div>

  <div class="btnbar">
    <button class="big" id="checkBtn" onclick="checkAll()">✅ ตรวจคำตอบ</button>
    <button class="big" id="resetBtn" onclick="resetAll()">🔄 ทำใหม่</button>
  </div>

  <div id="scorebox"></div>

  <footer>JND • ฝึกทำทุกวัน เก่งขึ้นทุกวัน 💪</footer>
</div>

<script>
const questions = [
  // ===== ภาษาอังกฤษ: Present Continuous (is/are/am + V-ing) (15 ข้อ) =====
  { subj:1, text:"เติมคำให้ถูกต้อง: “She ___ reading a book now.”", opts:["is","are","am","be"], ans:0, exp:"ประธาน She ใช้ is → She is reading." },
  { subj:1, text:"เติมคำให้ถูกต้อง: “They ___ playing football.”", opts:["is","am","are","was"], ans:2, exp:"ประธาน They ใช้ are → They are playing." },
  { subj:1, text:"เติมคำให้ถูกต้อง: “I ___ watching TV.”", opts:["is","am","are","be"], ans:1, exp:"ประธาน I ใช้ am → I am watching." },
  { subj:1, text:"รูป V-ing ของ “run” คือข้อใด?", opts:["runing","running","runned","runs"], ans:1, exp:"run เป็นเสียงสั้น ต้องซ้ำ n → running" },
  { subj:1, text:"เติมคำให้ถูกต้อง: “He is ___ (swim) in the pool.”", opts:["swiming","swimming","swims","swam"], ans:1, exp:"swim ซ้ำ m ก่อนเติม -ing → swimming" },
  { subj:1, text:"Present Continuous ใช้โครงสร้างแบบใด?", opts:["Verb ช่องเดียวเฉยๆ","is/am/are + V-ing","Verb ช่อง 2","will + Verb"], ans:1, exp:"โครงสร้างคือ is/am/are + กริยาเติม -ing" },
  { subj:1, text:"เติมคำให้ถูกต้อง: “We ___ studying English.”", opts:["is","am","are","was"], ans:2, exp:"ประธาน We ใช้ are → We are studying." },
  { subj:1, text:"รูป V-ing ของ “make” คือข้อใด?", opts:["makeing","making","maked","makes"], ans:1, exp:"make ลงท้ายด้วย e ตัด e แล้วเติม -ing → making" },
  { subj:1, text:"เติมคำให้ถูกต้อง: “The baby ___ sleeping.”", opts:["are","is","am","were"], ans:1, exp:"ประธานเอกพจน์ (baby) ใช้ is → is sleeping." },
  { subj:1, text:"ประโยคใดเป็น Present Continuous ที่ถูกต้อง?", opts:["I am eat rice.","I am eating rice.","I eating rice.","I eats rice."], ans:1, exp:"ต้องเป็น am + V-ing → I am eating rice." },
  { subj:1, text:"เติมคำให้ถูกต้อง: “Look! It ___ raining.”", opts:["is","are","am","be"], ans:0, exp:"ประธาน It ใช้ is → It is raining." },
  { subj:1, text:"คำว่า “cooking” มาจากกริยาใด?", opts:["cook","cool","book","cut"], ans:0, exp:"cooking มาจาก cook + -ing" },
  { subj:1, text:"เติมคำให้ถูกต้อง: “You ___ writing a letter.”", opts:["is","am","are","was"], ans:2, exp:"ประธาน You ใช้ are → You are writing." },
  { subj:1, text:"รูป V-ing ของ “play” คือข้อใด?", opts:["plaing","playing","plays","played"], ans:1, exp:"play เติม -ing ได้เลย → playing" },
  { subj:1, text:"Present Continuous บอกการกระทำที่เกิดขึ้นเมื่อใด?", opts:["กำลังทำอยู่ตอนนี้","เมื่อวานนี้","ปีหน้า","ไม่เคยทำ"], ans:0, exp:"ใช้บอกสิ่งที่กำลังทำอยู่ในขณะนี้" },

  // ===== ศิลปะ: หลักการจัดองค์ประกอบศิลป์ (สมดุล/เอกภาพ/จุดเด่น) (15 ข้อ) =====
  { subj:2, text:"การจัดวางให้ภาพซ้าย-ขวาดูเท่ากัน ไม่หนักไปข้างใดข้างหนึ่ง เรียกว่าอะไร?", opts:["ความขัดแย้ง","ความสมดุล (Balance)","ความว่างเปล่า","ความยุ่งเหยิง"], ans:1, exp:"การถ่วงน้ำหนักภาพให้เท่ากัน คือ ความสมดุล" },
  { subj:2, text:"จุดที่ดึงดูดสายตาให้มองเป็นอันดับแรกในภาพ เรียกว่าอะไร?", opts:["จุดเด่น (Point of Emphasis)","พื้นหลัง","กรอบภาพ","เส้นขอบ"], ans:0, exp:"ส่วนที่เด่นสะดุดตาที่สุด คือ จุดเด่น" },
  { subj:2, text:"การที่ทุกส่วนในภาพกลมกลืนเป็นอันหนึ่งอันเดียวกัน เรียกว่าอะไร?", opts:["ความแตกแยก","เอกภาพ (Unity)","ความว่าง","ความซ้ำซาก"], ans:1, exp:"ความกลมกลืนเป็นหนึ่งเดียว คือ เอกภาพ" },
  { subj:2, text:"ความสมดุลที่ซ้ายและขวาเหมือนกันเหมือนภาพในกระจกเงา เรียกว่าสมดุลแบบใด?", opts:["สมดุลแบบสองข้างไม่เท่ากัน","สมดุลแบบสองข้างเท่ากัน (Symmetry)","ไม่มีสมดุล","ความขัดแย้ง"], ans:1, exp:"สองข้างเหมือนกัน คือ สมดุลแบบสมมาตร (Symmetry)" },
  { subj:2, text:"การใช้สีหรือขนาดที่ต่างออกไปเพื่อเน้นบางส่วนให้โดดเด่น เป็นการสร้างสิ่งใด?", opts:["จุดเด่น","ความสมดุล","พื้นผิว","เส้น"], ans:0, exp:"การเน้นให้บางส่วนสะดุดตา คือการสร้างจุดเด่น" },
  { subj:2, text:"ในภาพวาด “พื้นที่ว่าง” (space) มีความสำคัญอย่างไร?", opts:["ทำให้ภาพเสีย","ช่วยให้ภาพดูโปร่ง ไม่อึดอัด","ไม่มีความสำคัญ","ทำให้ภาพแคบ"], ans:1, exp:"พื้นที่ว่างช่วยให้ภาพดูโปร่ง สบายตา" },
  { subj:2, text:"การจัดองค์ประกอบภาพที่ดี ควรมีลักษณะอย่างไร?", opts:["รกและสับสน","มีจุดเด่น สมดุล และกลมกลืน","ว่างเปล่าทั้งหมด","ไม่มีจุดสนใจ"], ans:1, exp:"ภาพที่ดีควรมีจุดเด่น สมดุล และกลมกลืน (เอกภาพ)" },
  { subj:2, text:"สมดุลที่สองข้างไม่เท่ากันแต่ยังดูสมดุล เรียกว่าอะไร?", opts:["สมดุลแบบสมมาตร","สมดุลแบบอสมมาตร (Asymmetry)","ความขัดแย้ง","เอกภาพ"], ans:1, exp:"สองข้างต่างกันแต่ยังสมดุล คือ สมดุลแบบอสมมาตร" },
  { subj:2, text:"การวางวัตถุหลักไว้ในตำแหน่งที่น่าสนใจของภาพ ช่วยสร้างสิ่งใด?", opts:["จุดเด่นของภาพ","ความว่างเปล่า","ความสับสน","พื้นหลัง"], ans:0, exp:"ช่วยสร้างจุดเด่นให้ภาพน่าสนใจ" },
  { subj:2, text:"องค์ประกอบใดช่วยให้ผู้ชม “รู้ว่าควรมองตรงไหนก่อน”?", opts:["พื้นหลัง","จุดเด่น","กรอบ","ความว่าง"], ans:1, exp:"จุดเด่นนำสายตาผู้ชมว่าควรมองตรงไหนก่อน" },
  { subj:2, text:"ถ้าภาพมีของกระจายเต็มไปหมด ไม่มีจุดพักสายตา จะขาดหลักการใด?", opts:["พื้นที่ว่างและจุดเด่น","สีสัน","เส้น","กรอบ"], ans:0, exp:"ภาพรกเกินไปเพราะขาดพื้นที่ว่างและจุดเด่น" },
  { subj:2, text:"“เอกภาพ” ในงานศิลปะหมายถึงอะไร?", opts:["ความแตกต่างสุดขั้ว","ความเป็นอันหนึ่งอันเดียวกันของภาพ","ความว่างเปล่า","จำนวนสีที่ใช้"], ans:1, exp:"เอกภาพคือความกลมกลืนเป็นหนึ่งเดียวของภาพ" },
  { subj:2, text:"การใช้สีโทนเดียวกันทั้งภาพ ช่วยสร้างสิ่งใด?", opts:["เอกภาพและความกลมกลืน","ความขัดแย้ง","ความสับสน","จุดเด่นหลายจุด"], ans:0, exp:"สีโทนเดียวกันช่วยให้ภาพกลมกลืนเป็นเอกภาพ" },
  { subj:2, text:"การวางเส้นขอบฟ้าในภาพทิวทัศน์ให้เหมาะสม เกี่ยวข้องกับหลักการใด?", opts:["การผสมสี","การจัดองค์ประกอบและความสมดุล","การปั้น","การพับกระดาษ"], ans:1, exp:"ตำแหน่งเส้นขอบฟ้าเกี่ยวกับการจัดองค์ประกอบและสมดุลของภาพ" },
  { subj:2, text:"จุดเด่นในภาพ ควรมีลักษณะอย่างไรจึงทำให้ภาพน่าสนใจที่สุด?", opts:["จุดเด่นหลักเพียงจุดเดียว","หลายจุดเท่าๆ กันจนแย่งความสนใจ","ไม่มีจุดเด่นเลย","เต็มไปหมดทั้งภาพ"], ans:0, exp:"ควรมีจุดเด่นหลักจุดเดียว เพื่อไม่ให้แย่งสายตากัน" }
];

const subjNames = { 1:"🔤 วิชาภาษาอังกฤษ — Present Continuous (is/am/are + V-ing)", 2:"🎨 วิชาศิลปะ — องค์ประกอบศิลป์ (สมดุล/เอกภาพ/จุดเด่น)" };
const selected = {};
let checked = false;

function render() {
  const box = document.getElementById('quiz');
  box.innerHTML = '';
  let lastSubj = null;
  questions.forEach((q, i) => {
    if (q.subj !== lastSubj) {
      const t = document.createElement('div');
      t.className = 'subject-title' + (q.subj===2 ? ' s2' : '');
      t.textContent = subjNames[q.subj];
      box.appendChild(t);
      lastSubj = q.subj;
    }
    const card = document.createElement('div');
    card.className = 'q';
    const numInSubj = questions.slice(0,i+1).filter(x=>x.subj===q.subj).length;
    let html = '<div class="text"><span class="num">'+numInSubj+'</span>'+q.text+'</div>';
    q.opts.forEach((o, oi) => {
      html += '<button class="opt" data-q="'+i+'" data-o="'+oi+'" onclick="pick('+i+','+oi+')">'+o+'</button>';
    });
    html += '<div class="explain" id="exp-'+i+'">💡 เฉลย: '+q.opts[q.ans]+' — '+q.exp+'</div>';
    card.innerHTML = html;
    box.appendChild(card);
  });
}

function pick(qi, oi) {
  if (checked) return;
  selected[qi] = oi;
  document.querySelectorAll('.opt[data-q="'+qi+'"]').forEach(b => b.classList.remove('sel'));
  document.querySelector('.opt[data-q="'+qi+'"][data-o="'+oi+'"]').classList.add('sel');
}

function checkAll() {
  checked = true;
  let score = 0;
  questions.forEach((q, i) => {
    const sel = selected[i];
    document.querySelectorAll('.opt[data-q="'+i+'"]').forEach(b => {
      const oi = +b.dataset.o;
      b.classList.remove('sel');
      if (oi === q.ans) b.classList.add('correct');
      if (oi === sel && sel !== q.ans) b.classList.add('wrong');
    });
    document.getElementById('exp-'+i).classList.add('show');
    if (sel === q.ans) score++;
  });
  showScore(score);
}

function showScore(score) {
  const total = questions.length;
  const pct = score/total;
  let praise, emoji;
  if (pct === 1) { praise = "สุดยอดมากลูก! ทำได้เต็มทุกข้อ!"; emoji="🏆🎉"; }
  else if (pct >= 0.8) { praise = "เก่งมากยูน่า! เกือบเต็มแล้ว!"; emoji="🌟😍"; }
  else if (pct >= 0.6) { praise = "ทำได้ดีมากลูก! พัฒนาขึ้นเรื่อยๆ!"; emoji="😊👍"; }
  else { praise = "เยี่ยมที่ตั้งใจทำจนจบ! ลองทบทวนเฉลยแล้วสู้ต่อนะ!"; emoji="🤗💪"; }
  const sb = document.getElementById('scorebox');
  sb.innerHTML = '<div>ได้คะแนน</div><div class="big-score">'+score+' / '+total+' '+emoji+'</div><div class="praise">'+praise+'</div>';
  sb.classList.add('show');
  sb.scrollIntoView({behavior:'smooth'});
}

function resetAll() {
  checked = false;
  for (const k in selected) delete selected[k];
  document.getElementById('scorebox').classList.remove('show');
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

render();
</script>
</body>
</html>
