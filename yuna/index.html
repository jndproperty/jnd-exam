<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ข้อสอบฝึกยูน่า ป.4 - 27 ก.ค. 2026 (ชุดที่ 2)</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Tahoma', 'Sarabun', sans-serif;
    margin: 0; padding: 0;
    background: linear-gradient(160deg, #e3f2fd 0%, #e8f5e9 100%);
    color: #263238;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
  header {
    text-align: center; background: #5c6bc0; color: #fff;
    border-radius: 20px; padding: 22px 16px; margin-bottom: 16px;
    box-shadow: 0 5px 0 #3f51b5;
  }
  header h1 { margin: 0 0 6px; font-size: 26px; }
  header .meta { font-size: 16px; opacity: .95; }
  .subject-title {
    font-size: 20px; font-weight: bold; color: #fff;
    background: #7e57c2; border-radius: 14px;
    padding: 11px 18px; margin: 22px 0 12px;
    box-shadow: 0 4px 0 #5e35b1;
  }
  .subject-title.s2 { background: #00897b; box-shadow: 0 4px 0 #00695c; }
  .q {
    background: #fff; border-radius: 16px; padding: 16px 18px;
    margin-bottom: 14px; box-shadow: 0 3px 8px rgba(0,0,0,.07);
  }
  .q .num {
    display: inline-block; background: #ffb74d; color: #4e342e;
    font-weight: bold; border-radius: 50%; width: 30px; height: 30px;
    line-height: 30px; text-align: center; font-size: 16px; margin-right: 8px;
  }
  .q .text { font-size: 19px; font-weight: bold; margin: 4px 0 12px; }
  .opt {
    display: block; width: 100%; text-align: left;
    font-size: 18px; font-family: inherit;
    background: #f5f5f5; border: 2px solid #e0e0e0;
    border-radius: 12px; padding: 11px 16px; margin-bottom: 8px;
    cursor: pointer; transition: .12s;
  }
  .opt:active { transform: scale(.99); }
  .opt.sel { background: #bbdefb; border-color: #2196f3; }
  .opt.correct { background: #c8e6c9; border-color: #43a047; }
  .opt.wrong { background: #ffcdd2; border-color: #e53935; }
  .explain {
    display: none; font-size: 16px; background: #fff8e1;
    border-left: 5px solid #ffb300; border-radius: 8px;
    padding: 9px 13px; margin-top: 9px; color: #6d4c00;
  }
  .explain.show { display: block; }
  .btnbar { text-align: center; margin: 24px 0; }
  button.big {
    font-family: inherit; font-size: 20px; font-weight: bold;
    color: #fff; border: none; border-radius: 16px;
    padding: 14px 26px; margin: 8px; cursor: pointer;
  }
  #checkBtn { background: #43a047; box-shadow: 0 5px 0 #2e7d32; }
  #resetBtn { background: #78909c; box-shadow: 0 5px 0 #546e7a; }
  button.big:active { transform: translateY(3px); box-shadow: none; }
  #scorebox {
    display: none; text-align: center; font-size: 22px; font-weight: bold;
    background: #fff; border-radius: 20px; padding: 22px;
    margin: 18px 0; box-shadow: 0 5px 12px rgba(0,0,0,.12);
  }
  #scorebox.show { display: block; }
  #scorebox .big-score { font-size: 40px; color: #f57c00; }
  #scorebox .praise { font-size: 20px; margin-top: 8px; }
  footer { text-align: center; color: #999; font-size: 13px; padding: 20px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>✨ ข้อสอบฝึกของยูน่า ✨</h1>
    <div class="meta">ชั้น ป.4 &nbsp;•&nbsp; วันที่ 27 ก.ค. 2026 &nbsp;•&nbsp; ชุดที่ 2 🎉</div>
    <div class="meta">วิชา: ภาษาไทย 📖 + สังคมศึกษา 🗺️</div>
  </header>

  <div id="quiz"></div>

  <div class="btnbar">
    <button class="big" id="checkBtn" onclick="checkAll()">✅ ตรวจคำตอบ</button>
    <button class="big" id="resetBtn" onclick="resetAll()">🔄 ทำใหม่</button>
  </div>

  <div id="scorebox"></div>

  <footer>JND • ฝึกทำทุกวัน เก่งขึ้นทุกวัน 💪</footer>
</div>

<script>
const questions = [
  // ===== ภาษาไทย: ชนิดของคำ (ชุด 2, 15 ข้อ) =====
  { subj:1, text:"คำว่า “ครู” เป็นคำชนิดใด?", opts:["คำกริยา","คำนาม","คำสรรพนาม","คำวิเศษณ์"], ans:1, exp:"ครูเป็นชื่อเรียกคน จึงเป็นคำนาม" },
  { subj:1, text:"คำว่า “กระโดด” เป็นคำชนิดใด?", opts:["คำนาม","คำสรรพนาม","คำกริยา","คำบุพบท"], ans:2, exp:"กระโดดเป็นการกระทำ จึงเป็นคำกริยา" },
  { subj:1, text:"คำว่า “เธอ” เป็นคำชนิดใด?", opts:["คำนาม","คำกริยา","คำสรรพนาม","คำวิเศษณ์"], ans:2, exp:"เธอใช้แทนผู้ฟัง จึงเป็นคำสรรพนาม" },
  { subj:1, text:"คำว่า “ดินสอ” เป็นคำชนิดใด?", opts:["คำนาม","คำกริยา","คำสรรพนาม","คำบุพบท"], ans:0, exp:"ดินสอเป็นชื่อสิ่งของ จึงเป็นคำนาม" },
  { subj:1, text:"คำว่า “ร้องเพลง” เป็นคำชนิดใด?", opts:["คำนาม","คำกริยา","คำสรรพนาม","คำวิเศษณ์"], ans:1, exp:"ร้องเพลงเป็นการกระทำ จึงเป็นคำกริยา" },
  { subj:1, text:"คำว่า “พวกเรา” เป็นคำชนิดใด?", opts:["คำนาม","คำกริยา","คำสรรพนาม","คำบุพบท"], ans:2, exp:"พวกเราใช้แทนกลุ่มผู้พูด จึงเป็นคำสรรพนาม" },
  { subj:1, text:"ประโยค “แม่ทำอาหาร” คำว่า “ทำ” เป็นคำชนิดใด?", opts:["คำนาม","คำสรรพนาม","คำกริยา","คำวิเศษณ์"], ans:2, exp:"ทำเป็นการกระทำ จึงเป็นคำกริยา" },
  { subj:1, text:"ประโยค “สุนัขวิ่งเร็ว” คำใดเป็น “คำนาม”?", opts:["สุนัข","วิ่ง","เร็ว","อยู่"], ans:0, exp:"สุนัขเป็นชื่อสัตว์ จึงเป็นคำนาม (วิ่ง=กริยา, เร็ว=วิเศษณ์)" },
  { subj:1, text:"คำใดต่อไปนี้เป็น “คำนาม”?", opts:["เดิน","โต๊ะ","สวย","เขา"], ans:1, exp:"โต๊ะเป็นชื่อสิ่งของ จึงเป็นคำนาม" },
  { subj:1, text:"คำใดต่อไปนี้เป็น “คำกริยา”?", opts:["หนังสือ","ดื่ม","สูง","ฉัน"], ans:1, exp:"ดื่มเป็นการกระทำ จึงเป็นคำกริยา" },
  { subj:1, text:"คำใดต่อไปนี้เป็น “คำสรรพนาม”?", opts:["ปลา","มัน","เขียน","ใหญ่"], ans:1, exp:"มันใช้แทนสัตว์/สิ่งของ จึงเป็นคำสรรพนาม" },
  { subj:1, text:"คำสรรพนาม “ผม” ใช้แทนใคร?", opts:["ตัวผู้พูดที่เป็นผู้ชาย","ผู้ฟัง","คนที่กล่าวถึง","สัตว์เลี้ยง"], ans:0, exp:"ผม เป็นสรรพนามแทนตัวผู้พูดที่เป็นผู้ชาย" },
  { subj:1, text:"ประโยค “น้องกินข้าว” มีคำนามกี่คำ?", opts:["1 คำ","2 คำ","3 คำ","ไม่มีเลย"], ans:1, exp:"คำนาม 2 คำ คือ น้อง และ ข้าว (กิน = คำกริยา)" },
  { subj:1, text:"คำว่า “โรงเรียน” กับ “ครู” เป็นคำชนิดเดียวกันคือชนิดใด?", opts:["คำกริยา","คำนาม","คำสรรพนาม","คำวิเศษณ์"], ans:1, exp:"ทั้งสองเป็นชื่อสถานที่/คน จึงเป็นคำนามเหมือนกัน" },
  { subj:1, text:"ประโยค “แมวนอนหลับ” คำที่บอกการกระทำคือคำใด?", opts:["แมว","นอน","หลับสบาย","ตรงนั้น"], ans:1, exp:"นอนคือการกระทำของแมว จึงเป็นคำกริยา" },

  // ===== สังคมศึกษา: ภูมิศาสตร์ท้องถิ่น/แผนที่ (ชุด 2, 15 ข้อ) =====
  { subj:2, text:"ดวงอาทิตย์ตกทางทิศใด?", opts:["ทิศเหนือ","ทิศใต้","ทิศตะวันออก","ทิศตะวันตก"], ans:3, exp:"ดวงอาทิตย์ตกทางทิศตะวันตก" },
  { subj:2, text:"ทิศที่อยู่ตรงข้ามกับทิศใต้คือทิศใด?", opts:["ทิศเหนือ","ทิศตะวันออก","ทิศตะวันตก","ทิศใต้"], ans:0, exp:"ทิศเหนืออยู่ตรงข้ามกับทิศใต้" },
  { subj:2, text:"หน่วยการปกครองที่เล็กกว่า “อำเภอ” คือหน่วยใด?", opts:["จังหวัด","ตำบล","ภาค","ประเทศ"], ans:1, exp:"อำเภอแบ่งเป็นตำบล ตำบลแบ่งเป็นหมู่บ้าน" },
  { subj:2, text:"ผู้ที่เป็นหัวหน้าปกครองระดับอำเภอคือใคร?", opts:["ผู้ว่าราชการจังหวัด","นายอำเภอ","กำนัน","ผู้ใหญ่บ้าน"], ans:1, exp:"นายอำเภอเป็นหัวหน้าปกครองระดับอำเภอ" },
  { subj:2, text:"หัวหน้าปกครองระดับหมู่บ้านคือใคร?", opts:["กำนัน","ผู้ใหญ่บ้าน","นายอำเภอ","ผู้ว่าฯ"], ans:1, exp:"ผู้ใหญ่บ้านเป็นหัวหน้าหมู่บ้าน ส่วนกำนันเป็นหัวหน้าตำบล" },
  { subj:2, text:"ในแผนที่ทั่วไป สีเขียวมักใช้แทนพื้นที่แบบใด?", opts:["ที่ราบ พื้นที่ต่ำ","ทะเล","ทะเลทราย","ภูเขาสูง"], ans:0, exp:"สีเขียวในแผนที่มักแทนที่ราบหรือพื้นที่ต่ำ" },
  { subj:2, text:"ในแผนที่ทั่วไป สีน้ำตาลมักใช้แทนพื้นที่แบบใด?", opts:["แหล่งน้ำ","ที่ราบ","ภูเขา ที่สูง","ป่าไม้"], ans:2, exp:"สีน้ำตาลในแผนที่มักแทนภูเขาหรือที่สูง" },
  { subj:2, text:"ภาคเหนือของประเทศไทยมีลักษณะภูมิประเทศส่วนใหญ่เป็นแบบใด?", opts:["ทะเล","ภูเขาสูง","ทะเลทราย","ที่ราบลุ่มแม่น้ำ"], ans:1, exp:"ภาคเหนือมีภูเขาสูงและป่าไม้เป็นส่วนใหญ่" },
  { subj:2, text:"ภาคใดของไทยที่มีชายฝั่งทะเลและหาดทรายมากที่สุด?", opts:["ภาคเหนือ","ภาคกลาง","ภาคใต้","ภาคตะวันออกเฉียงเหนือ"], ans:2, exp:"ภาคใต้มีชายฝั่งทะเลทั้งสองด้าน (อ่าวไทยและอันดามัน)" },
  { subj:2, text:"ทิศที่อยู่ระหว่างทิศใต้กับทิศตะวันตก เรียกว่าทิศใด?", opts:["ตะวันออกเฉียงใต้","ตะวันตกเฉียงใต้","ตะวันออกเฉียงเหนือ","ตะวันตกเฉียงเหนือ"], ans:1, exp:"ระหว่างใต้กับตะวันตก คือทิศตะวันตกเฉียงใต้" },
  { subj:2, text:"ทิศที่อยู่ระหว่างทิศเหนือกับทิศตะวันตก เรียกว่าทิศใด?", opts:["ตะวันตกเฉียงเหนือ","ตะวันออกเฉียงเหนือ","ตะวันตกเฉียงใต้","ตะวันออกเฉียงใต้"], ans:0, exp:"ระหว่างเหนือกับตะวันตก คือทิศตะวันตกเฉียงเหนือ" },
  { subj:2, text:"สิ่งที่บอกว่าระยะในแผนที่เทียบกับระยะจริงเท่าไร เรียกว่าอะไร?", opts:["สัญลักษณ์","มาตราส่วน","ทิศ","เส้นรุ้ง"], ans:1, exp:"มาตราส่วนบอกอัตราส่วนระยะในแผนที่ต่อระยะจริง" },
  { subj:2, text:"จังหวัดที่อยู่เหนือสุดของประเทศไทยคือจังหวัดใด?", opts:["เชียงใหม่","เชียงราย","ลำปาง","น่าน"], ans:1, exp:"เชียงรายเป็นจังหวัดเหนือสุดของไทย (อ.แม่สาย)" },
  { subj:2, text:"ภาคตะวันออกเฉียงเหนือของไทย เรียกอีกชื่อว่าภาคอะไร?", opts:["ภาคอีสาน","ภาคเหนือ","ภาคกลาง","ภาคใต้"], ans:0, exp:"ภาคตะวันออกเฉียงเหนือ เรียกอีกชื่อว่า ภาคอีสาน" },
  { subj:2, text:"แผนที่ทั่วไป มักกำหนดให้ทิศเหนืออยู่ด้านใดของแผนที่?", opts:["ด้านบน","ด้านล่าง","ด้านซ้าย","ด้านขวา"], ans:0, exp:"แผนที่ทั่วไปกำหนดทิศเหนือไว้ด้านบนของแผนที่" }
];

const subjNames = { 1:"📖 วิชาภาษาไทย — ชนิดของคำ (นาม / สรรพนาม / กริยา)", 2:"🗺️ วิชาสังคมศึกษา — ภูมิศาสตร์ท้องถิ่นและแผนที่" };
const selected = {};
let checked = false;

function render() {
  const box = document.getElementById('quiz');
  box.innerHTML = '';
  let lastSubj = null;
  questions.forEach((q, i) => {
    if (q.subj !== lastSubj) {
      const t = document.createElement('div');
      t.className = 'subject-title' + (q.subj===2 ? ' s2' : '');
      t.textContent = subjNames[q.subj];
      box.appendChild(t);
      lastSubj = q.subj;
    }
    const card = document.createElement('div');
    card.className = 'q';
    const numInSubj = questions.slice(0,i+1).filter(x=>x.subj===q.subj).length;
    let html = '<div class="text"><span class="num">'+numInSubj+'</span>'+q.text+'</div>';
    q.opts.forEach((o, oi) => {
      html += '<button class="opt" data-q="'+i+'" data-o="'+oi+'" onclick="pick('+i+','+oi+')">'+o+'</button>';
    });
    html += '<div class="explain" id="exp-'+i+'">💡 เฉลย: '+q.opts[q.ans]+' — '+q.exp+'</div>';
    card.innerHTML = html;
    box.appendChild(card);
  });
}

function pick(qi, oi) {
  if (checked) return;
  selected[qi] = oi;
  document.querySelectorAll('.opt[data-q="'+qi+'"]').forEach(b => b.classList.remove('sel'));
  document.querySelector('.opt[data-q="'+qi+'"][data-o="'+oi+'"]').classList.add('sel');
}

function checkAll() {
  checked = true;
  let score = 0;
  questions.forEach((q, i) => {
    const sel = selected[i];
    document.querySelectorAll('.opt[data-q="'+i+'"]').forEach(b => {
      const oi = +b.dataset.o;
      b.classList.remove('sel');
      if (oi === q.ans) b.classList.add('correct');
      if (oi === sel && sel !== q.ans) b.classList.add('wrong');
    });
    document.getElementById('exp-'+i).classList.add('show');
    if (sel === q.ans) score++;
  });
  showScore(score);
}

function showScore(score) {
  const total = questions.length;
  const pct = score/total;
  let praise, emoji;
  if (pct === 1) { praise = "สุดยอดมากลูก! ทำได้เต็มทุกข้อ!"; emoji="🏆🎉"; }
  else if (pct >= 0.8) { praise = "เก่งมากยูน่า! เกือบเต็มแล้ว!"; emoji="🌟😍"; }
  else if (pct >= 0.6) { praise = "ทำได้ดีมากลูก! พัฒนาขึ้นเรื่อยๆ!"; emoji="😊👍"; }
  else { praise = "เยี่ยมที่ตั้งใจทำจนจบ! ลองทบทวนเฉลยแล้วสู้ต่อนะ!"; emoji="🤗💪"; }
  const sb = document.getElementById('scorebox');
  sb.innerHTML = '<div>ได้คะแนน</div><div class="big-score">'+score+' / '+total+' '+emoji+'</div><div class="praise">'+praise+'</div>';
  sb.classList.add('show');
  sb.scrollIntoView({behavior:'smooth'});
}

function resetAll() {
  checked = false;
  for (const k in selected) delete selected[k];
  document.getElementById('scorebox').classList.remove('show');
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

render();
</script>
</body>
</html>
