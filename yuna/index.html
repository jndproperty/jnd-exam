<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ข้อสอบฝึกยูน่า ป.4 - 28 ก.ค. 2026 (ชุด A)</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Tahoma', 'Sarabun', sans-serif;
    margin: 0; padding: 0;
    background: linear-gradient(160deg, #e3f2fd 0%, #e8f5e9 100%);
    color: #263238;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
  header {
    text-align: center; background: #5c6bc0; color: #fff;
    border-radius: 20px; padding: 22px 16px; margin-bottom: 16px;
    box-shadow: 0 5px 0 #3f51b5;
  }
  header h1 { margin: 0 0 6px; font-size: 26px; }
  header .meta { font-size: 16px; opacity: .95; }
  .subject-title {
    font-size: 20px; font-weight: bold; color: #fff;
    background: #7e57c2; border-radius: 14px;
    padding: 11px 18px; margin: 22px 0 12px;
    box-shadow: 0 4px 0 #5e35b1;
  }
  .subject-title.s2 { background: #00897b; box-shadow: 0 4px 0 #00695c; }
  .q {
    background: #fff; border-radius: 16px; padding: 16px 18px;
    margin-bottom: 14px; box-shadow: 0 3px 8px rgba(0,0,0,.07);
  }
  .q .num {
    display: inline-block; background: #ffb74d; color: #4e342e;
    font-weight: bold; border-radius: 50%; width: 30px; height: 30px;
    line-height: 30px; text-align: center; font-size: 16px; margin-right: 8px;
  }
  .q .text { font-size: 19px; font-weight: bold; margin: 4px 0 12px; }
  .opt {
    display: block; width: 100%; text-align: left;
    font-size: 18px; font-family: inherit;
    background: #f5f5f5; border: 2px solid #e0e0e0;
    border-radius: 12px; padding: 11px 16px; margin-bottom: 8px;
    cursor: pointer; transition: .12s;
  }
  .opt:active { transform: scale(.99); }
  .opt.sel { background: #bbdefb; border-color: #2196f3; }
  .opt.correct { background: #c8e6c9; border-color: #43a047; }
  .opt.wrong { background: #ffcdd2; border-color: #e53935; }
  .explain {
    display: none; font-size: 16px; background: #fff8e1;
    border-left: 5px solid #ffb300; border-radius: 8px;
    padding: 9px 13px; margin-top: 9px; color: #6d4c00;
  }
  .explain.show { display: block; }
  .btnbar { text-align: center; margin: 24px 0; }
  button.big {
    font-family: inherit; font-size: 20px; font-weight: bold;
    color: #fff; border: none; border-radius: 16px;
    padding: 14px 26px; margin: 8px; cursor: pointer;
  }
  #checkBtn { background: #43a047; box-shadow: 0 5px 0 #2e7d32; }
  #resetBtn { background: #78909c; box-shadow: 0 5px 0 #546e7a; }
  button.big:active { transform: translateY(3px); box-shadow: none; }
  #scorebox {
    display: none; text-align: center; font-size: 22px; font-weight: bold;
    background: #fff; border-radius: 20px; padding: 22px;
    margin: 18px 0; box-shadow: 0 5px 12px rgba(0,0,0,.12);
  }
  #scorebox.show { display: block; }
  #scorebox .big-score { font-size: 40px; color: #f57c00; }
  #scorebox .praise { font-size: 20px; margin-top: 8px; }
  footer { text-align: center; color: #999; font-size: 13px; padding: 20px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>✨ ข้อสอบฝึกของยูน่า ✨</h1>
    <div class="meta">ชั้น ป.4 &nbsp;•&nbsp; วันที่ 28 ก.ค. 2026 &nbsp;•&nbsp; ชุด A 🎉</div>
    <div class="meta">วิชา: ภาษาไทย 📖 + สังคมศึกษา 🗺️</div>
  </header>

  <div id="quiz"></div>

  <div class="btnbar">
    <button class="big" id="checkBtn" onclick="checkAll()">✅ ตรวจคำตอบ</button>
    <button class="big" id="resetBtn" onclick="resetAll()">🔄 ทำใหม่</button>
  </div>

  <div id="scorebox"></div>

  <footer>JND • ฝึกทำทุกวัน เก่งขึ้นทุกวัน 💪</footer>
</div>

<script>
const questions = [
  // ===== ภาษาไทย: มาตราตัวสะกดทั้ง 8 มาตรา (15 ข้อ) =====
  { subj:1, text:"คำว่า “นก” มีตัวสะกดอยู่ในมาตราใด?", opts:["แม่กก","แม่กด","แม่กบ","แม่กน"], ans:0, exp:"“ก” เป็นตัวสะกด อยู่ในแม่กก" },
  { subj:1, text:"คำว่า “ปลา” อยู่ในมาตราใด?", opts:["แม่กก","แม่ ก กา (ไม่มีตัวสะกด)","แม่กน","แม่กง"], ans:1, exp:"ปลา ไม่มีตัวสะกด จัดอยู่ในแม่ ก กา" },
  { subj:1, text:"คำที่สะกดด้วย “ง” อยู่ในมาตราใด?", opts:["แม่กง","แม่กม","แม่กน","แม่เกย"], ans:0, exp:"ตัวสะกด ง อยู่ในแม่กง เช่น ลิง สิง" },
  { subj:1, text:"คำว่า “กิน” มีตัวสะกดในมาตราใด?", opts:["แม่กม","แม่กน","แม่กง","แม่กก"], ans:1, exp:"“น” เป็นตัวสะกด อยู่ในแม่กน" },
  { subj:1, text:"คำว่า “ลม” อยู่ในมาตราใด?", opts:["แม่กน","แม่กง","แม่กม","แม่กบ"], ans:2, exp:"“ม” เป็นตัวสะกด อยู่ในแม่กม" },
  { subj:1, text:"คำว่า “รัก” มีตัวสะกดในมาตราใด?", opts:["แม่กก","แม่กด","แม่กบ","แม่กน"], ans:0, exp:"“ก” เป็นตัวสะกด อยู่ในแม่กก" },
  { subj:1, text:"คำที่สะกดด้วย “ย” อยู่ในมาตราใด?", opts:["แม่เกย","แม่เกอว","แม่กน","แม่กม"], ans:0, exp:"ตัวสะกด ย อยู่ในแม่เกย เช่น เลย ยาย" },
  { subj:1, text:"คำว่า “ดาว” อยู่ในมาตราใด?", opts:["แม่เกย","แม่เกอว","แม่กง","แม่กม"], ans:1, exp:"“ว” เป็นตัวสะกด อยู่ในแม่เกอว" },
  { subj:1, text:"คำว่า “บ้าน” อยู่ในมาตราใด?", opts:["แม่กง","แม่กน","แม่กม","แม่กก"], ans:1, exp:"“น” เป็นตัวสะกด อยู่ในแม่กน" },
  { subj:1, text:"คำว่า “จบ” มีตัวสะกดในมาตราใด?", opts:["แม่กก","แม่กด","แม่กบ","แม่กม"], ans:2, exp:"“บ” เป็นตัวสะกด อยู่ในแม่กบ" },
  { subj:1, text:"คำว่า “มด” อยู่ในมาตราใด?", opts:["แม่กด","แม่กก","แม่กบ","แม่กน"], ans:0, exp:"“ด” เป็นตัวสะกด อยู่ในแม่กด" },
  { subj:1, text:"มาตราตัวสะกดมีทั้งหมดกี่มาตรา?", opts:["6 มาตรา","8 มาตรา","10 มาตรา","4 มาตรา"], ans:1, exp:"มาตราตัวสะกดมี 8 มาตรา (กก กด กบ กน กง กม เกย เกอว)" },
  { subj:1, text:"คำว่า “สวย” อยู่ในมาตราใด?", opts:["แม่เกอว","แม่เกย","แม่กน","แม่กง"], ans:1, exp:"“ย” เป็นตัวสะกด อยู่ในแม่เกย" },
  { subj:1, text:"คำว่า “ถูก” มีตัวสะกดในมาตราใด?", opts:["แม่กก","แม่กด","แม่กบ","แม่กง"], ans:0, exp:"“ก” เป็นตัวสะกด อยู่ในแม่กก" },
  { subj:1, text:"คำในข้อใด “ไม่มีตัวสะกด” (อยู่ในแม่ ก กา)?", opts:["มือ","นก","บ้าน","ลม"], ans:0, exp:"มือ ไม่มีตัวสะกด ส่วน นก บ้าน ลม มีตัวสะกด" },

  // ===== สังคมศึกษา: ศาสนาและหลักธรรมเบื้องต้น (15 ข้อ) =====
  { subj:2, text:"ศาสนาที่คนไทยส่วนใหญ่นับถือคือศาสนาใด?", opts:["ศาสนาคริสต์","ศาสนาพุทธ","ศาสนาอิสลาม","ศาสนาฮินดู"], ans:1, exp:"คนไทยส่วนใหญ่นับถือศาสนาพุทธ" },
  { subj:2, text:"ผู้ก่อตั้ง (ศาสดา) ของศาสนาพุทธคือใคร?", opts:["พระพุทธเจ้า","พระเยซู","นบีมูฮัมหมัด","พระพรหม"], ans:0, exp:"พระสัมมาสัมพุทธเจ้าเป็นศาสดาของศาสนาพุทธ" },
  { subj:2, text:"คัมภีร์สำคัญของศาสนาพุทธคืออะไร?", opts:["ไบเบิล","พระไตรปิฎก","อัลกุรอาน","พระเวท"], ans:1, exp:"คัมภีร์ของศาสนาพุทธคือ พระไตรปิฎก" },
  { subj:2, text:"ศีล 5 ข้อที่ 1 ว่าด้วยเรื่องใด?", opts:["เว้นจากการฆ่าสัตว์","เว้นจากการลักทรัพย์","เว้นจากการพูดปด","เว้นจากการดื่มสุรา"], ans:0, exp:"ศีลข้อ 1 คือ เว้นจากการฆ่าสัตว์ (มีเมตตา)" },
  { subj:2, text:"ศีล 5 ข้อที่ห้ามลักขโมยของผู้อื่น คือข้อใด?", opts:["ข้อ 1","ข้อ 2","ข้อ 3","ข้อ 4"], ans:1, exp:"ศีลข้อ 2 คือ เว้นจากการลักทรัพย์" },
  { subj:2, text:"วันสำคัญที่ระลึกถึงวันประสูติ ตรัสรู้ และปรินิพพานของพระพุทธเจ้า คือวันใด?", opts:["วันลอยกระทง","วันวิสาขบูชา","วันสงกรานต์","วันเด็ก"], ans:1, exp:"วันวิสาขบูชา ตรงกับทั้ง 3 เหตุการณ์สำคัญของพระพุทธเจ้า" },
  { subj:2, text:"สถานที่ประกอบศาสนกิจของชาวพุทธ คือที่ใด?", opts:["โบสถ์คริสต์","มัสยิด","วัด","ศาลเจ้า"], ans:2, exp:"ชาวพุทธประกอบศาสนกิจที่วัด 🛕" },
  { subj:2, text:"สถานที่ประกอบศาสนกิจของชาวมุสลิม (อิสลาม) คือที่ใด?", opts:["วัด","มัสยิด","โบสถ์","วิหาร"], ans:1, exp:"ชาวมุสลิมประกอบศาสนกิจที่มัสยิด" },
  { subj:2, text:"ศาสนาคริสต์นับถือใครเป็นศาสดา?", opts:["พระพุทธเจ้า","นบีมูฮัมหมัด","พระเยซูคริสต์","พระศิวะ"], ans:2, exp:"ศาสดาของศาสนาคริสต์คือ พระเยซูคริสต์" },
  { subj:2, text:"“เบญจศีล” หมายถึงศีลกี่ข้อ?", opts:["3 ข้อ","5 ข้อ","8 ข้อ","10 ข้อ"], ans:1, exp:"เบญจศีล = ศีล 5 ข้อ" },
  { subj:2, text:"“ทำความดี ละเว้นความชั่ว ทำจิตใจให้บริสุทธิ์” เป็นหัวใจของศาสนาใด?", opts:["ศาสนาพุทธ","ศาสนาคริสต์","ศาสนาอิสลาม","ศาสนาซิกข์"], ans:0, exp:"เป็นหัวใจของศาสนาพุทธ (โอวาทปาติโมกข์)" },
  { subj:2, text:"ศีล 5 ข้อที่ 4 ว่าด้วยเรื่องใด?", opts:["เว้นจากการฆ่าสัตว์","เว้นจากการลักทรัพย์","เว้นจากการพูดเท็จ","เว้นจากการดื่มสุรา"], ans:2, exp:"ศีลข้อ 4 คือ เว้นจากการพูดเท็จ" },
  { subj:2, text:"นักบวชในศาสนาพุทธที่ครองผ้าเหลือง เรียกว่าอะไร?", opts:["บาทหลวง","พระภิกษุ","อิหม่าม","พราหมณ์"], ans:1, exp:"นักบวชในศาสนาพุทธ เรียกว่า พระภิกษุ" },
  { subj:2, text:"การกราบไหว้พระและสวดมนต์ เป็นการปฏิบัติเพื่ออะไร?", opts:["ฝึกจิตใจให้สงบและระลึกถึงความดี","อวดคนอื่น","เพื่อความสนุก","ไม่มีเหตุผล"], ans:0, exp:"ช่วยฝึกจิตใจให้สงบและระลึกถึงความดี" },
  { subj:2, text:"คำสอนให้ “ขยัน ซื่อสัตย์ อดทน และมีน้ำใจ” เป็นสิ่งที่ทุกศาสนา…?", opts:["สอนเหมือนกัน ให้เป็นคนดี","ไม่สอน","ห้ามทำ","สอนต่างกันหมด"], ans:0, exp:"ทุกศาสนาสอนให้เป็นคนดีเหมือนกัน" }
];

const subjNames = { 1:"📖 วิชาภาษาไทย — มาตราตัวสะกดทั้ง 8 มาตรา", 2:"🗺️ วิชาสังคมศึกษา — ศาสนาและหลักธรรมเบื้องต้น" };
const selected = {};
let checked = false;

function render() {
  const box = document.getElementById('quiz');
  box.innerHTML = '';
  let lastSubj = null;
  questions.forEach((q, i) => {
    if (q.subj !== lastSubj) {
      const t = document.createElement('div');
      t.className = 'subject-title' + (q.subj===2 ? ' s2' : '');
      t.textContent = subjNames[q.subj];
      box.appendChild(t);
      lastSubj = q.subj;
    }
    const card = document.createElement('div');
    card.className = 'q';
    const numInSubj = questions.slice(0,i+1).filter(x=>x.subj===q.subj).length;
    let html = '<div class="text"><span class="num">'+numInSubj+'</span>'+q.text+'</div>';
    q.opts.forEach((o, oi) => {
      html += '<button class="opt" data-q="'+i+'" data-o="'+oi+'" onclick="pick('+i+','+oi+')">'+o+'</button>';
    });
    html += '<div class="explain" id="exp-'+i+'">💡 เฉลย: '+q.opts[q.ans]+' — '+q.exp+'</div>';
    card.innerHTML = html;
    box.appendChild(card);
  });
}

function pick(qi, oi) {
  if (checked) return;
  selected[qi] = oi;
  document.querySelectorAll('.opt[data-q="'+qi+'"]').forEach(b => b.classList.remove('sel'));
  document.querySelector('.opt[data-q="'+qi+'"][data-o="'+oi+'"]').classList.add('sel');
}

function checkAll() {
  checked = true;
  let score = 0;
  questions.forEach((q, i) => {
    const sel = selected[i];
    document.querySelectorAll('.opt[data-q="'+i+'"]').forEach(b => {
      const oi = +b.dataset.o;
      b.classList.remove('sel');
      if (oi === q.ans) b.classList.add('correct');
      if (oi === sel && sel !== q.ans) b.classList.add('wrong');
    });
    document.getElementById('exp-'+i).classList.add('show');
    if (sel === q.ans) score++;
  });
  showScore(score);
}

function showScore(score) {
  const total = questions.length;
  const pct = score/total;
  let praise, emoji;
  if (pct === 1) { praise = "สุดยอดมากลูก! ทำได้เต็มทุกข้อ!"; emoji="🏆🎉"; }
  else if (pct >= 0.8) { praise = "เก่งมากยูน่า! เกือบเต็มแล้ว!"; emoji="🌟😍"; }
  else if (pct >= 0.6) { praise = "ทำได้ดีมากลูก! พัฒนาขึ้นเรื่อยๆ!"; emoji="😊👍"; }
  else { praise = "เยี่ยมที่ตั้งใจทำจนจบ! ลองทบทวนเฉลยแล้วสู้ต่อนะ!"; emoji="🤗💪"; }
  const sb = document.getElementById('scorebox');
  sb.innerHTML = '<div>ได้คะแนน</div><div class="big-score">'+score+' / '+total+' '+emoji+'</div><div class="praise">'+praise+'</div>';
  sb.classList.add('show');
  sb.scrollIntoView({behavior:'smooth'});
}

function resetAll() {
  checked = false;
  for (const k in selected) delete selected[k];
  document.getElementById('scorebox').classList.remove('show');
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

render();
</script>
</body>
</html>
