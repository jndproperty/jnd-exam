<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ข้อสอบฝึกทีฟา ป.1 - 28 ก.ค. 2026</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Comic Sans MS', 'Tahoma', sans-serif;
    margin: 0; padding: 0;
    background: linear-gradient(160deg, #fff3e0 0%, #ffe0f0 100%);
    color: #333;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 16px; }
  header {
    text-align: center; background: #ff8fab; color: #fff;
    border-radius: 24px; padding: 20px 16px; margin-bottom: 16px;
    box-shadow: 0 6px 0 #f06292;
  }
  header h1 { margin: 0 0 6px; font-size: 30px; }
  header .meta { font-size: 18px; opacity: .95; }
  .subject-title {
    font-size: 24px; font-weight: bold; color: #fff;
    background: #7c4dff; border-radius: 18px;
    padding: 12px 18px; margin: 22px 0 12px;
    box-shadow: 0 4px 0 #5e35b1; text-align: center;
  }
  .subject-title.s2 { background: #26a69a; box-shadow: 0 4px 0 #00897b; }
  .q {
    background: #fff; border-radius: 20px; padding: 18px;
    margin-bottom: 16px; box-shadow: 0 4px 10px rgba(0,0,0,.08);
  }
  .q .num {
    display: inline-block; background: #ffca28; color: #5d4037;
    font-weight: bold; border-radius: 50%; width: 38px; height: 38px;
    line-height: 38px; text-align: center; font-size: 20px; margin-right: 8px;
  }
  .q .text { font-size: 24px; font-weight: bold; margin: 6px 0 14px; }
  .opt {
    display: block; width: 100%; text-align: left;
    font-size: 23px; font-family: inherit;
    background: #f5f5f5; border: 3px solid #e0e0e0;
    border-radius: 16px; padding: 14px 18px; margin-bottom: 10px;
    cursor: pointer; transition: .12s;
  }
  .opt:active { transform: scale(.98); }
  .opt.sel { background: #bbdefb; border-color: #2196f3; }
  .opt.correct { background: #c8e6c9; border-color: #43a047; }
  .opt.wrong { background: #ffcdd2; border-color: #e53935; }
  .explain {
    display: none; font-size: 19px; background: #fff8e1;
    border-left: 6px solid #ffb300; border-radius: 10px;
    padding: 10px 14px; margin-top: 10px; color: #6d4c00;
  }
  .explain.show { display: block; }
  .btnbar { text-align: center; margin: 24px 0; }
  button.big {
    font-family: inherit; font-size: 24px; font-weight: bold;
    color: #fff; border: none; border-radius: 20px;
    padding: 16px 28px; margin: 8px; cursor: pointer;
  }
  #checkBtn { background: #43a047; box-shadow: 0 5px 0 #2e7d32; }
  #resetBtn { background: #78909c; box-shadow: 0 5px 0 #546e7a; }
  button.big:active { transform: translateY(3px); box-shadow: none; }
  #scorebox {
    display: none; text-align: center; font-size: 28px; font-weight: bold;
    background: #fff; border-radius: 24px; padding: 24px;
    margin: 18px 0; box-shadow: 0 6px 14px rgba(0,0,0,.12);
  }
  #scorebox.show { display: block; }
  #scorebox .big-score { font-size: 46px; color: #ff6f00; }
  #scorebox .praise { font-size: 24px; margin-top: 10px; }
  footer { text-align: center; color: #999; font-size: 14px; padding: 20px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌟 ข้อสอบฝึกของหนูทีฟา 🌟</h1>
    <div class="meta">ชั้น ป.1 &nbsp;•&nbsp; วันที่ 28 ก.ค. 2026 🎉</div>
    <div class="meta">วิชา: คณิตศาสตร์ ➕ + สุขศึกษา 🩺</div>
  </header>

  <div id="quiz"></div>

  <div class="btnbar">
    <button class="big" id="checkBtn" onclick="checkAll()">✅ ตรวจคำตอบ</button>
    <button class="big" id="resetBtn" onclick="resetAll()">🔄 ทำใหม่</button>
  </div>

  <div id="scorebox"></div>

  <footer>JND • ฝึกทำทุกวัน เก่งขึ้นทุกวัน 💪</footer>
</div>

<script>
const questions = [
  // ===== คณิตศาสตร์: นับจำนวน 1–20 (10 ข้อ) =====
  { subj:1, text:"นับดาว ⭐⭐⭐ มีกี่ดวง?", opts:["2","3","4"], ans:1, exp:"นับได้ 3 ดวง ⭐⭐⭐" },
  { subj:1, text:"นับแอปเปิล 🍎🍎🍎🍎🍎 มีกี่ผล?", opts:["4","5","6"], ans:1, exp:"นับได้ 5 ผล 🍎🍎🍎🍎🍎" },
  { subj:1, text:"มือสองข้างของเรามีนิ้วทั้งหมดกี่นิ้ว? ✋🤚", opts:["8","10","12"], ans:1, exp:"มือข้างละ 5 นิ้ว สองข้างเป็น 10 นิ้ว" },
  { subj:1, text:"นับปลา 🐟🐟🐟🐟🐟🐟🐟 มีกี่ตัว?", opts:["6","7","8"], ans:1, exp:"นับได้ 7 ตัว 🐟" },
  { subj:1, text:"จำนวนที่มาหลังเลข 9 คือเลขอะไร?", opts:["8","10","11"], ans:1, exp:"นับต่อจาก 9 คือ 10" },
  { subj:1, text:"จำนวนที่มาก่อนเลข 15 คือเลขอะไร?", opts:["14","16","13"], ans:0, exp:"ก่อน 15 คือ 14" },
  { subj:1, text:"นับบอลลูน 🎈🎈🎈🎈🎈🎈🎈🎈🎈🎈🎈🎈 มีกี่ลูก?", opts:["11","12","13"], ans:1, exp:"นับได้ 12 ลูก 🎈" },
  { subj:1, text:"เลข 20 อ่านว่าอะไร?", opts:["ยี่สิบ","สิบสอง","สิบ"], ans:0, exp:"20 อ่านว่า ยี่สิบ" },
  { subj:1, text:"นับต่อ… 16, 17, 18, ? เลขถัดไปคือเลขอะไร?", opts:["19","20","15"], ans:0, exp:"ถัดจาก 18 คือ 19" },
  { subj:1, text:"กลุ่มไหนมีลูกอมมากกว่ากัน? 🍬🍬🍬 หรือ 🍬🍬🍬🍬🍬", opts:["3 เม็ด","5 เม็ด","เท่ากัน"], ans:1, exp:"5 เม็ด มากกว่า 3 เม็ด 🍬" },

  // ===== สุขศึกษา: ส่วนต่างๆ ของร่างกาย (10 ข้อ) =====
  { subj:2, text:"อวัยวะที่เราใช้มองเห็น คืออะไร? 👀", opts:["ตา","หู","ปาก"], ans:0, exp:"เราใช้ตามองเห็น 👀" },
  { subj:2, text:"เราใช้อะไรในการเดินและวิ่ง? 🏃", opts:["มือ","ขาและเท้า","หู"], ans:1, exp:"เราใช้ขาและเท้าเดินและวิ่ง" },
  { subj:2, text:"อวัยวะในปากที่ใช้บดเคี้ยวอาหาร คืออะไร? 🦷", opts:["ฟัน","ตา","จมูก"], ans:0, exp:"เราใช้ฟันบดเคี้ยวอาหาร 🦷" },
  { subj:2, text:"เราใช้อะไรจับและหยิบสิ่งของ? ✋", opts:["เท้า","มือ","หู"], ans:1, exp:"เราใช้มือจับและหยิบของ ✋" },
  { subj:2, text:"อวัยวะที่ใช้ลิ้มรสชาติอาหาร คืออะไร? 👅", opts:["ลิ้น","ตา","หู"], ans:0, exp:"เราใช้ลิ้นชิมรสชาติ 👅" },
  { subj:2, text:"อยากให้ฟันแข็งแรง เราควรทำอย่างไร?", opts:["กินลูกอมเยอะๆ","แปรงฟันทุกวัน","ไม่แปรงฟัน"], ans:1, exp:"แปรงฟันวันละ 2 ครั้ง ฟันจะแข็งแรง 🪥" },
  { subj:2, text:"ส่วนของร่างกายที่อยู่บนสุด คืออะไร?", opts:["เท้า","ศีรษะ (หัว)","มือ"], ans:1, exp:"ศีรษะอยู่บนสุดของร่างกาย" },
  { subj:2, text:"เราควรล้างมือเมื่อไหร่?", opts:["ก่อนกินข้าว","ไม่ต้องล้าง","เฉพาะวันเกิด"], ans:0, exp:"ล้างมือก่อนกินข้าวและหลังเข้าห้องน้ำ 🧼" },
  { subj:2, text:"ผม อยู่ส่วนใดของร่างกาย?", opts:["บนศีรษะ","ที่เท้า","ที่มือ"], ans:0, exp:"ผมขึ้นอยู่บนศีรษะ" },
  { subj:2, text:"อยากให้ร่างกายแข็งแรง เราควรทำอย่างไร?", opts:["นอนดึกทุกวัน","ออกกำลังกายและกินอาหารดีๆ","กินขนมอย่างเดียว"], ans:1, exp:"ออกกำลังกาย พักผ่อน และกินอาหารมีประโยชน์ 💪" }
];

const subjNames = { 1:"➕ วิชาคณิตศาสตร์ — นับจำนวน 1–20", 2:"🩺 วิชาสุขศึกษา — ส่วนต่างๆ ของร่างกาย" };
const selected = {};
let checked = false;

function render() {
  const box = document.getElementById('quiz');
  box.innerHTML = '';
  let lastSubj = null;
  questions.forEach((q, i) => {
    if (q.subj !== lastSubj) {
      const t = document.createElement('div');
      t.className = 'subject-title' + (q.subj===2 ? ' s2' : '');
      t.textContent = subjNames[q.subj];
      box.appendChild(t);
      lastSubj = q.subj;
    }
    const card = document.createElement('div');
    card.className = 'q';
    const numInSubj = questions.slice(0,i+1).filter(x=>x.subj===q.subj).length;
    let html = '<div class="text"><span class="num">'+numInSubj+'</span>'+q.text+'</div>';
    q.opts.forEach((o, oi) => {
      html += '<button class="opt" data-q="'+i+'" data-o="'+oi+'" onclick="pick('+i+','+oi+')">'+o+'</button>';
    });
    html += '<div class="explain" id="exp-'+i+'">💡 เฉลย: '+q.opts[q.ans]+' — '+q.exp+'</div>';
    card.innerHTML = html;
    box.appendChild(card);
  });
}

function pick(qi, oi) {
  if (checked) return;
  selected[qi] = oi;
  document.querySelectorAll('.opt[data-q="'+qi+'"]').forEach(b => b.classList.remove('sel'));
  document.querySelector('.opt[data-q="'+qi+'"][data-o="'+oi+'"]').classList.add('sel');
}

function checkAll() {
  checked = true;
  let score = 0;
  questions.forEach((q, i) => {
    const sel = selected[i];
    document.querySelectorAll('.opt[data-q="'+i+'"]').forEach(b => {
      const oi = +b.dataset.o;
      b.classList.remove('sel');
      if (oi === q.ans) b.classList.add('correct');
      if (oi === sel && sel !== q.ans) b.classList.add('wrong');
    });
    document.getElementById('exp-'+i).classList.add('show');
    if (sel === q.ans) score++;
  });
  showScore(score);
}

function showScore(score) {
  const total = questions.length;
  const pct = score/total;
  let praise, emoji;
  if (pct === 1) { praise = "สุดยอดมากลูก! เต็มทุกข้อเลย!"; emoji="🏆🎉"; }
  else if (pct >= 0.8) { praise = "เก่งมากๆ เลยลูก! ใกล้เต็มแล้ว!"; emoji="🌟😍"; }
  else if (pct >= 0.6) { praise = "ดีมากลูก! เก่งขึ้นเยอะเลย!"; emoji="😊👍"; }
  else { praise = "เก่งมากที่ตั้งใจทำ! ลองใหม่ได้อีกนะ!"; emoji="🤗💪"; }
  const sb = document.getElementById('scorebox');
  sb.innerHTML = '<div>ได้คะแนน</div><div class="big-score">'+score+' / '+total+' '+emoji+'</div><div class="praise">'+praise+'</div>';
  sb.classList.add('show');
  sb.scrollIntoView({behavior:'smooth'});
}

function resetAll() {
  checked = false;
  for (const k in selected) delete selected[k];
  document.getElementById('scorebox').classList.remove('show');
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

render();
</script>
</body>
</html>
