<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ข้อสอบฝึกทีฟา ป.1 - 7 ต.ค. 2026 (100 ข้อ)</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Comic Sans MS', 'Tahoma', sans-serif; margin:0; padding:0; background: linear-gradient(160deg, #fff3e0 0%, #ffe0f0 100%); color:#333; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 14px; }
  header { text-align:center; background: #ff8fab; color:#fff; border-radius:24px; padding:18px 14px; margin-bottom:14px; box-shadow: 0 6px 0 #f06292; }
  header h1 { margin:0 0 6px; font-size: 28px; }
  header .meta { font-size: 17px; opacity:.95; }
  .tabs { display:grid; grid-template-columns: repeat(5, 1fr); gap:6px; margin-bottom:14px; }
  .tab { font-family:inherit; font-size: 15px; font-weight:bold; border:none; border-radius:14px;
         padding:10px 4px; cursor:pointer; background:#fff; color:#555; box-shadow:0 3px 0 #ddd; line-height:1.3; }
  .tab .tn { display:block; font-size: 12px; font-weight:normal; opacity:.75; margin-top:2px; }
  .tab.active { background: #7c4dff; color:#fff; box-shadow:0 3px 0 #5e35b1; }
  .tab.done { background:#c8e6c9; color:#2e7d32; box-shadow:0 3px 0 #a5d6a7; }
  .tab.done.active { background: #7c4dff; color:#fff; box-shadow:0 3px 0 #5e35b1; }
  .subject-title { font-size: 22px; font-weight:bold; color:#fff; background: #7c4dff; border-radius:18px;
                   padding:12px 18px; margin: 6px 0 12px; box-shadow:0 4px 0 #5e35b1; text-align:center; }
  .progress { text-align:center; font-size: 17px; color:#777; margin-bottom:10px; }
  .q { background:#fff; border-radius:20px; padding:16px; margin-bottom:14px; box-shadow:0 4px 10px rgba(0,0,0,.08); }
  .q .num { display:inline-block; background:#ffca28; color:#5d4037; font-weight:bold; border-radius:50%;
            width:36px; height:36px; line-height:36px; text-align:center; font-size:18px; margin-right:8px; }
  .q .text { font-size: 23px; font-weight:bold; margin:4px 0 12px; }
  .opt { display:block; width:100%; text-align:left; font-size: 22px; font-family:inherit;
         background:#f5f5f5; border:3px solid #e0e0e0; border-radius:16px; padding:12px 16px; margin-bottom:9px; cursor:pointer; transition:.12s; }
  .opt:active { transform: scale(.98); }
  .opt.sel { background:#bbdefb; border-color:#2196f3; }
  .opt.correct { background:#c8e6c9; border-color:#43a047; }
  .opt.wrong { background:#ffcdd2; border-color:#e53935; }
  .explain { display:none; font-size: 18px; background:#fff8e1; border-left:6px solid #ffb300;
             border-radius:10px; padding:10px 14px; margin-top:10px; color:#6d4c00; }
  .explain.show { display:block; }
  .btnbar { text-align:center; margin:20px 0; }
  button.big { font-family:inherit; font-size: 21px; font-weight:bold; color:#fff; border:none;
               border-radius:20px; padding:14px 24px; margin:6px; cursor:pointer; }
  .checkBtn { background:#43a047; box-shadow:0 5px 0 #2e7d32; }
  .resetBtn { background:#78909c; box-shadow:0 5px 0 #546e7a; }
  .nextBtn  { background:#5c6bc0; box-shadow:0 5px 0 #3949ab; }
  button.big:active { transform: translateY(3px); box-shadow:none; }
  .scorebox { display:none; text-align:center; font-size: 24px; font-weight:bold; background:#fff;
              border-radius:24px; padding:20px; margin:16px 0; box-shadow:0 6px 14px rgba(0,0,0,.12); }
  .scorebox.show { display:block; }
  .scorebox .big-score { font-size: 42px; color:#ff6f00; }
  .scorebox .praise { font-size: 21px; margin-top:8px; }
  .total { background:#fff; border-radius:20px; padding:16px; margin:16px 0; box-shadow:0 4px 10px rgba(0,0,0,.08); }
  .total h3 { margin:0 0 10px; text-align:center; font-size: 22px; color:#555; }
  .total .row { display:flex; justify-content:space-between; font-size: 18px; padding:7px 4px; border-bottom:1px dashed #eee; }
  .total .row:last-child { border-bottom:none; font-weight:bold; color:#ff6f00; }
  footer { text-align:center; color:#999; font-size:14px; padding:18px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌟 ข้อสอบฝึกของหนูทีฟา 🌟</h1>
    <div class="meta">ชั้น ป.1 &nbsp;•&nbsp; วันที่ 7 ต.ค. 2026 🎉</div>
    <div class="meta">5 วิชา วิชาละ 20 ข้อ &nbsp;•&nbsp; รวม 100 ข้อ 💯</div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="progress" id="progress"></div>
  <div id="quiz"></div>

  <div class="btnbar">
    <button class="big checkBtn" onclick="checkSubject()">✅ ตรวจวิชานี้</button>
    <button class="big nextBtn" onclick="nextSubject()">➡️ วิชาถัดไป</button>
    <button class="big resetBtn" onclick="resetSubject()">🔄 ทำวิชานี้ใหม่</button>
  </div>

  <div class="scorebox" id="scorebox"></div>
  <div class="total" id="total"></div>

  <footer>JND • ฝึกทำทุกวัน เก่งขึ้นทุกวัน 💪</footer>
</div>

<script>
const questions = [
  // ===== ภาษาไทย (20 ข้อ) =====
  // (ก) คำคล้องจอง 10 ข้อ
  { subj:1, text:"คำใดคล้องจองกับคำว่า “มา” 🐴?", opts:["หมู","ปลา","มือ"], ans:1, exp:"“มา” กับ “ปลา” ใช้สระอาเหมือนกัน จึงคล้องจองกัน" },
  { subj:1, text:"คำใดคล้องจองกับคำว่า “ไก่” 🐔?", opts:["ไข่","กบ","แมว"], ans:0, exp:"“ไก่” กับ “ไข่” ใช้สระไอเหมือนกัน จึงคล้องจองกัน" },
  { subj:1, text:"คำใดคล้องจองกับคำว่า “แมว” 🐱?", opts:["หมู","ม้า","แถว"], ans:2, exp:"“แมว” กับ “แถว” ลงท้ายด้วยเสียง แ-ว เหมือนกัน" },
  { subj:1, text:"คำใดคล้องจองกับคำว่า “ดาว” ⭐?", opts:["ขาว","เดือน","ดี"], ans:0, exp:"“ดาว” กับ “ขาว” ลงท้ายด้วยเสียง -าว เหมือนกัน" },
  { subj:1, text:"คำใดคล้องจองกับคำว่า “หมู” 🐷?", opts:["หมา","ไก่","งู"], ans:2, exp:"“หมู” กับ “งู” ใช้สระอูเหมือนกัน จึงคล้องจองกัน" },
  { subj:1, text:"คำใดคล้องจองกับคำว่า “มือ” ✋?", opts:["แขน","ถือ","ขา"], ans:1, exp:"“มือ” กับ “ถือ” ใช้สระอือเหมือนกัน จึงคล้องจองกัน" },
  { subj:1, text:"คำใดคล้องจองกับคำว่า “เป็ด” 🦆?", opts:["ไก่","ปลา","เจ็ด"], ans:2, exp:"“เป็ด” กับ “เจ็ด” ลงท้ายด้วยเสียง เ-็ด เหมือนกัน" },
  { subj:1, text:"คู่ใดเป็นคำคล้องจองกัน? ☁️", opts:["ฟ้า – เมฆ","ฟ้า – หน้า","ฟ้า – ฝน"], ans:1, exp:"“ฟ้า” กับ “หน้า” ใช้สระอาเหมือนกัน จึงคล้องจองกัน" },
  { subj:1, text:"คู่ใด “ไม่” คล้องจองกัน? 👀", opts:["ตา – ขา","จมูก – ปาก","หู – ดู"], ans:1, exp:"“จมูก” ลงท้ายด้วย -ูก ส่วน “ปาก” ลงท้ายด้วย -าก เสียงไม่เหมือนกัน จึงไม่คล้องจอง" },
  { subj:1, text:"คำใดคล้องจองกับคำว่า “รถ” 🚗?", opts:["มด","ล้อ","ถนน"], ans:0, exp:"“รถ” กับ “มด” ลงท้ายด้วยเสียง โอะ+ด เหมือนกัน (รด–มด)" },
  // (ข) การแต่งประโยคง่ายๆ 10 ข้อ
  { subj:1, text:"เติมคำให้เป็นประโยค: “น้อง ___ นม” 🥛", opts:["ดื่ม","นอน","วิ่ง"], ans:0, exp:"นมใช้ดื่ม จึงเป็น “น้องดื่มนม”" },
  { subj:1, text:"เติมคำให้เป็นประโยค: “แมว ___ ปลา” 🐱🐟", opts:["บิน","ว่ายน้ำ","ชอบ"], ans:2, exp:"“แมวชอบปลา” เป็นประโยคที่มีความหมาย" },
  { subj:1, text:"เติมคำให้เป็นประโยค: “นก ___ อยู่บนฟ้า” 🐦", opts:["เดิน","บิน","ขุด"], ans:1, exp:"นกบินอยู่บนฟ้า จึงเป็น “นกบินอยู่บนฟ้า”" },
  { subj:1, text:"เรียงคำ “อ่าน / หนังสือ / พี่” ให้เป็นประโยค 📖", opts:["หนังสือพี่อ่าน","พี่อ่านหนังสือ","อ่านพี่หนังสือ"], ans:1, exp:"ประโยคเริ่มด้วยคนทำ (พี่) ตามด้วยสิ่งที่ทำ (อ่าน) และสิ่งที่ถูกทำ (หนังสือ)" },
  { subj:1, text:"เรียงคำ “เตะ / ฟุตบอล / ผม” ให้เป็นประโยค ⚽", opts:["เตะผมฟุตบอล","ฟุตบอลเตะผม","ผมเตะฟุตบอล"], ans:2, exp:"คนเป็นผู้เตะ ลูกฟุตบอลเตะใครไม่ได้ จึงเป็น “ผมเตะฟุตบอล”" },
  { subj:1, text:"ประโยคใดถูกต้อง? 🐠", opts:["ปลาบินบนต้นไม้","ปลาเดินบนถนน","ปลาว่ายอยู่ในน้ำ"], ans:2, exp:"ปลาอาศัยและว่ายอยู่ในน้ำ" },
  { subj:1, text:"ประโยคใดถูกต้อง? 🪥", opts:["หนูแปรงฟันก่อนนอน","หนูแปรงก่อนฟันนอน","ฟันนอนแปรงหนู"], ans:0, exp:"“หนูแปรงฟันก่อนนอน” เรียงคำถูกและมีความหมาย" },
  { subj:1, text:"เติมคำให้เป็นประโยค: “ฝน ___ ลงมา” 🌧️", opts:["ขึ้น","ตก","บิน"], ans:1, exp:"ฝนตกลงมาจากฟ้า จึงเป็น “ฝนตกลงมา”" },
  { subj:1, text:"เรียงคำ “ใส่ / รองเท้า / น้อง” ให้เป็นประโยค 👟", opts:["ใส่น้องรองเท้า","รองเท้าใส่น้อง","น้องใส่รองเท้า"], ans:2, exp:"น้องเป็นคนใส่รองเท้า จึงเป็น “น้องใส่รองเท้า”" },
  { subj:1, text:"เติมคำให้เป็นประโยค: “พระอาทิตย์ขึ้นตอน ___” 🌅", opts:["เช้า","เที่ยงคืน","ค่ำ"], ans:0, exp:"พระอาทิตย์ขึ้นตอนเช้า" },
  // ===== คณิตศาสตร์ (20 ข้อ) =====
  // (ก) โจทย์ปัญหาบวก-ลบระคน 10 ข้อ
  { subj:2, text:"ทีฟามีส้ม 8 ผล 🍊 แม่ให้อีก 5 ผล แล้วทีฟาแบ่งให้น้อง 4 ผล ทีฟาเหลือส้มกี่ผล?", opts:["9 ผล", "10 ผล", "8 ผล"], ans:0, exp:"8 + 5 = 13 แล้ว 13 − 4 = 9 เหลือ 9 ผล" },
  { subj:2, text:"ในตู้มีปลา 6 ตัว 🐟 พ่อซื้อมาใส่เพิ่ม 7 ตัว ต่อมามีปลาตายไป 2 ตัว ในตู้เหลือปลากี่ตัว?", opts:["11 ตัว", "13 ตัว", "12 ตัว"], ans:0, exp:"6 + 7 = 13 แล้ว 13 − 2 = 11 เหลือ 11 ตัว" },
  { subj:2, text:"บนต้นไม้มีนก 15 ตัว 🐦 บินไป 6 ตัว แล้วบินกลับมาอีก 3 ตัว ตอนนี้มีนกกี่ตัว?", opts:["9 ตัว", "12 ตัว", "6 ตัว"], ans:1, exp:"15 − 6 = 9 แล้ว 9 + 3 = 12 มีนก 12 ตัว" },
  { subj:2, text:"ทีฟามีดินสอ 11 แท่ง ✏️ ให้เพื่อนยืม 3 แท่ง แม่ซื้อให้ใหม่อีก 8 แท่ง ตอนนี้ทีฟามีดินสอกี่แท่ง?", opts:["14 แท่ง", "22 แท่ง", "16 แท่ง"], ans:2, exp:"11 − 3 = 8 แล้ว 8 + 8 = 16 มีดินสอ 16 แท่ง" },
  { subj:2, text:"มีคุกกี้ 20 ชิ้น 🍪 ทีฟากินไป 5 ชิ้น แล้วแบ่งให้พี่ 6 ชิ้น เหลือคุกกี้กี่ชิ้น?", opts:["11 ชิ้น", "10 ชิ้น", "9 ชิ้น"], ans:2, exp:"20 − 5 = 15 แล้ว 15 − 6 = 9 เหลือ 9 ชิ้น" },
  { subj:2, text:"บนรถบัสมีคน 9 คน 🚌 ป้ายแรกมีคนขึ้นมาอีก 8 คน แล้วมีคนลงไป 5 คน บนรถเหลือคนกี่คน?", opts:["17 คน", "12 คน", "13 คน"], ans:1, exp:"9 + 8 = 17 แล้ว 17 − 5 = 12 เหลือ 12 คน" },
  { subj:2, text:"ทีฟามีสติกเกอร์ 7 แผ่น ⭐ ได้จากคุณครูอีก 4 แผ่น และได้จากแม่อีก 6 แผ่น ทีฟามีสติกเกอร์ทั้งหมดกี่แผ่น?", opts:["17 แผ่น", "11 แผ่น", "16 แผ่น"], ans:0, exp:"7 + 4 = 11 แล้ว 11 + 6 = 17 มีทั้งหมด 17 แผ่น" },
  { subj:2, text:"แม่มีไข่ 18 ฟอง 🥚 ทำตกแตกไป 2 ฟอง แล้วเอาไปทำขนม 9 ฟอง แม่เหลือไข่กี่ฟอง?", opts:["9 ฟอง", "7 ฟอง", "8 ฟอง"], ans:1, exp:"18 − 2 = 16 แล้ว 16 − 9 = 7 เหลือ 7 ฟอง" },
  { subj:2, text:"ทีฟามีลูกอม 6 เม็ด 🍬 พี่ยูน่ามีลูกอมมากกว่าทีฟา 5 เม็ด ทั้งสองคนมีลูกอมรวมกันกี่เม็ด?", opts:["11 เม็ด", "16 เม็ด", "17 เม็ด"], ans:2, exp:"พี่ยูน่ามี 6 + 5 = 11 เม็ด รวมกับทีฟา 11 + 6 = 17 เม็ด" },
  { subj:2, text:"ทีฟามีตุ๊กตา 5 ตัว 🧸 วันเกิดได้ตุ๊กตาเพิ่มมาอีกจำนวนหนึ่ง รวมเป็น 14 ตัว ทีฟาได้ตุ๊กตาเพิ่มมากี่ตัว?", opts:["9 ตัว", "19 ตัว", "8 ตัว"], ans:0, exp:"14 − 5 = 9 ได้เพิ่มมา 9 ตัว (ตรวจ: 5 + 9 = 14)" },
  // (ข) การวัดความยาวและน้ำหนัก 10 ข้อ
  { subj:2, text:"ปากกายาว 14 เซนติเมตร ดินสอยาว 9 เซนติเมตร ข้อใดถูกต้อง? 🖊️✏️", opts:["ปากกายาวกว่าดินสอ", "ดินสอยาวกว่าปากกา", "ยาวเท่ากัน"], ans:0, exp:"14 มากกว่า 9 ปากกาจึงยาวกว่าดินสอ" },
  { subj:2, text:"ถ้าอยากรู้ว่าดินสอยาวกี่เซนติเมตร ควรใช้อะไรวัด? 📏", opts:["ตาชั่ง", "ไม้บรรทัด", "นาฬิกา"], ans:1, exp:"ไม้บรรทัดใช้วัดความยาว ตาชั่งใช้ชั่งน้ำหนัก นาฬิกาใช้ดูเวลา" },
  { subj:2, text:"ถ้าอยากรู้ว่าถุงส้มหนักกี่กิโลกรัม ควรใช้อะไร? ⚖️", opts:["ไม้บรรทัด", "แก้วน้ำ", "ตาชั่ง"], ans:2, exp:"ตาชั่งใช้ชั่งน้ำหนักของสิ่งของ" },
  { subj:2, text:"น้ำหนักของแตงโม 🍉 ใช้หน่วยใดบอก?", opts:["เซนติเมตร", "กิโลกรัม", "นาที"], ans:1, exp:"กิโลกรัมเป็นหน่วยบอกน้ำหนัก เซนติเมตรบอกความยาว นาทีบอกเวลา" },
  { subj:2, text:"ความยาวของยางลบ ใช้หน่วยใดบอก?", opts:["เซนติเมตร", "กิโลกรัม", "นาที"], ans:0, exp:"เซนติเมตรเป็นหน่วยบอกความยาว" },
  { subj:2, text:"กระเป๋านักเรียนหนัก 3 กิโลกรัม 🎒 ถุงข้าวสารหนัก 5 กิโลกรัม สิ่งใดเบากว่า?", opts:["ถุงข้าวสาร", "หนักเท่ากัน", "กระเป๋านักเรียน"], ans:2, exp:"3 กิโลกรัม น้อยกว่า 5 กิโลกรัม กระเป๋าจึงเบากว่า" },
  { subj:2, text:"ทีฟาใช้ฝ่ามือวัด โต๊ะยาว 6 ฝ่ามือ เก้าอี้ยาว 4 ฝ่ามือ สิ่งใดยาวกว่า? ✋", opts:["โต๊ะ", "เก้าอี้", "ยาวเท่ากัน"], ans:0, exp:"6 ฝ่ามือ มากกว่า 4 ฝ่ามือ โต๊ะจึงยาวกว่า" },

  { subj:5, text:"อยู่ในห้องสมุด เราควรทำตัวอย่างไร 🤫", opts:["วิ่งเล่น","ตะโกนเรียกเพื่อน","พูดเบาๆ ไม่ส่งเสียงดัง"], ans:2, exp:"ห้องสมุดต้องเงียบ เพื่อไม่รบกวนคนที่อ่านหนังสือ" },
  { subj:5, text:"อ่านหนังสือในห้องสมุดเสร็จแล้ว ควรทำอย่างไร 📚", opts:["เก็บคืนที่เดิม","ฉีกหน้าที่ชอบไป","ทิ้งไว้บนพื้น"], ans:0, exp:"เก็บหนังสือคืนที่เดิม คนอื่นจะได้หาเจอ" },
  { subj:5, text:"ล้างมือที่ก๊อกน้ำสาธารณะเสร็จแล้ว ควรทำอย่างไร 🚰", opts:["เปิดน้ำทิ้งไว้","ปิดก๊อกให้สนิท","เอาก๊อกกลับบ้าน"], ans:1, exp:"ปิดก๊อกให้สนิทเพื่อไม่ให้น้ำไหลทิ้งเปล่าๆ" },
  { subj:5, text:"มีเพื่อนรอเล่นชิงช้าหลายคน เราควรทำอย่างไร", opts:["เล่นคนเดียวทั้งวัน","ไล่เพื่อนออกไป","ผลัดกันเล่น"], ans:2, exp:"ของส่วนรวมต้องแบ่งกันใช้ ผลัดกันเล่นทุกคน" },
  { subj:5, text:"ม้านั่งในสวนสาธารณะ ควรใช้อย่างไร 🪑", opts:["นั่งพักและไม่ทำให้เลอะ","ยืนกระโดดบนม้านั่ง","ขีดเขียนบนม้านั่ง"], ans:0, exp:"ม้านั่งมีไว้นั่งพัก ต้องช่วยกันรักษาให้สะอาด" },
  { subj:5, text:"ไฟถนนมีไว้ทำอะไร 💡", opts:["ไว้ปีนเล่น","ไว้ตากผ้า","ให้แสงสว่างตอนกลางคืน"], ans:2, exp:"ไฟถนนช่วยให้เรามองเห็นทางตอนกลางคืน" },
  { subj:5, text:"เห็นก๊อกน้ำสาธารณะเสีย น้ำไหลไม่หยุด ควรทำอย่างไร", opts:["บอกครูหรือผู้ใหญ่","เล่นน้ำต่อ","ทำเป็นไม่เห็น"], ans:0, exp:"บอกผู้ใหญ่ให้มาซ่อม น้ำจะได้ไม่ไหลทิ้ง" },
  { subj:5, text:"ทำไมเราต้องช่วยกันดูแลของใช้ส่วนรวม", opts:["เพราะเป็นของเราคนเดียว","เพราะอยากให้พังเร็ว","เพราะทุกคนต้องใช้ร่วมกัน"], ans:2, exp:"ของส่วนรวมเป็นของทุกคน ถ้าดูแลดี ทุกคนก็ได้ใช้นานๆ" }
];
const subjNames = {
  1:"📖 วิชาภาษาไทย",
  2:"🔢 วิชาคณิตศาสตร์",
  3:"🔤 วิชาภาษาอังกฤษ",
  4:"🔬 วิชาวิทยาศาสตร์",
  5:"🏡 วิชาสังคมศึกษา"
};
const subjShort = { 1:"📖 ภาษาไทย", 2:"🔢 คณิตศาสตร์", 3:"🔤 ภาษาอังกฤษ", 4:"🔬 วิทยาศาสตร์", 5:"🏡 สังคมศึกษา" };

const selected = {};
const checkedSubj = {};
const scoreSubj = {};
let cur = 1;
const SUBJS = [1,2,3,4,5];

function qsOf(s){ return questions.map((q,i)=>({q,i})).filter(o=>o.q.subj===s); }

function renderTabs(){
  const t = document.getElementById('tabs');
  t.innerHTML = '';
  SUBJS.forEach(s=>{
    const b = document.createElement('button');
    b.className = 'tab' + (s===cur?' active':'') + (checkedSubj[s]?' done':'');
    const short = subjShort[s];
    b.innerHTML = short + '<span class="tn">' + (checkedSubj[s] ? (scoreSubj[s]+'/'+qsOf(s).length) : '20 ข้อ') + '</span>';
    b.onclick = ()=>{ cur = s; render(); window.scrollTo({top:0,behavior:'smooth'}); };
    t.appendChild(b);
  });
}

function render(){
  renderTabs();
  const box = document.getElementById('quiz');
  box.innerHTML = '';
  const title = document.createElement('div');
  title.className = 'subject-title';
  title.textContent = subjNames[cur];
  box.appendChild(title);

  qsOf(cur).forEach((o, n)=>{
    const q = o.q, i = o.i;
    const card = document.createElement('div');
    card.className = 'q';
    let html = '<div class="text"><span class="num">'+(n+1)+'</span>'+q.text+'</div>';
    q.opts.forEach((op, oi)=>{
      let cls = 'opt';
      if (checkedSubj[cur]) {
        if (oi === q.ans) cls += ' correct';
        else if (oi === selected[i]) cls += ' wrong';
      } else if (selected[i] === oi) cls += ' sel';
      html += '<button class="'+cls+'" data-q="'+i+'" data-o="'+oi+'" onclick="pick('+i+','+oi+')">'+op+'</button>';
    });
    html += '<div class="explain'+(checkedSubj[cur]?' show':'')+'" id="exp-'+i+'">💡 เฉลย: '+q.opts[q.ans]+' — '+q.exp+'</div>';
    card.innerHTML = html;
    box.appendChild(card);
  });

  const sb = document.getElementById('scorebox');
  if (checkedSubj[cur]) showScore(scoreSubj[cur], qsOf(cur).length); else sb.classList.remove('show');
  updateProgress();
  renderTotal();
}

function updateProgress(){
  const list = qsOf(cur);
  const done = list.filter(o=>selected[o.i]!==undefined).length;
  document.getElementById('progress').textContent = 'ทำไปแล้ว ' + done + ' / ' + list.length + ' ข้อ';
}

function pick(qi, oi){
  if (checkedSubj[questions[qi].subj]) return;
  selected[qi] = oi;
  document.querySelectorAll('.opt[data-q="'+qi+'"]').forEach(b=>b.classList.remove('sel'));
  document.querySelector('.opt[data-q="'+qi+'"][data-o="'+oi+'"]').classList.add('sel');
  updateProgress();
}

function checkSubject(){
  const list = qsOf(cur);
  let score = 0;
  list.forEach(o=>{ if (selected[o.i] === o.q.ans) score++; });
  checkedSubj[cur] = true;
  scoreSubj[cur] = score;
  render();
  document.getElementById('scorebox').scrollIntoView({behavior:'smooth'});
}

function resetSubject(){
  qsOf(cur).forEach(o=>{ delete selected[o.i]; });
  delete checkedSubj[cur];
  delete scoreSubj[cur];
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function nextSubject(){
  cur = cur % 5 + 1;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function showScore(score, total){
  const pct = score/total;
  let praise, emoji;
  if (pct === 1) { praise = "สุดยอดมากลูก! เต็มทุกข้อเลย!"; emoji="🏆🎉"; }
  else if (pct >= 0.8) { praise = "เก่งมากๆ เลยลูก! ใกล้เต็มแล้ว!"; emoji="🌟😍"; }
  else if (pct >= 0.6) { praise = "ดีมากลูก! เก่งขึ้นเยอะเลย!"; emoji="😊👍"; }
  else { praise = "เก่งมากที่ตั้งใจทำ! ลองใหม่ได้อีกนะ!"; emoji="🤗💪"; }
  const sb = document.getElementById('scorebox');
  sb.innerHTML = '<div>'+subjShort[cur]+'</div><div class="big-score">'+score+' / '+total+' '+emoji+'</div><div class="praise">'+praise+'</div>';
  sb.classList.add('show');
}

function renderTotal(){
  const el = document.getElementById('total');
  const doneSubjs = SUBJS.filter(s=>checkedSubj[s]);
  if (!doneSubjs.length) { el.innerHTML = '<h3>📋 ตรวจวิชาไหนแล้ว คะแนนจะมาโชว์ตรงนี้</h3>'; return; }
  let sum = 0, tot = 0, rows = '';
  SUBJS.forEach(s=>{
    const n = qsOf(s).length;
    if (checkedSubj[s]) { sum += scoreSubj[s]; tot += n; rows += '<div class="row"><span>'+subjShort[s]+'</span><span>'+scoreSubj[s]+' / '+n+'</span></div>'; }
  });
  rows += '<div class="row"><span>รวมทั้งหมด</span><span>'+sum+' / '+tot+'</span></div>';
  el.innerHTML = '<h3>🏅 สรุปคะแนน</h3>' + rows;
}

render();
</script>
</body>
</html>
