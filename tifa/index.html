<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ข้อสอบฝึกทีฟา ป.1 - 16 ต.ค. 2026 (100 ข้อ)</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Comic Sans MS', 'Tahoma', sans-serif; margin:0; padding:0; background: linear-gradient(160deg, #fff3e0 0%, #ffe0f0 100%); color:#333; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 14px; }
  header { text-align:center; background: #ff8fab; color:#fff; border-radius:24px; padding:18px 14px; margin-bottom:14px; box-shadow: 0 6px 0 #f06292; }
  header h1 { margin:0 0 6px; font-size: 28px; }
  header .meta { font-size: 17px; opacity:.95; }
  .tabs { display:grid; grid-template-columns: repeat(5, 1fr); gap:6px; margin-bottom:14px; }
  .tab { font-family:inherit; font-size: 15px; font-weight:bold; border:none; border-radius:14px;
         padding:10px 4px; cursor:pointer; background:#fff; color:#555; box-shadow:0 3px 0 #ddd; line-height:1.3; }
  .tab .tn { display:block; font-size: 12px; font-weight:normal; opacity:.75; margin-top:2px; }
  .tab.active { background: #7c4dff; color:#fff; box-shadow:0 3px 0 #5e35b1; }
  .tab.done { background:#c8e6c9; color:#2e7d32; box-shadow:0 3px 0 #a5d6a7; }
  .tab.done.active { background: #7c4dff; color:#fff; box-shadow:0 3px 0 #5e35b1; }
  .subject-title { font-size: 22px; font-weight:bold; color:#fff; background: #7c4dff; border-radius:18px;
                   padding:12px 18px; margin: 6px 0 12px; box-shadow:0 4px 0 #5e35b1; text-align:center; }
  .progress { text-align:center; font-size: 17px; color:#777; margin-bottom:10px; }
  .q { background:#fff; border-radius:20px; padding:16px; margin-bottom:14px; box-shadow:0 4px 10px rgba(0,0,0,.08); }
  .q .num { display:inline-block; background:#ffca28; color:#5d4037; font-weight:bold; border-radius:50%;
            width:36px; height:36px; line-height:36px; text-align:center; font-size:18px; margin-right:8px; }
  .q .text { font-size: 23px; font-weight:bold; margin:4px 0 12px; }
  .opt { display:block; width:100%; text-align:left; font-size: 22px; font-family:inherit;
         background:#f5f5f5; border:3px solid #e0e0e0; border-radius:16px; padding:12px 16px; margin-bottom:9px; cursor:pointer; transition:.12s; }
  .opt:active { transform: scale(.98); }
  .opt.sel { background:#bbdefb; border-color:#2196f3; }
  .opt.correct { background:#c8e6c9; border-color:#43a047; }
  .opt.wrong { background:#ffcdd2; border-color:#e53935; }
  .explain { display:none; font-size: 18px; background:#fff8e1; border-left:6px solid #ffb300;
             border-radius:10px; padding:10px 14px; margin-top:10px; color:#6d4c00; }
  .explain.show { display:block; }
  .btnbar { text-align:center; margin:20px 0; }
  button.big { font-family:inherit; font-size: 21px; font-weight:bold; color:#fff; border:none;
               border-radius:20px; padding:14px 24px; margin:6px; cursor:pointer; }
  .checkBtn { background:#43a047; box-shadow:0 5px 0 #2e7d32; }
  .resetBtn { background:#78909c; box-shadow:0 5px 0 #546e7a; }
  .nextBtn  { background:#5c6bc0; box-shadow:0 5px 0 #3949ab; }
  button.big:active { transform: translateY(3px); box-shadow:none; }
  .scorebox { display:none; text-align:center; font-size: 24px; font-weight:bold; background:#fff;
              border-radius:24px; padding:20px; margin:16px 0; box-shadow:0 6px 14px rgba(0,0,0,.12); }
  .scorebox.show { display:block; }
  .scorebox .big-score { font-size: 42px; color:#ff6f00; }
  .scorebox .praise { font-size: 21px; margin-top:8px; }
  .total { background:#fff; border-radius:20px; padding:16px; margin:16px 0; box-shadow:0 4px 10px rgba(0,0,0,.08); }
  .total h3 { margin:0 0 10px; text-align:center; font-size: 22px; color:#555; }
  .total .row { display:flex; justify-content:space-between; font-size: 18px; padding:7px 4px; border-bottom:1px dashed #eee; }
  .total .row:last-child { border-bottom:none; font-weight:bold; color:#ff6f00; }
  footer { text-align:center; color:#999; font-size:14px; padding:18px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌟 ข้อสอบฝึกของหนูทีฟา 🌟</h1>
    <div class="meta">ชั้น ป.1 &nbsp;•&nbsp; วันที่ 16 ต.ค. 2026 🎉</div>
    <div class="meta">5 วิชา วิชาละ 20 ข้อ &nbsp;•&nbsp; รวม 100 ข้อ 💯</div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="progress" id="progress"></div>
  <div id="quiz"></div>

  <div class="btnbar">
    <button class="big checkBtn" onclick="checkSubject()">✅ ตรวจวิชานี้</button>
    <button class="big nextBtn" onclick="nextSubject()">➡️ วิชาถัดไป</button>
    <button class="big resetBtn" onclick="resetSubject()">🔄 ทำวิชานี้ใหม่</button>
  </div>

  <div class="scorebox" id="scorebox"></div>
  <div class="total" id="total"></div>

  <footer>JND • ฝึกทำทุกวัน เก่งขึ้นทุกวัน 💪</footer>
</div>

<script>
const questions = [
  // ===== ภาษาไทย (20 ข้อ) =====
  // (ก) คำที่มีความหมายตรงข้าม 10 ข้อ
  { subj:1, text:"คำตรงข้ามกับ “ร้อน” 🔥 คือคำใด?", opts:["อุ่น","เย็น","แดด"], ans:1, exp:"“ร้อน” ตรงข้ามกับ “เย็น” 🧊" },
  { subj:1, text:"คำว่า “สูง” 🦒 ตรงข้ามกับคำใด?", opts:["ต่ำ","ใหญ่","ยาว"], ans:0, exp:"“สูง” ตรงข้ามกับ “ต่ำ”" },
  { subj:1, text:"เติมคำตรงข้ามกับ “ใหญ่” 👉 ช้าง 🐘 ตัวใหญ่ แต่มด 🐜 ตัว ___", opts:["ยาว","หนัก","เล็ก"], ans:2, exp:"“ใหญ่” ตรงข้ามกับ “เล็ก” มดตัวเล็กมาก" },
  { subj:1, text:"คำตรงข้ามกับ “กลางวัน” ☀️ คือคำใด?", opts:["ตอนเช้า","กลางคืน","ตอนเที่ยง"], ans:1, exp:"“กลางวัน” ตรงข้ามกับ “กลางคืน” 🌙" },
  { subj:1, text:"เติมคำตรงข้ามกับ “ช้า” 👉 เต่า 🐢 เดินช้า แต่กระต่าย 🐇 วิ่ง ___", opts:["เร็ว","ช้า","เบา"], ans:0, exp:"“ช้า” ตรงข้ามกับ “เร็ว” กระต่ายวิ่งเร็ว" },
  { subj:1, text:"คำว่า “เปิด” 🚪 ตรงข้ามกับคำใด?", opts:["ผลัก","ปิด","ดึง"], ans:1, exp:"เปิดประตู ตรงข้ามกับ ปิดประตู" },
  { subj:1, text:"คำตรงข้ามกับ “ขาว” ⚪ คือคำใด?", opts:["เหลือง","แดง","ดำ"], ans:2, exp:"“ขาว” ตรงข้ามกับ “ดำ” ⚫" },
  { subj:1, text:"เติมคำตรงข้ามกับ “หนัก” 👉 กระเป๋านักเรียน 🎒 หนัก แต่ลูกโป่ง 🎈 ___", opts:["เบา","หนัก","ใหญ่"], ans:0, exp:"“หนัก” ตรงข้ามกับ “เบา” ลูกโป่งเบามาก" },
  { subj:1, text:"คู่ใดเป็นคำตรงข้ามกัน?", opts:["ยิ้ม – หัวเราะ","กิน – ดื่ม","ขึ้น – ลง"], ans:2, exp:"ขึ้น กับ ลง มีความหมายตรงข้ามกัน ⬆️⬇️" },
  { subj:1, text:"เติมคำตรงข้ามกับ “สว่าง” 👉 ปิดไฟแล้ว ห้องจะ ___ 💡", opts:["สะอาด","มืด","กว้าง"], ans:1, exp:"“สว่าง” ตรงข้ามกับ “มืด”" },
  // (ข) การอ่านจับใจความนิทาน/เรื่องสั้น 10 ข้อ
  { subj:1, text:"อ่านเรื่องสั้น 📖 “น้องมะลิไปตลาดกับแม่ 🛒 แม่ซื้อส้มให้น้องมะลิ 1 ถุง” ใครไปตลาดกับแม่?", opts:["พ่อ","ยาย","น้องมะลิ"], ans:2, exp:"ในเรื่องบอกว่า น้องมะลิไปตลาดกับแม่" },
  { subj:1, text:"อ่านเรื่องสั้น 📖 “ต้นข้าวปลูกดอกทานตะวัน 🌻 ที่หน้าบ้าน ต้นข้าวรดน้ำให้ทุกเช้า” ต้นข้าวปลูกดอกทานตะวันที่ไหน?", opts:["ในห้องนอน","หน้าบ้าน","หลังโรงเรียน"], ans:1, exp:"ในเรื่องบอกว่า ปลูกที่หน้าบ้าน" },
  { subj:1, text:"อ่านเรื่องสั้น 📖 “ลูกแมวชื่อส้มหิวมาก 🐱 มันจึงร้องเหมียว ๆ เรียกแม่แมว” ทำไมส้มจึงร้องเรียกแม่?", opts:["เพราะง่วงนอน","เพราะกลัวฝน","เพราะหิว"], ans:2, exp:"ในเรื่องบอกว่า ส้มหิวมาก จึงร้องเรียกแม่" },
  { subj:1, text:"อ่านเรื่องสั้น 📖 “วันนี้ฝนตก ☔ ภูมิจึงกางร่มเดินไปโรงเรียน” ภูมิทำอะไรตอนไปโรงเรียน?", opts:["ว่ายน้ำ","กางร่ม","ขี่จักรยาน"], ans:1, exp:"ฝนตก ภูมิจึงกางร่มเดินไปโรงเรียน" },
  { subj:1, text:"อ่านเรื่องสั้น 📖 “ลุงชัยมีวัว 3 ตัว 🐄 ทุกเย็นลุงชัยพาวัวไปกินหญ้าที่ทุ่งนา” ลุงชัยพาวัวไปกินหญ้าที่ไหน?", opts:["ทุ่งนา","สวนสัตว์","ริมทะเล"], ans:0, exp:"ในเรื่องบอกว่า พาวัวไปกินหญ้าที่ทุ่งนา" },
  { subj:1, text:"อ่านเรื่องสั้น 📖 “แพรวทำแก้วน้ำแตก 🥛 แพรวรีบไปบอกแม่และกล่าวขอโทษ” แพรวทำอะไรหลังจากทำแก้วแตก?", opts:["เอาแก้วไปซ่อน","บอกแม่และขอโทษ","วิ่งหนีออกไปเล่น"], ans:1, exp:"แพรวรีบไปบอกแม่และขอโทษ เป็นเด็กดีซื่อสัตย์" },
  { subj:1, text:"อ่านเรื่องสั้น 📖 “กระรอกน้อย 🐿️ เก็บลูกไม้ไว้ในโพรงต้นไม้ เพราะกลัวว่าหน้าหนาวจะไม่มีอาหารกิน” ทำไมกระรอกจึงเก็บลูกไม้ไว้?", opts:["กลัวหน้าหนาวไม่มีอาหาร","อยากแบ่งให้นก","ลูกไม้เน่าแล้ว"], ans:0, exp:"ในเรื่องบอกว่า กลัวหน้าหนาวจะไม่มีอาหารกิน" },
  { subj:1, text:"อ่านเรื่องสั้น 📖 “เต้ยได้ลูกบอล ⚽ เป็นของขวัญวันเกิด เต้ยชวนเพื่อนมาเตะบอลที่สนาม” เต้ยได้อะไรเป็นของขวัญวันเกิด?", opts:["หนังสือ","ตุ๊กตา","ลูกบอล"], ans:2, exp:"ในเรื่องบอกว่า เต้ยได้ลูกบอลเป็นของขวัญ" },
  { subj:1, text:"อ่านเรื่องสั้น 📖 “คุณตาพาฟ้าไปสวนสัตว์ 🦒 ฟ้าชอบยีราฟที่สุด เพราะยีราฟคอยาวมาก” ฟ้าชอบสัตว์ตัวใดที่สุด?", opts:["ยีราฟ","ช้าง","ลิง"], ans:0, exp:"ในเรื่องบอกว่า ฟ้าชอบยีราฟที่สุด" },
  { subj:1, text:"อ่านเรื่องสั้น 📖 “มดตัวเล็ก ๆ 🐜 ช่วยกันขนเศษขนมชิ้นใหญ่ ในที่สุดก็ขนกลับรังได้สำเร็จ” เรื่องนี้สอนให้รู้ว่าอะไร?", opts:["ช่วยกันทำงานจะสำเร็จ","ควรกินขนมเยอะ ๆ","ไม่ควรออกจากบ้าน"], ans:0, exp:"มดตัวเล็กแต่ช่วยกันจึงทำสำเร็จ สอนเรื่องความสามัคคี 🤝" },
  // ===== คณิตศาสตร์ (20 ข้อ) =====
  // (ก) การบอกเวลาบนหน้าปัดนาฬิกา 10 ข้อ
  { subj:2, text:"⏰ เข็มสั้นชี้ที่ 3 เข็มยาวชี้ที่ 12 เป็นเวลาเท่าไร?", opts:["3 นาฬิกา","12 นาฬิกา","3 นาฬิกา 30 นาที"], ans:0, exp:"เข็มสั้นบอกชั่วโมง ชี้ที่ 3 · เข็มยาวชี้ที่ 12 แปลว่าเป็นชั่วโมงเต็ม จึงเป็น 3 นาฬิกา" },
  { subj:2, text:"⏰ เข็มสั้นชี้ที่ 9 เข็มยาวชี้ที่ 12 เป็นเวลาเท่าไร?", opts:["12 นาฬิกา","9 นาฬิกา","9 นาฬิกา 30 นาที"], ans:1, exp:"เข็มสั้นชี้ที่ 9 และเข็มยาวชี้ที่ 12 คือชั่วโมงเต็ม จึงเป็น 9 นาฬิกา" },
  { subj:2, text:"⏰ เข็มยาวชี้ที่ 6 เข็มสั้นอยู่ระหว่าง 4 กับ 5 เป็นเวลาเท่าไร?", opts:["5 นาฬิกา 30 นาที","6 นาฬิกา","4 นาฬิกา 30 นาที"], ans:2, exp:"เข็มสั้นเพิ่งเลย 4 แต่ยังไม่ถึง 5 จึงยังเป็นชั่วโมงที่ 4 · เข็มยาวชี้ที่ 6 = 30 นาที" },
  { subj:2, text:"เข็มยาวชี้ที่เลข 6 หมายถึงกี่นาที?", opts:["6 นาที","30 นาที","60 นาที"], ans:1, exp:"เข็มยาวเดินครบรอบ = 60 นาที ชี้ที่ 6 คือครึ่งรอบ = 30 นาที" },
  { subj:2, text:"บนหน้าปัดนาฬิกา เข็มสั้นบอกอะไร?", opts:["บอกชั่วโมง","บอกนาที","บอกวันที่"], ans:0, exp:"เข็มสั้นบอกชั่วโมง ส่วนเข็มยาวบอกนาที" },
  { subj:2, text:"เวลาเป็นชั่วโมงเต็ม เช่น 6 นาฬิกา เข็มยาวจะชี้ที่เลขอะไร?", opts:["6","3","12"], ans:2, exp:"ทุกครั้งที่เป็นชั่วโมงเต็ม เข็มยาวจะชี้ที่เลข 12" },
  { subj:2, text:"ตอนนี้เข็มสั้นชี้ที่ 2 เข็มยาวชี้ที่ 12 (2 นาฬิกา) อีก 1 ชั่วโมงจะเป็นเวลาเท่าไร?", opts:["3 นาฬิกา","1 นาฬิกา","2 นาฬิกา 30 นาที"], ans:0, exp:"2 นาฬิกา เพิ่มอีก 1 ชั่วโมง เข็มสั้นเดินไปที่ 3 = 3 นาฬิกา" },
  { subj:2, text:"ทีฟาเริ่มวาดรูปตอน 7 นาฬิกา 30 นาที วาดอยู่ 1 ชั่วโมง 🎨 วาดเสร็จตอนกี่โมง?", opts:["8 นาฬิกา","8 นาฬิกา 30 นาที","7 นาฬิกา"], ans:1, exp:"เพิ่ม 1 ชั่วโมงจาก 7 นาฬิกา 30 นาที นาทีเท่าเดิม ชั่วโมงเป็น 8 = 8 นาฬิกา 30 นาที" },
  { subj:2, text:"เวลา 11 นาฬิกา 30 นาที เข็มสั้นอยู่ตรงไหน?", opts:["ชี้ตรงที่ 11 พอดี","ชี้ตรงที่ 6 พอดี","อยู่ระหว่าง 11 กับ 12"], ans:2, exp:"ตอนครึ่งชั่วโมง เข็มสั้นเดินไปครึ่งทาง จึงอยู่ระหว่าง 11 กับ 12" },
  { subj:2, text:"ตัวเลขบนหน้าปัดนาฬิกา มีเลข 1 ถึงเลขอะไร? 🕰️", opts:["12","10","20"], ans:0, exp:"หน้าปัดนาฬิกามีตัวเลข 1 ถึง 12" },
  // (ข) แบบรูปและความสัมพันธ์ 10 ข้อ
  { subj:2, text:"แบบรูป 2, 4, 6, 8, ? เลขถัดไปคืออะไร?", opts:["9","12","10"], ans:2, exp:"เพิ่มขึ้นทีละ 2 → 8 + 2 = 10" },
  { subj:2, text:"แบบรูป 5, 10, 15, 20, ? เลขถัดไปคืออะไร?", opts:["25","21","30"], ans:0, exp:"เพิ่มขึ้นทีละ 5 → 20 + 5 = 25" },
  { subj:2, text:"แบบรูป 10, 20, 30, 40, ? เลขถัดไปคืออะไร?", opts:["41","50","60"], ans:1, exp:"เพิ่มขึ้นทีละ 10 → 40 + 10 = 50" },
  { subj:2, text:"แบบรูป 9, 8, 7, 6, ? เลขถัดไปคืออะไร?", opts:["5","7","4"], ans:0, exp:"ลดลงทีละ 1 → 6 − 1 = 5" },
  { subj:2, text:"🔴🔵🔴🔵🔴 ? รูปถัดไปคืออะไร?", opts:["🔴","🟢","🔵"], ans:2, exp:"สลับแดง-น้ำเงิน หลังแดงต้องเป็นน้ำเงิน 🔵" },

  { subj:5, text:"คนแปลกหน้าชวนไปซื้อขนม เราควรทำอย่างไร 🍭", opts:["ไปด้วยเลย","ไม่ไปด้วย แล้วรีบบอกพ่อแม่หรือครู","ขึ้นรถไปกับเขา"], ans:1, exp:"ห้ามไปกับคนแปลกหน้า ต้องปฏิเสธแล้วรีบบอกผู้ใหญ่ที่ไว้ใจ" },
  { subj:5, text:"ที่โรงอาหาร มีคนรอซื้ออาหารหลายคน เราควรทำอย่างไร 🍱", opts:["แซงคิวไปข้างหน้า","เข้าแถวรอตามลำดับ","ผลักเพื่อนออกไป"], ans:1, exp:"การเข้าแถวรอตามลำดับ เป็นการทำตามกติกาและมีมารยาท" },
  { subj:5, text:"เด็กเล็กจะข้ามถนน ควรทำอย่างไร 🚗", opts:["วิ่งข้ามคนเดียว","เล่นของเล่นไปด้วยขณะข้าม","จับมือผู้ใหญ่ข้ามไปด้วยกัน"], ans:2, exp:"เด็กเล็กควรข้ามถนนพร้อมผู้ใหญ่ จะปลอดภัยกว่า" },
  { subj:5, text:"เวลาขึ้นลงบันได เราควรทำอย่างไร 🪜", opts:["เดินช้าๆ และจับราวบันได","วิ่งแข่งกับเพื่อน","กระโดดลงทีละหลายขั้น"], ans:0, exp:"ห้ามวิ่งบนบันได เพราะอาจล้มและบาดเจ็บได้" },
  { subj:5, text:"นั่งซ้อนท้ายรถจักรยานยนต์ ต้องใส่อะไร 🏍️", opts:["หมวกกันน็อก","แว่นกันแดด","หมวกปาร์ตี้"], ans:0, exp:"หมวกกันน็อกช่วยป้องกันศีรษะเมื่อเกิดอุบัติเหตุ" },
  { subj:5, text:"เจอยาเม็ดสีสวยๆ วางอยู่ในบ้าน เราควรทำอย่างไร 💊", opts:["กินเหมือนลูกอม","แบ่งให้เพื่อนกิน","ไม่กิน แล้วบอกผู้ใหญ่"], ans:2, exp:"ยาไม่ใช่ขนม ถ้ากินเองอาจเป็นอันตราย ต้องให้ผู้ใหญ่ดูแล" },
  { subj:5, text:"เห็นคนร้ายขโมยของ ควรโทรแจ้งตำรวจที่เบอร์ใด 👮", opts:["199","191","1669"], ans:1, exp:"เบอร์ 191 คือเบอร์แจ้งเหตุตำรวจ" },
  { subj:5, text:"เกิดไฟไหม้ ควรโทรเบอร์ใด 🔥", opts:["199","191","1669"], ans:0, exp:"เบอร์ 199 คือเบอร์แจ้งเหตุไฟไหม้ (ดับเพลิง)" },
  { subj:5, text:"มีคนเจ็บป่วยฉุกเฉิน ต้องเรียกรถพยาบาล ควรโทรเบอร์ใด 🚑", opts:["191","199","1669"], ans:2, exp:"เบอร์ 1669 คือเบอร์เจ็บป่วยฉุกเฉิน เรียกรถพยาบาลได้" }
];
const subjNames = {
  1:"📖 วิชาภาษาไทย",
  2:"🔢 วิชาคณิตศาสตร์",
  3:"🔤 วิชาภาษาอังกฤษ",
  4:"🔬 วิชาวิทยาศาสตร์",
  5:"🏡 วิชาสังคมศึกษา"
};
const subjShort = { 1:"📖 ภาษาไทย", 2:"🔢 คณิตศาสตร์", 3:"🔤 ภาษาอังกฤษ", 4:"🔬 วิทยาศาสตร์", 5:"🏡 สังคมศึกษา" };

const selected = {};
const checkedSubj = {};
const scoreSubj = {};
let cur = 1;
const SUBJS = [1,2,3,4,5];

function qsOf(s){ return questions.map((q,i)=>({q,i})).filter(o=>o.q.subj===s); }

function renderTabs(){
  const t = document.getElementById('tabs');
  t.innerHTML = '';
  SUBJS.forEach(s=>{
    const b = document.createElement('button');
    b.className = 'tab' + (s===cur?' active':'') + (checkedSubj[s]?' done':'');
    const short = subjShort[s];
    b.innerHTML = short + '<span class="tn">' + (checkedSubj[s] ? (scoreSubj[s]+'/'+qsOf(s).length) : '20 ข้อ') + '</span>';
    b.onclick = ()=>{ cur = s; render(); window.scrollTo({top:0,behavior:'smooth'}); };
    t.appendChild(b);
  });
}

function render(){
  renderTabs();
  const box = document.getElementById('quiz');
  box.innerHTML = '';
  const title = document.createElement('div');
  title.className = 'subject-title';
  title.textContent = subjNames[cur];
  box.appendChild(title);

  qsOf(cur).forEach((o, n)=>{
    const q = o.q, i = o.i;
    const card = document.createElement('div');
    card.className = 'q';
    let html = '<div class="text"><span class="num">'+(n+1)+'</span>'+q.text+'</div>';
    q.opts.forEach((op, oi)=>{
      let cls = 'opt';
      if (checkedSubj[cur]) {
        if (oi === q.ans) cls += ' correct';
        else if (oi === selected[i]) cls += ' wrong';
      } else if (selected[i] === oi) cls += ' sel';
      html += '<button class="'+cls+'" data-q="'+i+'" data-o="'+oi+'" onclick="pick('+i+','+oi+')">'+op+'</button>';
    });
    html += '<div class="explain'+(checkedSubj[cur]?' show':'')+'" id="exp-'+i+'">💡 เฉลย: '+q.opts[q.ans]+' — '+q.exp+'</div>';
    card.innerHTML = html;
    box.appendChild(card);
  });

  const sb = document.getElementById('scorebox');
  if (checkedSubj[cur]) showScore(scoreSubj[cur], qsOf(cur).length); else sb.classList.remove('show');
  updateProgress();
  renderTotal();
}

function updateProgress(){
  const list = qsOf(cur);
  const done = list.filter(o=>selected[o.i]!==undefined).length;
  document.getElementById('progress').textContent = 'ทำไปแล้ว ' + done + ' / ' + list.length + ' ข้อ';
}

function pick(qi, oi){
  if (checkedSubj[questions[qi].subj]) return;
  selected[qi] = oi;
  document.querySelectorAll('.opt[data-q="'+qi+'"]').forEach(b=>b.classList.remove('sel'));
  document.querySelector('.opt[data-q="'+qi+'"][data-o="'+oi+'"]').classList.add('sel');
  updateProgress();
}

function checkSubject(){
  const list = qsOf(cur);
  let score = 0;
  list.forEach(o=>{ if (selected[o.i] === o.q.ans) score++; });
  checkedSubj[cur] = true;
  scoreSubj[cur] = score;
  render();
  document.getElementById('scorebox').scrollIntoView({behavior:'smooth'});
}

function resetSubject(){
  qsOf(cur).forEach(o=>{ delete selected[o.i]; });
  delete checkedSubj[cur];
  delete scoreSubj[cur];
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function nextSubject(){
  cur = cur % 5 + 1;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function showScore(score, total){
  const pct = score/total;
  let praise, emoji;
  if (pct === 1) { praise = "สุดยอดมากลูก! เต็มทุกข้อเลย!"; emoji="🏆🎉"; }
  else if (pct >= 0.8) { praise = "เก่งมากๆ เลยลูก! ใกล้เต็มแล้ว!"; emoji="🌟😍"; }
  else if (pct >= 0.6) { praise = "ดีมากลูก! เก่งขึ้นเยอะเลย!"; emoji="😊👍"; }
  else { praise = "เก่งมากที่ตั้งใจทำ! ลองใหม่ได้อีกนะ!"; emoji="🤗💪"; }
  const sb = document.getElementById('scorebox');
  sb.innerHTML = '<div>'+subjShort[cur]+'</div><div class="big-score">'+score+' / '+total+' '+emoji+'</div><div class="praise">'+praise+'</div>';
  sb.classList.add('show');
}

function renderTotal(){
  const el = document.getElementById('total');
  const doneSubjs = SUBJS.filter(s=>checkedSubj[s]);
  if (!doneSubjs.length) { el.innerHTML = '<h3>📋 ตรวจวิชาไหนแล้ว คะแนนจะมาโชว์ตรงนี้</h3>'; return; }
  let sum = 0, tot = 0, rows = '';
  SUBJS.forEach(s=>{
    const n = qsOf(s).length;
    if (checkedSubj[s]) { sum += scoreSubj[s]; tot += n; rows += '<div class="row"><span>'+subjShort[s]+'</span><span>'+scoreSubj[s]+' / '+n+'</span></div>'; }
  });
  rows += '<div class="row"><span>รวมทั้งหมด</span><span>'+sum+' / '+tot+'</span></div>';
  el.innerHTML = '<h3>🏅 สรุปคะแนน</h3>' + rows;
}

render();
</script>
</body>
</html>
