<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ข้อสอบฝึกทีฟา ป.1 - 28 ก.ค. 2026 (ชุด D)</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Comic Sans MS', 'Tahoma', sans-serif;
    margin: 0; padding: 0;
    background: linear-gradient(160deg, #fff3e0 0%, #ffe0f0 100%);
    color: #333;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 16px; }
  header {
    text-align: center; background: #ff8fab; color: #fff;
    border-radius: 24px; padding: 20px 16px; margin-bottom: 16px;
    box-shadow: 0 6px 0 #f06292;
  }
  header h1 { margin: 0 0 6px; font-size: 30px; }
  header .meta { font-size: 18px; opacity: .95; }
  .subject-title {
    font-size: 24px; font-weight: bold; color: #fff;
    background: #7c4dff; border-radius: 18px;
    padding: 12px 18px; margin: 22px 0 12px;
    box-shadow: 0 4px 0 #5e35b1; text-align: center;
  }
  .subject-title.s2 { background: #26a69a; box-shadow: 0 4px 0 #00897b; }
  .q {
    background: #fff; border-radius: 20px; padding: 18px;
    margin-bottom: 16px; box-shadow: 0 4px 10px rgba(0,0,0,.08);
  }
  .q .num {
    display: inline-block; background: #ffca28; color: #5d4037;
    font-weight: bold; border-radius: 50%; width: 38px; height: 38px;
    line-height: 38px; text-align: center; font-size: 20px; margin-right: 8px;
  }
  .q .text { font-size: 24px; font-weight: bold; margin: 6px 0 14px; }
  .opt {
    display: block; width: 100%; text-align: left;
    font-size: 23px; font-family: inherit;
    background: #f5f5f5; border: 3px solid #e0e0e0;
    border-radius: 16px; padding: 14px 18px; margin-bottom: 10px;
    cursor: pointer; transition: .12s;
  }
  .opt:active { transform: scale(.98); }
  .opt.sel { background: #bbdefb; border-color: #2196f3; }
  .opt.correct { background: #c8e6c9; border-color: #43a047; }
  .opt.wrong { background: #ffcdd2; border-color: #e53935; }
  .explain {
    display: none; font-size: 19px; background: #fff8e1;
    border-left: 6px solid #ffb300; border-radius: 10px;
    padding: 10px 14px; margin-top: 10px; color: #6d4c00;
  }
  .explain.show { display: block; }
  .btnbar { text-align: center; margin: 24px 0; }
  button.big {
    font-family: inherit; font-size: 24px; font-weight: bold;
    color: #fff; border: none; border-radius: 20px;
    padding: 16px 28px; margin: 8px; cursor: pointer;
  }
  #checkBtn { background: #43a047; box-shadow: 0 5px 0 #2e7d32; }
  #resetBtn { background: #78909c; box-shadow: 0 5px 0 #546e7a; }
  button.big:active { transform: translateY(3px); box-shadow: none; }
  #scorebox {
    display: none; text-align: center; font-size: 28px; font-weight: bold;
    background: #fff; border-radius: 24px; padding: 24px;
    margin: 18px 0; box-shadow: 0 6px 14px rgba(0,0,0,.12);
  }
  #scorebox.show { display: block; }
  #scorebox .big-score { font-size: 46px; color: #ff6f00; }
  #scorebox .praise { font-size: 24px; margin-top: 10px; }
  footer { text-align: center; color: #999; font-size: 14px; padding: 20px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌟 ข้อสอบฝึกของหนูทีฟา 🌟</h1>
    <div class="meta">ชั้น ป.1 &nbsp;•&nbsp; วันที่ 28 ก.ค. 2026 &nbsp;•&nbsp; ชุด D 🎉</div>
    <div class="meta">วิชา: วิทยาศาสตร์ 🔬 + การงานอาชีพฯ 🧹</div>
  </header>

  <div id="quiz"></div>

  <div class="btnbar">
    <button class="big" id="checkBtn" onclick="checkAll()">✅ ตรวจคำตอบ</button>
    <button class="big" id="resetBtn" onclick="resetAll()">🔄 ทำใหม่</button>
  </div>

  <div id="scorebox"></div>

  <footer>JND • ฝึกทำทุกวัน เก่งขึ้นทุกวัน 💪</footer>
</div>

<script>
const questions = [
  // ===== วิทยาศาสตร์: สิ่งมีชีวิตและสิ่งไม่มีชีวิต (10 ข้อ) =====
  { subj:1, text:"ข้อใดเป็น “สิ่งมีชีวิต”?", opts:["ก้อนหิน","ต้นไม้ 🌳","โต๊ะ"], ans:1, exp:"ต้นไม้เติบโตและต้องการอาหาร จึงเป็นสิ่งมีชีวิต" },
  { subj:1, text:"ข้อใดเป็น “สิ่งไม่มีชีวิต”?", opts:["สุนัข","นก","รถยนต์ 🚗"], ans:2, exp:"รถยนต์ไม่กินอาหารและไม่เติบโต จึงเป็นสิ่งไม่มีชีวิต" },
  { subj:1, text:"สิ่งมีชีวิตต้องการอะไรเพื่อการเจริญเติบโต?", opts:["ไม่ต้องการอะไร","อาหารและน้ำ","แสงไฟนีออน"], ans:1, exp:"สิ่งมีชีวิตต้องการอาหาร น้ำ และอากาศ" },
  { subj:1, text:"ข้อใดคือลักษณะของสิ่งมีชีวิต?", opts:["อยู่นิ่งตลอดไป","เคลื่อนไหวและเติบโตได้","ไม่กินอาหาร"], ans:1, exp:"สิ่งมีชีวิตเคลื่อนไหว เติบโต และกินอาหารได้" },
  { subj:1, text:"แมว 🐱 เป็นสิ่งมีชีวิตหรือสิ่งไม่มีชีวิต?", opts:["สิ่งมีชีวิต","สิ่งไม่มีชีวิต","ไม่ใช่ทั้งสอง"], ans:0, exp:"แมวกินอาหาร เติบโต มีลูกได้ จึงเป็นสิ่งมีชีวิต" },
  { subj:1, text:"ก้อนหิน เป็นสิ่งมีชีวิตหรือสิ่งไม่มีชีวิต?", opts:["สิ่งมีชีวิต","สิ่งไม่มีชีวิต","เป็นต้นไม้"], ans:1, exp:"ก้อนหินไม่เติบโต ไม่กินอาหาร จึงเป็นสิ่งไม่มีชีวิต" },
  { subj:1, text:"ข้อใดเป็นสิ่งมีชีวิตทั้งหมด?", opts:["หิน ดิน น้ำ","คน สัตว์ พืช","โต๊ะ เก้าอี้ ตู้"], ans:1, exp:"คน สัตว์ และพืช ล้วนเป็นสิ่งมีชีวิต" },
  { subj:1, text:"พืชสร้างอาหารเองได้โดยใช้อะไร?", opts:["ความมืด","แสงแดด ☀️","ก้อนหิน"], ans:1, exp:"พืชใช้แสงแดดสร้างอาหารเอง (การสังเคราะห์แสง)" },
  { subj:1, text:"ข้อใดแสดงว่าสิ่งมีชีวิตขยายพันธุ์ (มีลูก) ได้?", opts:["ไก่ออกไข่มีลูกได้ 🐤","รถยนต์มีลูกได้","หินมีลูกได้"], ans:0, exp:"สิ่งมีชีวิตมีลูกได้ เช่น ไก่ออกไข่ฟักเป็นลูกไก่" },
  { subj:1, text:"ปลา 🐟 หายใจด้วยอวัยวะใด?", opts:["ปอด","เหงือก","ผิวหนัง"], ans:1, exp:"ปลาหายใจด้วยเหงือก" },

  // ===== การงานอาชีพฯ: งานบ้านและการช่วยเหลือตนเอง (10 ข้อ) =====
  { subj:2, text:"หลังกินข้าวเสร็จ เราควรทำอย่างไรกับจานของเรา?", opts:["ทิ้งไว้เฉยๆ","เก็บไปล้าง","ซ่อนไว้ใต้โต๊ะ"], ans:1, exp:"เก็บจานไปล้างให้เรียบร้อยหลังกินข้าว 🍽️" },
  { subj:2, text:"เมื่อเล่นของเล่นเสร็จแล้ว เราควรทำอย่างไร?", opts:["เก็บของเล่นเข้าที่","ทิ้งกระจายไว้","ให้คนอื่นเก็บ"], ans:0, exp:"เล่นเสร็จเก็บของเล่นเข้าที่ให้เรียบร้อย 🧸" },
  { subj:2, text:"ก่อนนอน เราควรทำอะไรกับที่นอน/ห้องของเรา?", opts:["รื้อให้รก","จัดที่นอนให้เรียบร้อย","ไม่ทำอะไร"], ans:1, exp:"จัดที่นอนและห้องให้เป็นระเบียบ" },
  { subj:2, text:"การช่วยพ่อแม่ทำงานบ้าน เป็นสิ่งที่ดีหรือไม่?", opts:["ดี ควรช่วย","ไม่ดี","ไม่เกี่ยวกับเรา"], ans:0, exp:"ช่วยพ่อแม่ทำงานบ้านเป็นสิ่งที่ดี 🥰" },
  { subj:2, text:"เมื่อเสื้อผ้าสกปรก เราควรทำอย่างไร?", opts:["ใส่ต่อ","โยนทิ้ง","นำไปซัก"], ans:2, exp:"เสื้อผ้าสกปรกต้องนำไปซักให้สะอาด 👕" },
  { subj:2, text:"อุปกรณ์ที่ใช้กวาดพื้น คืออะไร?", opts:["ช้อน","ไม้กวาด","ดินสอ"], ans:1, exp:"เราใช้ไม้กวาดกวาดพื้น 🧹" },
  { subj:2, text:"ก่อนกินอาหาร เราควรทำอะไรเพื่อความสะอาด?", opts:["ล้างมือ","เล่นดิน","ไม่ทำอะไร"], ans:0, exp:"ล้างมือให้สะอาดก่อนกินอาหาร 🧼" },
  { subj:2, text:"เมื่อทำน้ำหกบนพื้น เราควรทำอย่างไร?", opts:["ปล่อยไว้","เช็ดให้แห้ง","เดินหนี"], ans:1, exp:"เช็ดน้ำที่หกให้แห้ง กันลื่นล้ม" },
  { subj:2, text:"การรดน้ำต้นไม้ 🌱 เป็นงานบ้านประเภทใด?", opts:["ทำอาหาร","ดูแลต้นไม้","ซักผ้า"], ans:1, exp:"รดน้ำต้นไม้คือการดูแลต้นไม้" },
  { subj:2, text:"การแต่งตัวไปโรงเรียนเอง เป็นการช่วยเหลือใคร?", opts:["ช่วยเหลือตนเอง","รบกวนคนอื่น","ไม่มีประโยชน์"], ans:0, exp:"แต่งตัวเองได้ คือการช่วยเหลือตนเอง เก่งมาก 💪" }
];

const subjNames = { 1:"🔬 วิชาวิทยาศาสตร์ — สิ่งมีชีวิตและสิ่งไม่มีชีวิต", 2:"🧹 วิชาการงานอาชีพฯ — งานบ้านและช่วยเหลือตนเอง" };
const selected = {};
let checked = false;

function render() {
  const box = document.getElementById('quiz');
  box.innerHTML = '';
  let lastSubj = null;
  questions.forEach((q, i) => {
    if (q.subj !== lastSubj) {
      const t = document.createElement('div');
      t.className = 'subject-title' + (q.subj===2 ? ' s2' : '');
      t.textContent = subjNames[q.subj];
      box.appendChild(t);
      lastSubj = q.subj;
    }
    const card = document.createElement('div');
    card.className = 'q';
    const numInSubj = questions.slice(0,i+1).filter(x=>x.subj===q.subj).length;
    let html = '<div class="text"><span class="num">'+numInSubj+'</span>'+q.text+'</div>';
    q.opts.forEach((o, oi) => {
      html += '<button class="opt" data-q="'+i+'" data-o="'+oi+'" onclick="pick('+i+','+oi+')">'+o+'</button>';
    });
    html += '<div class="explain" id="exp-'+i+'">💡 เฉลย: '+q.opts[q.ans]+' — '+q.exp+'</div>';
    card.innerHTML = html;
    box.appendChild(card);
  });
}

function pick(qi, oi) {
  if (checked) return;
  selected[qi] = oi;
  document.querySelectorAll('.opt[data-q="'+qi+'"]').forEach(b => b.classList.remove('sel'));
  document.querySelector('.opt[data-q="'+qi+'"][data-o="'+oi+'"]').classList.add('sel');
}

function checkAll() {
  checked = true;
  let score = 0;
  questions.forEach((q, i) => {
    const sel = selected[i];
    document.querySelectorAll('.opt[data-q="'+i+'"]').forEach(b => {
      const oi = +b.dataset.o;
      b.classList.remove('sel');
      if (oi === q.ans) b.classList.add('correct');
      if (oi === sel && sel !== q.ans) b.classList.add('wrong');
    });
    document.getElementById('exp-'+i).classList.add('show');
    if (sel === q.ans) score++;
  });
  showScore(score);
}

function showScore(score) {
  const total = questions.length;
  const pct = score/total;
  let praise, emoji;
  if (pct === 1) { praise = "สุดยอดมากลูก! เต็มทุกข้อเลย!"; emoji="🏆🎉"; }
  else if (pct >= 0.8) { praise = "เก่งมากๆ เลยลูก! ใกล้เต็มแล้ว!"; emoji="🌟😍"; }
  else if (pct >= 0.6) { praise = "ดีมากลูก! เก่งขึ้นเยอะเลย!"; emoji="😊👍"; }
  else { praise = "เก่งมากที่ตั้งใจทำ! ลองใหม่ได้อีกนะ!"; emoji="🤗💪"; }
  const sb = document.getElementById('scorebox');
  sb.innerHTML = '<div>ได้คะแนน</div><div class="big-score">'+score+' / '+total+' '+emoji+'</div><div class="praise">'+praise+'</div>';
  sb.classList.add('show');
  sb.scrollIntoView({behavior:'smooth'});
}

function resetAll() {
  checked = false;
  for (const k in selected) delete selected[k];
  document.getElementById('scorebox').classList.remove('show');
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

render();
</script>
</body>
</html>
